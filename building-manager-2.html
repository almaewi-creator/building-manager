<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة العمارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f1b2d;
    --navy-2:#152238;
    --teal:#0f9c8f;
    --teal-dark:#0b7d73;
    --teal-tint:#e3f6f3;
    --bg:#f5f7f9;
    --card:#ffffff;
    --border:#e6e9ee;
    --text:#16202c;
    --text-dim:#6b7684;
    --amber:#f6c453;
    --amber-tint:#fdf2da;
    --blue-tint:#e6eefc;
    --blue:#3b6fd6;
    --green-tint:#e5f7ec;
    --green:#1f9d55;
    --red:#e0524a;
    --red-tint:#fbe9e8;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal', system-ui, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  #app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:230px;
    background:var(--navy);
    color:#cfd8e3;
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    padding:18px 14px;
  }
  .sidebar-header{
    display:flex;align-items:center;gap:10px;
    padding:6px 6px 18px 6px;
    border-bottom:1px solid rgba(255,255,255,.08);
    margin-bottom:14px;
  }
  .sidebar-logo{
    width:34px;height:34px;border-radius:9px;
    background:#0a1420;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#fff;font-size:15px;flex-shrink:0;
    overflow:hidden;
  }
  .sidebar-logo img{width:100%;height:100%;object-fit:contain;}
  .sidebar-title{font-size:13px;font-weight:700;color:#fff;line-height:1.3;}
  .sidebar-sub{font-size:10.5px;color:#8b97a8;margin-top:1px;}
  .nav{display:flex;flex-direction:column;gap:3px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:9px;
    font-size:13.5px;font-weight:500;
    color:#b8c2d1;cursor:pointer;
    border:none;background:none;text-align:right;width:100%;
    font-family:inherit;
    transition:background .15s,color .15s;
  }
  .nav-item .ic{width:17px;text-align:center;font-size:14px;flex-shrink:0;}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-item.active{background:var(--teal);color:#fff;}
  .sidebar-footer{border-top:1px solid rgba(255,255,255,.08);padding-top:12px;margin-top:8px;}
  .sidebar-user{
    display:flex;align-items:center;gap:9px;
    padding:8px 6px;border-radius:9px;margin-bottom:8px;
  }
  .avatar{width:30px;height:30px;border-radius:50%;background:#26364d;display:flex;align-items:center;justify-content:center;font-size:12px;color:#cfd8e3;flex-shrink:0;}
  .sidebar-user-name{font-size:12px;color:#fff;font-weight:600;}
  .sidebar-user-role{font-size:10.5px;color:#8b97a8;}

  /* Main */
  .main{flex:1;padding:26px 30px;min-width:0;overflow-x:hidden;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
  .eyebrow{font-size:12.5px;color:var(--text-dim);font-weight:500;}
  h1{font-size:24px;font-weight:800;margin:2px 0 4px 0;}
  .page-desc{color:var(--text-dim);font-size:13px;margin:0;}
  .btn{
    background:var(--teal);color:#fff;border:none;border-radius:10px;
    padding:11px 18px;font-size:13.5px;font-weight:700;cursor:pointer;
    font-family:inherit;display:inline-flex;align-items:center;gap:6px;
    transition:background .15s;
  }
  .btn:hover{background:var(--teal-dark);}
  .btn-ghost{background:#fff;color:var(--text);border:1px solid var(--border);}
  .btn-ghost:hover{background:#f4f6f8;}
  .btn-danger{background:var(--red-tint);color:var(--red);}
  .btn-danger:hover{background:#f6d6d3;}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}

  .info-banner{
    background:var(--blue-tint);border:1px solid #d3e0fa;color:#2b4c8f;
    padding:13px 16px;border-radius:12px;font-size:13px;margin-bottom:18px;
  }

  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
  .stat-card .num{font-size:26px;font-weight:800;margin-top:6px;}
  .stat-card .lbl{font-size:12.5px;color:var(--text-dim);font-weight:600;}
  .stat-card.tint-green{background:var(--green-tint);border-color:#cdeedb;}
  .stat-card.tint-blue{background:var(--blue-tint);border-color:#d3e0fa;}
  .stat-card.tint-amber{background:var(--amber-tint);border-color:#f3e3b8;}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .panel-title{font-weight:700;font-size:14.5px;margin-bottom:14px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:right;color:var(--text-dim);font-weight:600;font-size:12px;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#fafbfc;}

  .badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge.green{background:var(--green-tint);color:var(--green);}
  .badge.amber{background:var(--amber-tint);color:#a6791b;}
  .badge.blue{background:var(--blue-tint);color:var(--blue);}
  .badge.red{background:var(--red-tint);color:var(--red);}
  .badge.gray{background:#eef0f3;color:#5c6675;}

  .filters-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .filters-row select, .filters-row input{
    border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13px;
    font-family:inherit;background:#fff;color:var(--text);
  }
  .filters-row input[type=text]{flex:1;min-width:180px;}

  .req-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .req-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .req-tags{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .req-title{font-weight:700;font-size:15px;margin-bottom:4px;}
  .req-desc{font-size:12.5px;color:var(--text-dim);margin-bottom:12px;line-height:1.5;}
  .req-meta{background:#fafbfc;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;color:#3a4453;}
  .req-meta-row{display:flex;justify-content:space-between;padding:3px 0;}
  .req-meta-row b{font-weight:600;color:var(--text);}
  .req-actions{display:flex;gap:8px;margin-top:12px;}

  .icon-btn{background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:14px;padding:4px 6px;border-radius:6px;}
  .icon-btn:hover{background:#eef0f3;color:var(--text);}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,27,45,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;}
  .modal h3{margin:0 0 16px 0;font-size:17px;font-weight:800;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;
    font-size:13.5px;font-family:inherit;color:var(--text);background:#fff;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn,.modal-actions .btn-ghost{flex:1;justify-content:center;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .empty{text-align:center;color:var(--text-dim);font-size:13px;padding:30px 10px;}

  /* Login / setup screen */
  .auth-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--navy);padding:20px;
  }
  .auth-card{
    background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:380px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .auth-logo{
    width:56px;height:56px;border-radius:14px;margin:0 auto 16px auto;
    background:#0a1420;overflow:hidden;
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:19px;
  }
  .auth-logo img{width:100%;height:100%;object-fit:contain;}
  .auth-card h2{text-align:center;font-size:19px;font-weight:800;margin:0 0 4px 0;}
  .auth-card p.sub{text-align:center;color:var(--text-dim);font-size:12.5px;margin:0 0 22px 0;}
  .auth-error{
    background:var(--red-tint);color:var(--red);font-size:12.5px;border-radius:9px;
    padding:9px 12px;margin-bottom:14px;display:none;
  }
  .auth-error.show{display:block;}
  .auth-note{
    background:var(--blue-tint);color:#2b4c8f;font-size:11.5px;border-radius:9px;
    padding:9px 12px;margin-top:16px;line-height:1.6;
  }
  .auth-links{text-align:center;margin-top:14px;}
  .auth-links button{
    background:none;border:none;color:var(--text-dim);font-size:12px;cursor:pointer;
    font-family:inherit;text-decoration:underline;
  }

  @media(max-width:900px){
    #app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;align-items:center;}
    .sidebar-header{border:none;margin:0;padding:0 10px 0 0;}
    .nav{flex-direction:row;}
    .sidebar-footer{display:none;}
    .stats-row{grid-template-columns:repeat(2,1fr);}
    .req-grid{grid-template-columns:1fr;}
    .main{padding:18px 14px;}
  }
</style>
</head>
<body>

<div id="authScreen" class="auth-wrap"></div>

<div id="app" style="display:none;">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo" id="bldgInitial"><img src="" id="bldgLogoImg" alt="شعار"></div>
      <div>
        <div class="sidebar-title" id="bldgName">عمارتي</div>
        <div class="sidebar-sub">لوحة رئيس اتحاد الملاك</div>
      </div>
    </div>
    <div class="nav" id="navList"></div>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar">👤</div>
        <div>
          <div class="sidebar-user-name" id="authUserLabel">رئيس اتحاد الملاك</div>
          <div class="sidebar-user-role">manager@building.local</div>
        </div>
      </div>
      <button class="nav-item" onclick="logout()"><span class="ic">⏻</span><span>تسجيل الخروج</span></button>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>

const hasClaudeStorage = () => typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
let hasLocalStorage = false;
try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); hasLocalStorage = true; }catch(e){ hasLocalStorage = false; }

// Generic persistence: prefer Claude's storage (works inside claude.ai),
// fall back to the browser's own localStorage (works when the file is opened
// directly / hosted anywhere else), so data survives either way.
async function storageGet(key){
  if(hasClaudeStorage()){
    try{ const r = await window.storage.get(key, false); if(r && r.value) return r.value; }catch(e){}
  }
  if(hasLocalStorage){
    try{ const v = localStorage.getItem(key); if(v) return v; }catch(e){}
  }
  return null;
}
async function storageSet(key, value){
  if(hasClaudeStorage()){
    try{ await window.storage.set(key, value, false); }catch(e){}
  }
  if(hasLocalStorage){
    try{ localStorage.setItem(key, value); }catch(e){}
  }
}
async function storageRemove(key){
  if(hasClaudeStorage()){
    try{ await window.storage.delete(key, false); }catch(e){}
  }
  if(hasLocalStorage){
    try{ localStorage.removeItem(key); }catch(e){}
  }
}

async function loadState(){
  const raw = await storageGet(STORE_KEY);
  if(raw){ try{ state = JSON.parse(raw); return; }catch(e){} }
  state = defaultState();
  await saveState();
}
async function saveState(){
  await storageSet(STORE_KEY, JSON.stringify(state));
}

/* ---------------- auth (basic privacy gate, not real security) ---------------- */
const AUTH_KEY = 'building30-auth-v1';
const SESSION_KEY = 'building30-session';

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function getAuth(){
  const raw = await storageGet(AUTH_KEY);
  return raw ? JSON.parse(raw) : null;
}
async function setAuth(username, password){
  const hash = await sha256(password);
  await storageSet(AUTH_KEY, JSON.stringify({username, hash}));
}
function isSessionActive(){
  try{ return sessionStorage.getItem(SESSION_KEY) === '1'; }catch(e){ return false; }
}
function setSessionActive(v){
  try{ if(v) sessionStorage.setItem(SESSION_KEY,'1'); else sessionStorage.removeItem(SESSION_KEY); }catch(e){}
}
function logout(){
  setSessionActive(false);
  location.reload();
}

    el.innerHTML = `
      <div class="auth-card">
        <div class="auth-logo"><img src="${LOGO_URI}" alt="شعار"></div>
        <h2>تسجيل الدخول</h2>
        <p class="sub">${state && state.buildingName ? state.buildingName : 'لوحة إدارة العمارة'}</p>
        <div class="auth-error ${errorMsg?'show':''}">${errorMsg||''}</div>
        <div class="field"><label>اسم المستخدم</label><input id="au-user" autocomplete="username"></div>
        <div class="field"><label>كلمة المرور</label><input id="au-pass" type="password" autocomplete="current-password"></div>
        <button class="btn" style="width:100%;justify-content:center;" onclick="submitLogin()">دخول</button>

    inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ mode==='setup' ? submitSetup() : submitLogin(); } });
  });
}

async function submitSetup(){
  const user = document.getElementById('au-user').value.trim();
  const pass = document.getElementById('au-pass').value;
  const pass2 = document.getElementById('au-pass2').value;
  if(!user || !pass){ showAuthScreen('setup', null, 'الرجاء تعبئة اسم المستخدم وكلمة المرور'); return; }
  if(pass.length < 4){ showAuthScreen('setup', null, 'كلمة المرور قصيرة جدًا (٤ أحرف على الأقل)'); return; }
  if(pass !== pass2){ showAuthScreen('setup', null, 'كلمتا المرور غير متطابقتين'); return; }
  await setAuth(user, pass);
  setSessionActive(true);
  await enterApp();
}
async function submitLogin(){
  const user = document.getElementById('au-user').value.trim();
  const pass = document.getElementById('au-pass').value;
  const auth = await getAuth();
  const hash = await sha256(pass);
  if(!auth || auth.username !== user || auth.hash !== hash){
    showAuthScreen('login', auth, 'اسم المستخدم أو كلمة المرور غير صحيحة');
    return;
  }
  setSessionActive(true);
  await enterApp();
}

  showModal(`

      بيانات العمارة (الوحدات، الملاك، الصيانة...) لن تتأثر وتبقى محفوظة.
    </p>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn-danger" onclick="doResetAuth()">تأكيد إعادة التعيين</button>
    </div>
  `);
}
async function doResetAuth(){
  await storageRemove(AUTH_KEY);
  closeModal();
  showAuthScreen('setup', null, '');
}
async function enterApp(){
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  if(!state) await loadState();
  const auth = await getAuth();
  if(auth) document.getElementById('authUserLabel').textContent = auth.username;
  render();
}

  else if(currentView==='owners') renderOwners(main);
  else if(currentView==='payments') renderPayments(main);
  else if(currentView==='finance') renderFinance(main);
  else if(currentView==='equipment') renderEquipment(main);
  else if(currentView==='maintenance') renderMaintenance(main);
}

function topbar(main, eyebrow, title, desc, actionsHtml){
  const div = document.createElement('div');
  div.className='topbar';
  div.innerHTML = '<div><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1><p class="page-desc">'+desc+'</p></div><div>'+(actionsHtml||'')+'</div>';
  main.appendChild(div);
}

/* ---------------- dashboard ---------------- */
function renderDashboard(main){
  topbar(main, state.buildingName, 'لوحة التحكم', 'نظرة عامة على حالة الأعضاء والاشتراكات والصيانة.');

  const settled = state.units.filter(u=>Number(u.totalDue)>=0).length;
  const owing = state.units.length - settled;
  const totalArrears = state.units.reduce((s,u)=>s+Math.min(0,Number(u.totalDue)),0);
  const activeMnt = state.maintenance.filter(m=>m.status!=='مكتملة').length;
  const income = state.transactions.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0);
  const expense = state.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  const collected = state.units.reduce((s,u)=>s+Number(u.collected||0),0);

  const stats = document.createElement('div');
  stats.className='stats-row';
  stats.innerHTML = `
    <div class="stat-card tint-green"><div class="lbl">أعضاء مسددون</div><div class="num">${settled}</div></div>
    <div class="stat-card" style="background:var(--red-tint);border-color:#f3d3d0;"><div class="lbl">أعضاء عليهم مستحقات</div><div class="num">${owing}</div></div>
    <div class="stat-card tint-amber"><div class="lbl">طلبات صيانة نشطة</div><div class="num">${activeMnt}</div></div>
    <div class="stat-card"><div class="lbl">إجمالي الوحدات</div><div class="num">${state.units.length}</div></div>
  `;
  main.appendChild(stats);

  const stats2 = document.createElement('div');
  stats2.className='stats-row';
  stats2.style.gridTemplateColumns='repeat(3,1fr)';
  stats2.innerHTML = `
    <div class="stat-card tint-blue"><div class="lbl">إجمالي المحصّل من الاشتراكات</div><div class="num">${fmt(collected)} ر.س</div></div>
    <div class="stat-card" style="background:var(--red-tint);border-color:#f3d3d0;"><div class="lbl">إجمالي المستحقات المتأخرة</div><div class="num">${fmt(Math.abs(totalArrears))} ر.س</div></div>
    <div class="stat-card tint-green"><div class="lbl">صافي الإيرادات والمصروفات</div><div class="num">${fmt(income-expense)} ر.س</div></div>
  `;
  main.appendChild(stats2);

  const debtPanel = document.createElement('div');
  debtPanel.className='panel';
  const debtors = [...state.units].filter(u=>Number(u.totalDue)<0).sort((a,b)=>a.totalDue-b.totalDue);
  debtPanel.innerHTML = '<div class="panel-title">الأعضاء عليهم مستحقات متأخرة</div>';
  if(debtors.length===0){
    debtPanel.innerHTML += '<div class="empty">لا يوجد أعضاء متأخرون 🎉</div>';
  } else {
    debtors.forEach(u=>{
      const row = document.createElement('div');
      row.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);';
      row.innerHTML = `<div><div style="font-weight:700;font-size:13.5px;">${u.owner} — ${u.number}</div><div style="font-size:12px;color:var(--text-dim);">${u.phone}</div></div><b style="color:var(--red);">${fmt(u.totalDue)} ر.س</b>`;
      debtPanel.appendChild(row);
    });
  }
  main.appendChild(debtPanel);

  const panel = document.createElement('div');
  panel.className='panel';
  const recentMnt = state.maintenance.slice(-3).reverse();
  panel.innerHTML = '<div class="panel-title">أحدث طلبات الصيانة</div>';
  if(recentMnt.length===0){
    panel.innerHTML += '<div class="empty">لا توجد طلبات صيانة بعد</div>';
  } else {
    recentMnt.forEach(m=>{
      const row = document.createElement('div');
      row.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);';
      row.innerHTML = `<div><div style="font-weight:700;font-size:13.5px;">${m.title}</div><div style="font-size:12px;color:var(--text-dim);">${m.location}</div></div>${statusBadge(m.status)}`;
      panel.appendChild(row);
    });
  }
  main.appendChild(panel);
}

function statusBadge(status){
  const map = {
    'طلب جديد':'amber', 'قيد التنفيذ':'blue', 'مكتملة':'green',
    'مسدد':'green', 'عليه مستحقات':'red',
    'مدفوعة':'green', 'غير مدفوعة':'red',
    'يعمل':'green', 'يحتاج فحص':'amber', 'معطل':'red'
  };
  return '<span class="badge '+(map[status]||'gray')+'">'+status+'</span>';
}

async function saveUnit(id){
  const arrears = Number(document.getElementById('f-arrears').value)||0;
  const duesYear = Number(document.getElementById('f-duesyear').value)||0;
  const data = {
    number: document.getElementById('f-number').value.trim() || 'وحدة',
    floor: Number(document.getElementById('f-floor').value)||1,
    owner: document.getElementById('f-owner').value.trim(),
    phone: document.getElementById('f-phone').value.trim(),
    monthlyFee: Number(document.getElementById('f-fee').value)||200,
    collected: Number(document.getElementById('f-collected').value)||0,
    arrearsPrevious: arrears,
    duesThisYear: duesYear,
    totalDue: arrears + duesYear
  };
  if(id){
    const u = state.units.find(x=>x.id===id);
    Object.assign(u, data);
  } else {
    const newId = 'u'+(state.nextIds.unit++);
    state.units.push({id:newId, ...data});
  }
  await saveState(); closeModal(); render();
}
async function deleteUnit(id){
  state.units = state.units.filter(u=>u.id!==id);
  await saveState(); render();
}

const ARABIC_MONTHS = {'01':'يناير','02':'فبراير','03':'مارس','04':'أبريل','05':'مايو','06':'يونيو','07':'يوليو','08':'أغسطس','09':'سبتمبر','10':'أكتوبر','11':'نوفمبر','12':'ديسمبر'};
function monthLabel(key){
  const [y,m] = key.split('-');
  return (ARABIC_MONTHS[m]||m)+' '+y;
}
function buildOwnerStatementHTML(owner){
  const units = state.units.filter(u=>u.owner===owner.name);
  const totalDue = units.reduce((s,u)=>s+Number(u.totalDue||0),0);
  const totalCollected = units.reduce((s,u)=>s+Number(u.collected||0),0);

  let unitsRows = '';
  units.forEach(u=>{
    unitsRows += `<tr>
      <td>${u.number}</td>
      <td>${fmt(u.monthlyFee||200)} ر.س</td>
      <td>${fmt(u.collected||0)} ر.س</td>
      <td>${fmt(u.arrearsPrevious||0)} ر.س</td>
      <td>${fmt(u.duesThisYear||0)} ر.س</td>

    </tr>`;
  });

  let paymentsRows = '';
  units.forEach(u=>{
    const keys = Object.keys(state.payments).filter(k=>k.startsWith(u.id+'|')).sort();

    keys.forEach(k=>{

      const rec = state.payments[k];
      paymentsRows += `<tr>

        <td>${monthLabel(month)}</td>
        <td>${fmt(rec.amount)} ر.س</td>

      </tr>`;

  });

  const today = new Date().toLocaleDateString('ar-SA');
  return `
  <div class="stmt-page">
    <div class="stmt-header">
      <img src="${LOGO_URI}" class="stmt-logo" alt="شعار">
      <div>
        <div class="stmt-building">${esc(state.buildingName)}</div>
        <div class="stmt-title">كشف حساب مالك</div>
      </div>
      <div class="stmt-date">تاريخ الطباعة: ${today}</div>
    </div>
    <table class="stmt-info">
      <tr><td><b>اسم المالك:</b> ${esc(owner.name)}</td><td><b>رقم الجوال:</b> <span dir="ltr">${esc(owner.phone||'—')}</span></td></tr>
      <tr><td><b>عدد الوحدات:</b> ${units.length}</td><td><b>إجمالي المستحقات:</b> <span style="color:${totalDue<0?'#c0392b':'#1f9d55'}">${fmt(totalDue)} ر.س</span></td></tr>
    </table>

    <div class="stmt-section-title">بيانات الوحدات والمستحقات</div>
    <table class="stmt-table">
      <thead><tr><th>الوحدة</th><th>الاشتراك الشهري</th><th>إجمالي المحصّل</th><th>مستحقات سابقة</th><th>مستحقات السنة الحالية</th><th>إجمالي المستحقات</th></tr></thead>
      <tbody>${unitsRows || '<tr><td colspan="6">لا توجد وحدات</td></tr>'}</tbody>
    </table>

    <div class="stmt-section-title">سجل الدفعات الشهرية</div>
    <table class="stmt-table">
      <thead><tr><th>الوحدة</th><th>الشهر</th><th>المبلغ</th><th>الحالة</th></tr></thead>
      <tbody>${paymentsRows || '<tr><td colspan="4">لا توجد دفعات مسجلة</td></tr>'}</tbody>
    </table>

    <div class="stmt-footer">هذا الكشف صادر آليًا من نظام إدارة العمارة ولا يحتاج توقيعًا.</div>
  </div>`;
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const STMT_STYLE = `

function printOwnerStatement(id){
  const owner = state.owners.find(o=>o.id===id);

  const w = window.open('', '_blank');
  if(!w){ alert('يرجى السماح بالنوافذ المنبثقة لطباعة الكشف'); return; }
  w.document.write(`<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8">
    <title>كشف حساب - ${esc(owner.name)}</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <body>${buildOwnerStatementHTML(owner)}
    <script>window.onload=()=>{setTimeout(()=>window.print(),300);}<\/script>
    </body></html>`);
  w.document.close();
}
function printAllStatements(){
  if(state.owners.length===0){ alert('لا يوجد ملاك لطباعة كشوفهم'); return; }

function openOwnerModal(id){
  const o = id ? state.owners.find(x=>x.id===id) : null;

    <h3>${o?'تعديل مالك':'إضافة مالك'}</h3>

async function saveOwner(id){
  const name = document.getElementById('f-oname').value.trim();
  const phone = document.getElementById('f-ophone').value.trim();
  if(!name) return;

  else{ state.owners.push({id:'o'+(state.nextIds.owner++), name, phone}); }

}
async function deleteOwner(id){
  state.owners = state.owners.filter(o=>o.id!==id);
  await saveState(); render();
}

/* ---------------- payments ---------------- */
function currentMonthKey(){
  const now = new Date();
  return now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
}
let paymentsMonth = currentMonthKey();
function renderPayments(main){
  topbar(main, state.buildingName, 'الدفعات الشهرية', 'متابعة حالة سداد الاشتراك الشهري لكل عضو ووحدة.');

  const filters = document.createElement('div');
  filters.className='filters-row';
  filters.innerHTML = `<label style="font-size:13px;color:var(--text-dim);">الشهر:</label>
    <input type="month" id="monthPicker" value="${paymentsMonth}">`;
  main.appendChild(filters);
  filters.querySelector('#monthPicker').onchange = (e)=>{ paymentsMonth = e.target.value; render(); };

  const panel = document.createElement('div');
  panel.className='panel';
  let rows='';
  let totalDue=0, totalPaid=0;
  [...state.units].sort((a,b)=>a.number.localeCompare(b.number,'ar')).forEach(u=>{
    const key = u.id+'|'+paymentsMonth;
    const rec = state.payments[key] || {paid:false, amount:u.monthlyFee||200};
    totalDue += Number(rec.amount);
    if(rec.paid) totalPaid += Number(rec.amount);
    rows += `<tr>
      <td><b>${u.number}</b></td>
      <td>${u.owner}</td>
      <td>${fmt(rec.amount)} ر.س</td>
      <td>${statusBadge(rec.paid?'مدفوعة':'غير مدفوعة')}</td>
      <td><button class="icon-btn" onclick="togglePayment('${u.id}')">${rec.paid?'إلغاء الدفع':'تحديد كمدفوعة'}</button></td>
    </tr>`;
  });
  panel.innerHTML = `<div class="panel-title">تحصيل ${paymentsMonth} — ${fmt(totalPaid)} / ${fmt(totalDue)} ر.س</div>
    <table><thead><tr><th>الوحدة</th><th>العضو</th><th>المبلغ</th><th>الحالة</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">لا توجد وحدات</td></tr>'}</tbody></table>`;
  main.appendChild(panel);
}
async function togglePayment(unitId){
  const key = unitId+'|'+paymentsMonth;
  const u = state.units.find(x=>x.id===unitId);
  const rec = state.payments[key] || {paid:false, amount:u.monthlyFee||200};
  rec.paid = !rec.paid;
  rec.amount = rec.amount || u.monthlyFee || 200;
  state.payments[key] = rec;
  await saveState(); render();
}

function renderFinance(main){
  topbar(main, state.buildingName, 'الإيرادات والمصروفات', 'سجل الحركات المالية للعمارة.',

  const income = state.transactions.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0);
  const expense = state.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  const stats = document.createElement('div');
  stats.className='stats-row';
  stats.style.gridTemplateColumns='repeat(3,1fr)';
  stats.innerHTML = `
    <div class="stat-card tint-green"><div class="lbl">الإيرادات</div><div class="num">${fmt(income)} ر.س</div></div>
    <div class="stat-card" style="background:var(--red-tint);border-color:#f3d3d0;"><div class="lbl">المصروفات</div><div class="num">${fmt(expense)} ر.س</div></div>
    <div class="stat-card tint-blue"><div class="lbl">الصافي</div><div class="num">${fmt(income-expense)} ر.س</div></div>
  `;
  main.appendChild(stats);

  const panel = document.createElement('div');
  panel.className='panel';
  let rows='';
  [...state.transactions].reverse().forEach(t=>{
    rows += `<tr>
      <td>${t.date}</td>
      <td>${statusBadge(t.type==='income'?'مدفوعة':'غير مدفوعة').replace(t.type==='income'?'مدفوعة':'غير مدفوعة', t.type==='income'?'إيراد':'مصروف')}</td>
      <td>${t.category}</td>
      <td>${t.note||'—'}</td>
      <td><b style="color:${t.type==='income'?'var(--green)':'var(--red)'}">${t.type==='income'?'+':'-'}${fmt(t.amount)} ر.س</b></td>
      <td>${t.hasAttachment ? `<button class="icon-btn" onclick="viewAttachment('${t.id}')" title="${t.attachmentName||''}">📎 عرض الفاتورة</button>` : '<span style="color:var(--text-dim);font-size:12px;">—</span>'}</td>
      <td><button class="icon-btn" onclick="deleteTx('${t.id}')">حذف</button></td>
    </tr>`;
  });
  panel.innerHTML = `<table><thead><tr><th>التاريخ</th><th>النوع</th><th>الفئة</th><th>ملاحظة</th><th>المبلغ</th><th>المرفق</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">لا توجد حركات</td></tr>'}</tbody></table>`;
  main.appendChild(panel);
}
function openTxModal(){
  showModal(`
    <h3>إضافة حركة مالية</h3>
    <div class="two-col">
      <div class="field"><label>النوع</label>
        <select id="f-txtype"><option value="income">إيراد</option><option value="expense">مصروف</option></select>
      </div>
      <div class="field"><label>المبلغ (ر.س)</label><input id="f-txamount" type="number"></div>
    </div>
    <div class="field"><label>الفئة</label><input id="f-txcat" placeholder="مثال: دفعات إيجار، صيانة، كهرباء"></div>
    <div class="field"><label>ملاحظة</label><input id="f-txnote"></div>
    <div class="field"><label>التاريخ</label><input id="f-txdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>صورة الفاتورة أو ملف PDF (اختياري)</label><input id="f-txfile" type="file" accept="image/*,application/pdf"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn" onclick="saveTx()">حفظ</button>
    </div>
  `);
}
function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(new Error('read failed'));
    r.readAsDataURL(file);
  });
}
async function saveTx(){
  const type = document.getElementById('f-txtype').value;
  const amount = Number(document.getElementById('f-txamount').value)||0;
  const category = document.getElementById('f-txcat').value.trim()||'عام';
  const note = document.getElementById('f-txnote').value.trim();
  const date = document.getElementById('f-txdate').value;
  const fileInput = document.getElementById('f-txfile');
  const file = fileInput && fileInput.files && fileInput.files[0];

  const tx = {id:'t'+(state.nextIds.tx++), type, amount, category, note, date, hasAttachment:false};

  if(file){
    if(file.size > 4.5*1024*1024){
      alert('حجم الملف كبير جدًا (الحد الأقصى تقريبًا 4.5 ميغابايت)');
    } else {
      try{
        const dataUrl = await readFileAsDataURL(file);
        await storageSet('attachment:'+tx.id, JSON.stringify({name:file.name, type:file.type, data:dataUrl}));
        tx.hasAttachment = true;
        tx.attachmentName = file.name;
      }catch(e){ alert('تعذّر حفظ المرفق'); }
    }
  }

  state.transactions.push(tx);
  await saveState(); closeModal(); render();
}
async function deleteTx(id){
  state.transactions = state.transactions.filter(t=>t.id!==id);
  await storageRemove('attachment:'+id);
  await saveState(); render();
}
async function viewAttachment(id){
  try{
    const raw = await storageGet('attachment:'+id);
    if(!raw){ alert('تعذّر العثور على المرفق'); return; }
    const {name, type, data} = JSON.parse(raw);
    const w = window.open('', '_blank');
    if(!w){ alert('يرجى السماح بالنوافذ المنبثقة لعرض المرفق'); return; }
    const body = type && type.startsWith('image')
      ? `<img src="${data}" style="max-width:100%;max-height:100vh;display:block;margin:auto;">`
      : `<iframe src="${data}" style="width:100vw;height:100vh;border:none;"></iframe>`;
    w.document.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>${esc(name)}</title>
      <style>html,body{margin:0;background:#22282a;min-height:100vh;}</style>
      </head><body>${body}</body></html>`);
    w.document.close();
  }catch(e){ alert('تعذّر عرض المرفق'); }
}

/* ---------------- equipment ---------------- */
function renderEquipment(main){
  topbar(main, state.buildingName, 'معدات المبنى', 'متابعة معدات العمارة الأساسية وتواريخ صيانتها.',
    '<button class="btn" onclick="openEqModal()">+ إضافة معدة</button>');
  const panel = document.createElement('div');
  panel.className='panel';
  let rows='';
  state.equipment.forEach(e=>{
    rows += `<tr>
      <td><b>${e.name}</b></td>
      <td>${e.location}</td>
      <td>${e.lastMaintenance}</td>
      <td>${statusBadge(e.status)}</td>
      <td><button class="icon-btn" onclick="openEqModal('${e.id}')">تعديل</button><button class="icon-btn" onclick="deleteEq('${e.id}')">حذف</button></td>
    </tr>`;
  });
  panel.innerHTML = `<table><thead><tr><th>المعدة</th><th>الموقع</th><th>آخر صيانة</th><th>الحالة</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">لا توجد معدات مسجلة</td></tr>'}</tbody></table>`;
  main.appendChild(panel);
}
function openEqModal(id){
  const e = id ? state.equipment.find(x=>x.id===id) : null;
  showModal(`
    <h3>${e?'تعديل معدة':'إضافة معدة'}</h3>
    <div class="field"><label>اسم المعدة</label><input id="f-eqname" value="${e?e.name:''}"></div>
    <div class="field"><label>الموقع</label><input id="f-eqloc" value="${e?e.location:''}"></div>
    <div class="two-col">
      <div class="field"><label>آخر صيانة</label><input id="f-eqdate" type="date" value="${e?e.lastMaintenance:new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>الحالة</label>
        <select id="f-eqstatus">
          <option value="يعمل" ${e&&e.status==='يعمل'?'selected':''}>يعمل</option>
          <option value="يحتاج فحص" ${e&&e.status==='يحتاج فحص'?'selected':''}>يحتاج فحص</option>
          <option value="معطل" ${e&&e.status==='معطل'?'selected':''}>معطل</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn" onclick="saveEq('${id||''}')">حفظ</button>
    </div>
  `);
}
async function saveEq(id){
  const data = {
    name: document.getElementById('f-eqname').value.trim(),
    location: document.getElementById('f-eqloc').value.trim(),
    lastMaintenance: document.getElementById('f-eqdate').value,
    status: document.getElementById('f-eqstatus').value
  };
  if(id){ Object.assign(state.equipment.find(x=>x.id===id), data); }
  else{ state.equipment.push({id:'e'+(state.nextIds.eq++), ...data}); }
  await saveState(); closeModal(); render();
}
async function deleteEq(id){
  state.equipment = state.equipment.filter(e=>e.id!==id);
  await saveState(); render();
}

/* ---------------- maintenance ---------------- */
let mntFilterStatus = 'الكل';
function renderMaintenance(main){
  topbar(main, state.buildingName, 'الصيانة', 'سجّل طلب الصيانة، حدّد موعده، وتابع تنفيذه حتى الإغلاق.',
    '<button class="btn" onclick="openMntModal()">+ طلب صيانة جديد</button>');

  const info = document.createElement('div');
  info.className='info-banner';
  info.textContent = 'الاستخدام: سجّل الطلب، حوّله إلى قيد التنفيذ عند بدء العمل، ثم أغلقه كمكتمل مع ملاحظات الإنجاز.';
  main.appendChild(info);

  const counts = {
    'طلب جديد': state.maintenance.filter(m=>m.status==='طلب جديد').length,
    'قيد التنفيذ': state.maintenance.filter(m=>m.status==='قيد التنفيذ').length,
    'مكتملة': state.maintenance.filter(m=>m.status==='مكتملة').length
  };
  const stats = document.createElement('div');
  stats.className='stats-row';
  stats.style.gridTemplateColumns='repeat(4,1fr)';
  stats.innerHTML = `
    <div class="stat-card tint-amber"><div class="lbl">طلب جديد</div><div class="num">${counts['طلب جديد']}</div></div>
    <div class="stat-card tint-blue"><div class="lbl">قيد التنفيذ</div><div class="num">${counts['قيد التنفيذ']}</div></div>
    <div class="stat-card tint-green"><div class="lbl">مكتملة</div><div class="num">${counts['مكتملة']}</div></div>
    <div class="stat-card"><div class="lbl">الإجمالي</div><div class="num">${state.maintenance.length}</div></div>
  `;
  main.appendChild(stats);

  const filters = document.createElement('div');
  filters.className='filters-row';
  filters.innerHTML = `<select id="mntFilter">
      <option value="الكل">كل الحالات</option>
      <option value="طلب جديد">طلب جديد</option>
      <option value="قيد التنفيذ">قيد التنفيذ</option>
      <option value="مكتملة">مكتملة</option>
    </select>
    <input type="text" id="mntSearch" placeholder="ابحث في العنوان أو الموقع...">`;
  main.appendChild(filters);
  filters.querySelector('#mntFilter').value = mntFilterStatus;
  filters.querySelector('#mntFilter').onchange = (e)=>{ mntFilterStatus = e.target.value; render(); };
  filters.querySelector('#mntSearch').oninput = (e)=>{ renderMntGrid(main, e.target.value); };

  const gridWrap = document.createElement('div');
  gridWrap.id = 'mntGridWrap';
  main.appendChild(gridWrap);
  renderMntGrid(main, '');
}
function renderMntGrid(main, search){
  const wrap = document.getElementById('mntGridWrap');
  let list = state.maintenance;
  if(mntFilterStatus!=='الكل') list = list.filter(m=>m.status===mntFilterStatus);
  if(search) list = list.filter(m=>(m.title+m.location).includes(search));
  list = [...list].reverse();

  const grid = document.createElement('div');
  grid.className='req-grid';
  if(list.length===0){
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1;">لا توجد طلبات مطابقة</div>';
  } else {
    list.forEach(m=>{
      const card = document.createElement('div');
      card.className='req-card';
      card.innerHTML = `
        <div class="req-tags">${statusBadge(m.status)}<span class="badge gray">${m.type}</span><span class="badge gray">${m.priority}</span></div>
        <div class="req-title">${m.title}</div>
        <div class="req-desc">${m.desc}</div>
        <div class="req-meta">
          <div class="req-meta-row"><span>الموقع:</span><b>${m.location}</b></div>
          <div class="req-meta-row"><span>الوحدة:</span><b>${m.unit}</b></div>
          <div class="req-meta-row"><span>تاريخ البلاغ:</span><b>${m.reportDate}</b></div>
          <div class="req-meta-row"><span>موعد التنفيذ:</span><b>${m.execDate||'—'}</b></div>
        </div>
        <div class="req-actions">
          ${m.status!=='مكتملة' ? `<button class="btn btn-sm" onclick="advanceMnt('${m.id}')">${m.status==='طلب جديد'?'بدء التنفيذ':'إغلاق كمكتمل'}</button>` : ''}
          <button class="btn-ghost btn-sm" onclick="openMntModal('${m.id}')">تعديل</button>
          <button class="btn-danger btn-sm" onclick="deleteMnt('${m.id}')">حذف</button>
        </div>
      `;
      grid.appendChild(card);
    });
  }
  wrap.innerHTML = '';
  wrap.appendChild(grid);
}
async function advanceMnt(id){
  const m = state.maintenance.find(x=>x.id===id);
  if(m.status==='طلب جديد'){ m.status='قيد التنفيذ'; }
  else if(m.status==='قيد التنفيذ'){ m.status='مكتملة'; m.execDate = new Date().toISOString().slice(0,10); }
  await saveState(); render();
}
async function deleteMnt(id){
  state.maintenance = state.maintenance.filter(m=>m.id!==id);
  await saveState(); render();
}
function openMntModal(id){
  const m = id ? state.maintenance.find(x=>x.id===id) : null;
  const unitOptions = ['<option value="—">—</option>'].concat(state.units.map(u=>`<option value="${u.number}" ${m&&m.unit===u.number?'selected':''}>${u.number}</option>`)).join('');
  showModal(`
    <h3>${m?'تعديل طلب صيانة':'طلب صيانة جديد'}</h3>
    <div class="field"><label>عنوان الطلب</label><input id="f-mtitle" value="${m?m.title:''}"></div>
    <div class="field"><label>الوصف</label><textarea id="f-mdesc">${m?m.desc:''}</textarea></div>
    <div class="two-col">
      <div class="field"><label>الموقع</label><input id="f-mloc" value="${m?m.location:''}"></div>
      <div class="field"><label>الوحدة</label><select id="f-munit">${unitOptions}</select></div>
    </div>
    <div class="two-col">
      <div class="field"><label>نوع الصيانة</label>
        <select id="f-mtype">
          <option ${m&&m.type==='كهرباء وإنارة'?'selected':''}>كهرباء وإنارة</option>
          <option ${m&&m.type==='سباكة ومياه'?'selected':''}>سباكة ومياه</option>
          <option ${m&&m.type==='تكييف'?'selected':''}>تكييف</option>
          <option ${m&&m.type==='مصاعد'?'selected':''}>مصاعد</option>
          <option ${m&&m.type==='أخرى'?'selected':''}>أخرى</option>
        </select>
      </div>
      <div class="field"><label>الأولوية</label>
        <select id="f-mpriority">
          <option ${m&&m.priority==='منخفضة'?'selected':''}>منخفضة</option>
          <option ${!m||m.priority==='عادية'?'selected':''}>عادية</option>
          <option ${m&&m.priority==='عاجلة'?'selected':''}>عاجلة</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn" onclick="saveMnt('${id||''}')">حفظ</button>
    </div>
  `);
}
async function saveMnt(id){
  const data = {
    title: document.getElementById('f-mtitle').value.trim()||'طلب صيانة',
    desc: document.getElementById('f-mdesc').value.trim(),
    location: document.getElementById('f-mloc').value.trim(),
    unit: document.getElementById('f-munit').value,
    type: document.getElementById('f-mtype').value,
    priority: document.getElementById('f-mpriority').value
  };
  if(id){ Object.assign(state.maintenance.find(x=>x.id===id), data); }
  else{
    state.maintenance.push({
      id:'m'+(state.nextIds.mnt++), ...data,
      status:'طلب جديد', reportDate:new Date().toISOString().slice(0,10), execDate:''
    });
  }
  await saveState(); closeModal(); render();
}

/* ---------------- modal helpers ---------------- */
function showModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });

/* ---------------- boot ---------------- */
(async function boot(){
  await loadState(); // load building data in the background either way
  const auth = await getAuth();
  if(!auth){
    showAuthScreen('setup', null, '');
  } else if(isSessionActive()){
    await enterApp();
  } else {
    showAuthScreen('login', auth, '');
  }
})();
</script>
</body>
