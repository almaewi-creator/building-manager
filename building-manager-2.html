/* قائمة سداد الاشتراكات: كل الشقق × كل الأشهر (من بداية التحصيل حتى الشهر الحالي) بنفس فكرة قائمة الإدارة السابقة.
   الخلية الخضراء = المبلغ المسدد، والخلية الحمراء الفاتحة = غير مسدد. */
function buildSubsMatrixHTML(){
  const start = incomeStartKey(); // تبدأ القائمة من أول شهر إدارة (سبتمبر)، وما قبله يدخل في «رصيد سابق»
  const to = currentMonthKey();
  const months = monthsBetweenInclusive(start, to);
  const today = new Date().toLocaleDateString('ar-SA-u-ca-gregory');
  const units = [...state.units].sort((a,b)=>String(a.number).localeCompare(String(b.number),'ar',{numeric:true}));
  let colPaid = months.map(()=>0), colDue = months.map(()=>0);
  let totPaid = 0, totPrev = 0, totOwed = 0, totCredit = 0;
  const rows = units.map(u=>{
    let paidSum = 0;
    const cells = months.map((mk,i)=>{
      const rec = state.payments[u.id+'|'+mk];
      const amount = rec ? Number(rec.amount) : Number(u.monthlyFee||200);
      const paid = !!(rec && rec.paid);
      colDue[i] += amount;
      if(!amount) return `<td class="mx-z">—</td>`;
      if(paid){ paidSum += amount; colPaid[i] += amount; return `<td class="mx-p">${fmt(amount)}</td>`; }
      return `<td class="mx-u">${fmt(amount)}</td>`;
    }).join('');
    const prev = computeUnitPriorArrears(u, start);
    const bal = prev + computeUnitNetForRange(u, start, to);
    totPaid += paidSum; totPrev += prev;
    if(bal<0) totOwed += -bal; else totCredit += bal;
    return `<tr>
      <td class="mx-n">${esc(u.number)}</td>
      <td class="mx-name">${esc(u.owner||'')}</td>
      ${cells}
      <td>${prev? fmt(Math.abs(prev))+(prev<0?'-':'+') : '—'}</td>
      <td><b>${fmt(paidSum)}</b></td>
      <td class="${bal<0?'mx-neg':bal>0?'mx-pos':''}"><b>${bal===0?'0':(bal<0?fmt(Math.abs(bal))+'-':fmt(bal)+'+')}</b></td>
    </tr>`;
  }).join('');
  const footCells = months.map((mk,i)=>`<td>${fmt(colPaid[i])}</td>`).join('');
  return `
  <div class="stmt-page stmt-page-wide">
    <div class="stmt-header">
      <img src="${LOGO_URI}" class="stmt-logo" alt="شعار">
      <div>
        <div class="stmt-building">${esc(state.buildingName)}</div>

      <tbody>${rows}</tbody>
      <tfoot><tr><td colspan="2">الإجمالي</td>${footCells}<td>—</td><td>${fmt(totPaid)}</td><td>${totOwed? fmt(totOwed)+'-':'0'}</td></tr></tfoot>
    </table></div>
    <table class="stmt-info" style="margin-top:10px"><tr>
      <td><b>إجمالي المحصّل:</b> ${fmt(totPaid)} ر.س</td>
      <td><b>إجمالي المتأخرات على الأعضاء:</b> ${fmt(totOwed)} ر.س</td>

    <div class="stmt-tail-block">
      <div class="stmt-stamp-wrap"><img src="${STAMP_URI}" class="stmt-stamp" alt="ختم"></div>
      <div class="stmt-footer">الخلية الخضراء: المبلغ المسدد لذلك الشهر. الخلية الحمراء الفاتحة: غير مسدد. *رصيد سابق: ما كان على الشقة قبل ${monthLabel(start)}. عمود "الرصيد": سالب (-) يعني متأخرات على الشقة، وموجب (+) يعني مبلغًا مقدّمًا. صادر آليًا من نظام إدارة العمارة.</div>
    </div>
  </div>`;
}

/* ---------------- finance ---------------- */
/* ---------------- driver rooms (separate rental income stream) ---------------- */
/* Rooms are tracked with the same per-month paid/unpaid grid used for
   apartment subscriptions (state.payments), stored in state.roomPayments
   keyed by roomId+'|'+monthKey — rather than a single running "collected"
   counter. This lets a specific month be marked/unmarked or corrected
   without guessing which month an "add payment" click was meant to cover. */
function computeRoomCollected(room){
  let total = 0;
  const prefix = room.id+'|';
  Object.keys(state.roomPayments).forEach(k=>{
    if(!k.startsWith(prefix)) return;
    if(state.roomPayments[k].paid) total += Number(state.roomPayments[k].amount)||0;
  });
  return total;
}
/* Rooms follow the same rule as units: the current month isn't "due" until it
   has fully elapsed, so we only count up through the last completed month. */
function computeRoomDue(room){
  if(!room.tenant || !room.startMonth || Number(room.monthlyRent)<=0){
    return { monthsDue:0, totalDue:0, paid:0, remaining:0 };
  }
  const end = lastCompletedMonthKey();
  const months = monthsBetweenInclusive(room.startMonth, end);
  const monthsDue = months.length;
  let due=0, paid=0;
  months.forEach(mk=>{
    const rec = state.roomPayments[room.id+'|'+mk];
    const amount = rec ? Number(rec.amount) : Number(room.monthlyRent);
    due += amount;
    if(rec && rec.paid) paid += amount;
  });
  const remaining = due - paid;
  return { monthsDue, totalDue:due, paid, remaining };
}

async function renameUnitsToShaqqa(){
  let changed = 0;
  state.units.forEach(u=>{
    if(/وحدة/.test(u.number||'')){
      u.number = u.number.replace(/وحدة/g, 'شقة');
      changed++;
    }
  });
  if(changed>0){ await saveState(); }
  render();
  alert(changed>0 ? `تم تصحيح تسمية ${changed} شقة ✅` : 'ما فيه شي يحتاج تصحيح 🎉');
}
function downloadBackupNow(){
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  const a = document.createElement('a');
  a.href = url;
  a.download = 'نسخة-احتياطية-'+esc(state.buildingName||'العمارة')+'-'+stamp+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
async function importBackupFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!parsed || !Array.isArray(parsed.units) || !Array.isArray(parsed.owners)){
      alert('هذا الملف ما يبدو نسخة احتياطية صحيحة من النظام (ناقصه بيانات الشقق أو الملاك).');
      input.value = '';
      return;
    }
    const stamp = `الشقق: ${parsed.units.length} — الملاك: ${parsed.owners.length} — الحركات المالية: ${(parsed.transactions||[]).length} — السندات: ${(parsed.vouchers||[]).length}`;
    if(!confirm('تحذير: استيراد هذه النسخة بيستبدل كل بيانات النظام الحالية بما هو موجود في الملف، ولا يمكن التراجع عن هذا الإجراء.\n\nمحتوى الملف:\n'+stamp+'\n\nمتأكد تبي تكمل؟')){
      input.value = '';
      return;
    }
    state = parsed;
    migrateState();
    await saveState();
    render();
    alert('تم استيراد النسخة الاحتياطية بنجاح ✅');
  }catch(e){
    alert('تعذّر قراءة الملف — تأكد إنه ملف نسخة احتياطية صحيح (JSON) صادر من هذا النظام.');
  }
  input.value = '';
}
// Adds transactions/vouchers from a restore file to what's already in the
// system, instead of replacing everything (importBackupFile above). Used to
// bring back specific records that went missing (e.g. after a sync overwrite)
// without touching anything else — units, payments, other months, etc. all
// stay exactly as they are. Skips any record whose id already exists, so
// running it twice by mistake never duplicates anything.
async function mergeRestoreFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    const newTx = Array.isArray(parsed.transactions) ? parsed.transactions : [];
    const newVch = Array.isArray(parsed.vouchers) ? parsed.vouchers : [];
    if(newTx.length===0 && newVch.length===0){
      alert('ما لقيت أي حركات مالية أو سندات صرف في هذا الملف لاستعادتها.');
      input.value = '';
      return;
    }
    if(!state.transactions) state.transactions = [];
    if(!state.vouchers) state.vouchers = [];
    const existingTxIds = new Set(state.transactions.map(t=>t.id));
    const existingVchIds = new Set(state.vouchers.map(v=>v.id));
    const txToAdd = newTx.filter(t=>t && t.id && !existingTxIds.has(t.id));
    const vchToAdd = newVch.filter(v=>v && v.id && !existingVchIds.has(v.id));
    const skippedTx = newTx.length - txToAdd.length;
    const skippedVch = newVch.length - vchToAdd.length;
    const txTotal = txToAdd.reduce((s,t)=>s+Number(t.amount||0),0);
    let msg = `سيتم إضافة ${txToAdd.length} حركة مالية (بإجمالي ${fmt(txTotal)} ر.س) و${vchToAdd.length} سند صرف إلى البيانات الحالية، بدون حذف أو تعديل أي شي موجود.`;
    if(skippedTx>0 || skippedVch>0) msg += `\n(${skippedTx+skippedVch} سجل متجاهَل لأنه موجود عندك مسبقًا بنفس المعرّف.)`;
    if(txToAdd.length===0 && vchToAdd.length===0){
      alert('كل السجلات في هذا الملف موجودة عندك مسبقًا — ما فيه شي جديد يُضاف.');
      input.value = '';
      return;
    }
    if(!confirm(msg+'\n\nتكمل؟')){ input.value = ''; return; }
    state.transactions.push(...txToAdd);
    state.vouchers.push(...vchToAdd);
    await saveState();
    render();
    alert(`تم ✅ — أُضيف ${txToAdd.length} حركة مالية و${vchToAdd.length} سند صرف.`);
  }catch(e){
    alert('تعذّر قراءة الملف — تأكد إنه ملف استعادة صحيح (JSON).');
  }
  input.value = '';
}
/* تعليم دفعات أبريل–يوليو 2026 كما في قائمة سداد الاشتراكات المستلمة من الإدارة السابقة (19/08/2026).
   كل الشقق مدفوعة الأشهر الأربعة ما عدا: 204 و301 و801 (لا شيء)، 404 (أبريل–يونيو). أما 401 و402 فكانا ناقصين وقت القائمة وسدّدا بعدها. */
async function applyPriorAdminPayments(){
  const months = ['2026-04','2026-05','2026-06','2026-07'];
  const paidMonths = {'204':[], '301':[], '801':[], '404':months.slice(0,3)};
  if(!confirm('سيُعلَّم أبريل–يوليو 2026 مدفوعاً لكل الشقق، عدا: 204 و301 و801 (غير مدفوعة)، و404 (يوليو فقط غير مدفوع).\nلا يُغيَّر أي شهر سبق تسجيله مدفوعاً.\nولن تدخل هذه الدفعات في رصيد الحساب إذا كان "شهر استلام الإدارة" أغسطس 2026. هل تتابع؟')) return;
  if(!state.billingStartMonth || state.billingStartMonth > '2026-04') state.billingStartMonth = '2026-04';
  if(!state.managementStartMonth) state.managementStartMonth = '2026-08';
  let n = 0;
  state.units.forEach(u=>{
    const m = String(u.number||'').match(/\d+/); if(!m) return;
    const ok = paidMonths[m[0]] || months;
    months.forEach(mk=>{
      const key = u.id+'|'+mk;
      const rec = state.payments[key];
      if(rec && rec.paid) return;
      if(ok.includes(mk)){ state.payments[key] = {paid:true, amount: (rec&&rec.amount)||u.monthlyFee||200, priorAdmin:true}; n++; }
    });
  });
  syncAllUnitsFinancials();
  await saveState(); render();
  alert('تم تعليم '+n+' دفعة. بداية الفوترة: أبريل 2026، واستلام الإدارة: أغسطس 2026.');
}

/* Keeps المصروفات والإيرادات in step with a room's monthly payment: marking a
   month paid creates (or updates) one linked income transaction, marking it
   unpaid removes it. Linked via tx.roomPayKey = roomId|monthKey. A matching
   income entry that was typed in by hand earlier (same room, same month, same
   amount) is adopted instead of duplicated. */
function syncRoomTx(roomId, mk){
  if(!state.transactions) state.transactions = [];
  if(!state.nextIds) state.nextIds = {};
  if(!state.nextIds.tx) state.nextIds.tx = 1;
  const key = roomId+'|'+mk;
  const r = state.driverRooms.find(x=>x.id===roomId);
  if(!r) return false;
  const rec = state.roomPayments[key];
  let tx = state.transactions.find(t=>t.roomPayKey===key);
  if(!rec || !rec.paid){
    if(tx){ state.transactions = state.transactions.filter(t=>t!==tx); return true; }
    return false;
  }
  const amount = Number(rec.amount)||0;
  if(!tx){
    const re = new RegExp('غرفة\\s*'+String(r.number)+'(?!\\d)');
    tx = state.transactions.find(t=>t.type==='income' && !t.roomPayKey
      && re.test((t.category||'')+' '+(t.note||''))
      && String(t.date||'').slice(0,7)===mk && Number(t.amount)===amount);
    if(tx){ tx.roomPayKey = key; return false; }
  }
  const nowMonth = currentMonthKey();
  let date;
  if(mk===nowMonth) date = todayISODate();
  else { const [y,m] = mk.split('-').map(Number); date = mk+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0'); }
  const payload = { type:'income', amount, category:'غرفة '+r.number, method:'كاش',
    date: (tx && tx.date && String(tx.date).slice(0,7)===mk) ? tx.date : date,
    note:'إيجار '+monthLabel(mk)+(r.tenant?' — '+r.tenant:''), roomPayKey:key, depositDate:(rec.depositDate||undefined) };
  if(tx){ Object.assign(tx, payload); }
  else { state.transactions.push(Object.assign({id:'t'+(state.nextIds.tx++), hasAttachment:false}, payload)); }
  return true;
}
async function backfillRoomTx(){
  let n=0;
  Object.keys(state.roomPayments||{}).forEach(k=>{
    if(!state.roomPayments[k].paid) return;
    const [rid, mk] = k.split('|');
    const had = state.transactions.some(t=>t.roomPayKey===k);
    const changed = syncRoomTx(rid, mk);
    if(!had && changed) n++;
  });
  await saveState(); render();
  alert(n>0 ? 'تم ✅ — أُضيفت '+n+' حركة إيراد ناقصة لدفعات غرف مدفوعة.' : 'كل دفعات الغرف المدفوعة عندها حركة إيراد مرتبطة — ما فيه شي ناقص.');
}

/* ---------------- فحص مالي (Audit) ---------------- */
function auditFinance(){
  const issues = [], ok = [];
  const tx = state.transactions||[];
  // 1) دفعات الغرف المدفوعة ↔ حركات الإيراد
  let missing=0, diffAmt=0, orphan=0;
  Object.keys(state.roomPayments||{}).forEach(k=>{
    const rec = state.roomPayments[k]; if(!rec.paid) return;
    const t = tx.find(x=>x.roomPayKey===k);
    if(!t) missing++; else if(Number(t.amount)!==Number(rec.amount)) diffAmt++;
  });
  tx.filter(t=>t.roomPayKey).forEach(t=>{
    const rec = (state.roomPayments||{})[t.roomPayKey];
    if(!rec || !rec.paid) orphan++;
  });
  if(missing) issues.push(`${missing} دفعة غرفة مدفوعة بدون حركة إيراد (في صفحة غرف السواقين اضغط "🔄 مزامنة الإيرادات")`);
  if(diffAmt) issues.push(`${diffAmt} دفعة غرفة مبلغها يختلف عن حركة الإيراد المرتبطة`);
  if(orphan) issues.push(`${orphan} حركة إيراد غرفة لدفعة غير مدفوعة أو محذوفة`);
  if(!missing && !diffAmt && !orphan) ok.push('دفعات الغرف مطابقة لحركات الإيراد');
  // 2) تحصيل الشقق: المخزّن مقابل المحسوب من الدفعات
  const stored = state.units.reduce((s,u)=>s+Number(u.collected||0),0);
  const calc = paidDuesTotal('', firstBillingMonthKey());
  if(stored!==calc) issues.push(`إجمالي تحصيل الشقق المخزّن (${fmt(stored)}) يختلف عن المحسوب من الدفعات (${fmt(calc)})`);
  else ok.push('تحصيل الشقق مطابق للدفعات ('+fmt(calc)+' ر.س)');
  // 3) دفعات شقق قبل شهر بدء الفوترة (لا تدخل في الأرصدة)
  const start = firstBillingMonthKey();
  const ids = new Set(state.units.map(u=>u.id));
  let early=0, earlyAmt=0;
  Object.keys(state.payments||{}).forEach(k=>{
    const [uid,mk]=k.split('|'); const r=state.payments[k];
    if(ids.has(uid) && r.paid && mk<start){ early++; earlyAmt+=Number(r.amount)||0; }
  });
  if(early) issues.push(`${early} دفعة شقق (${fmt(earlyAmt)} ر.س) قبل شهر بدء الفوترة ${start} ولا تُحتسب في الإيراد`);
  // 4) حركات غير سليمة
  const bad = tx.filter(t=>!(Number(t.amount)>0) || !t.date || !/^\d{4}-\d{2}-\d{2}/.test(t.date));
  if(bad.length) issues.push(`${bad.length} حركة بمبلغ صفري/سالب أو بتاريخ غير صالح`); else ok.push('كل الحركات بمبالغ وتواريخ سليمة');
  // 5) تكرار محتمل
  const seen = {}; let dups=0;
  tx.forEach(t=>{ const k=[t.type,t.date,t.amount,t.category,t.note].join('|'); if(seen[k]) dups++; seen[k]=1; });
  if(dups) issues.push(`${dups} حركة مكررة محتملة (نفس النوع والتاريخ والمبلغ والفئة والملاحظة)`); else ok.push('لا توجد حركات مكررة');
  // 6) مصروفات بدون سند
  const linked = new Set((state.vouchers||[]).map(v=>v.txId).filter(Boolean));
  const noV = tx.filter(t=>t.type==='expense' && !linked.has(t.id) && !isBankFeeTx(t));
  if(noV.length) issues.push(`${noV.length} مصروف بدون سند صرف (${fmt(noV.reduce((s,t)=>s+Number(t.amount),0))} ر.س)`); else ok.push('كل المصروفات لها سندات صرف');
  // 7) مطابقة الرصيد
  const income = tx.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0);
  const expense = tx.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  const pbk = placeBalances();
  if(pbk.bank < 0){
    const bx = tx.filter(t=>t.type==='expense' && t.place==='bank').sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    issues.push(`رصيد حساب العمارة المسجَّل سالب (${fmt(pbk.bank)}). مصروفات معلَّمة "حساب العمارة" (${bx.length}): `+bx.slice(0,10).map(t=>`${t.date} ${fmt(t.amount)} ر.س`).join(' ، ')+(bx.length>10?' …':'')+' — إن كان بينها ما دُفع من حسابك الشخصي فغيّره إلى "عهدة المدير"، وإن كانت دفعات دخلت البنك ولم تُسجَّل فسجّلها');
  }
  if(state.bankActual && state.bankActual.amount!==undefined && state.bankActual.amount!==''){
    const _exp = pbk.bank + trustAmount();
    const d = Number(state.bankActual.amount) - _exp;
    if(Math.abs(d)>=0.005) issues.push(`رصيد البنك الفعلي (${fmt(state.bankActual.amount)}) يختلف عن المسجَّل في النظام (${fmt(_exp)}${trustAmount()?' = '+fmt(pbk.bank)+' للجمعية + '+fmt(trustAmount())+' أمانة':''}) بفرق ${fmt(d)} ر.س`);
    else ok.push('رصيد البنك مطابق لكشف البنك ('+fmt(_exp)+' ر.س)');
  }
  // مصروف بنفس مبلغ تحويل بين الأماكن: غالبًا تكرار (التحويل ينقل المال فقط، والصرف منه مسجَّل أصلًا)
  (state.transfers||[]).forEach(tr=>{
    const hit = tx.filter(t=>t.type==='expense' && Math.abs(Number(t.amount)-Number(tr.amount))<0.005);
    if(hit.length) issues.push(`تحويل بين الأماكن ${fmt(tr.amount)} ر.س (${tr.date||''}) يقابله مصروف بنفس المبلغ (${hit.map(t=>t.date).join('، ')}) — إن كان تكرارًا فاحذف المصروف، فالتحويل ينقل المال فقط`);
  });
  const bal = Number(state.openingBalance||0) + stored + income - expense;
  return {issues, ok, bal, opening:Number(state.openingBalance||0), stored, income, expense};
}

function buildFinanceReportHTML(){
  // Respect the currently selected month (financeMonth) and type tab (financeFilter),

  const scoped = monthScoped.filter(t=>financeFilter==='all'||t.type===financeFilter);
  // نفس حساب الشاشة: الإيراد من الشهر السابق عند تفعيل الترحيل + الدفعات الشهرية

  const srcScoped = srcMonth ? state.transactions.filter(t=>(t.date||'').slice(0,7)===srcMonth) : state.transactions;

  const otherInc = txIncome - roomsRent;
  const duesIncome = paidDuesTotal(srcMonth);
  const income = txIncome + duesIncome;

  const net = income - expense;

  const sumExp = scoped.filter(t=>t.type==='expense').reduce((a,t)=>a+Number(t.amount),0);

  if(closing!==null) finBoxHTML += `<div class="tb ${closing<0?'':'ok'}"><div class="l">المتبقي (رصيد الحساب نهاية الشهر)</div><div class="v ${closing<0?'tot-red':'tot-green'}">${closing<0?'⚠ عجز ':''}${fmt(Math.abs(closing))} ر.س</div></div>`;
  finBoxHTML += '</div>';
  const sumRows = (financeFilter!=='income' && sumExp? `<tr class="sum-row"><td colspan="5">إجمالي المصروفات</td><td class="tot-red">${fmt(sumExp)} ر.س</td></tr>` : '') + (financeFilter!=='expense' && sumInc? `<tr class="sum-row"><td colspan="5">إجمالي الإيرادات</td><td class="tot-green">${fmt(sumInc)} ر.س</td></tr>` : '');
  const rows = [...scoped].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(t=>`<tr>

      <td>${esc(t.category)}</td>
      <td>${esc(t.method||'—')}</td>
      <td>${esc(t.note||'—')}</td>
      <td style="font-weight:700;">${t.type==='income'?'+':'-'}${fmt(t.amount)} ر.س</td>
    </tr>`).join('');
  return `
  <div class="stmt-page">
    <div class="stmt-header">
      <img src="${LOGO_URI}" class="stmt-logo" alt="شعار">
      <div>
        <div class="stmt-building">${esc(state.buildingName)}</div>
        <div class="stmt-title">تقرير الإيرادات والمصروفات — ${esc(scopeLabel)}</div>
      </div>
      <div class="stmt-date">تاريخ الطباعة: ${today}</div>
    </div>
    <table class="stmt-info">
      <tr>

        ${financeFilter==='all'?`<td><b>${(income-expense)<0?'العجز':(income-expense)>0?'الفائض':'الصافي'}:</b> <span style="color:${(income-expense)>=0?'#1f9d55':'#c0392b'}">${(income-expense)<0?'⚠ ':''}${fmt(Math.abs(income-expense))} ر.س</span></td>`:''}
      </tr>
    </table>
    ${finBoxHTML}
    ${financeFilter!=='expense'?`<table class="stmt-info">
      <tr>
        <td><b>الدفعات الشهرية (الشقق):</b> ${fmt(duesIncome)} ر.س</td>

    <div style="font-size:12px;margin:0 0 10px;color:#555;">الرصيد الافتتاحي للنظام: ${fmt(state.openingBalance||0)} ر.س — ${esc(openingBalanceText())}</div>

}

/* ---------------- سند صرف (Payment Voucher) ----------------
   One unified place for the "سند صرف" design: a live editable form on
   the "سند صرف" page, backed by a cloud-synced voucher number
   (state.nextVoucherNo) instead of the old standalone file's
   localStorage-only counter, plus a one-click "سند صرف" shortcut from
   any expense row on the finance page that pre-fills the form. */
function todayISODate(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function newVoucherDraft(prefill){
  return Object.assign({
    to:'', amount:'', sub:'', cur:'SAR', for:'', method:'cash', ref:'', bank:'',
    unit:'', note:'', s1:'',
    s3:(state && state.voucherDefaults && state.voucherDefaults.manager)||'',
    date: todayISODate()
  }, prefill||{});
}
// Not initialized here: `state` is still null at script-parse time (it loads
// asynchronously after auth), so building the draft now would throw and take
// down the whole app. It's created lazily the first time the page is opened.
let voucherDraft = null;
let voucherHistoryMonth = dashDefaultMonth(); // '' means "كل الأشهر" (no month filter) in the vouchers log below
let voucherEditingId = null; // set when the draft was opened from an existing history record, so printing updates it in place instead of creating a duplicate
// id of an existing المصروفات transaction this voucher should stay linked to
// instead of creating a second one — set either when the voucher was started
// from an expense row ("🧾 سند صرف") or carried over from a saved voucher
// record that already has a linked transaction.
let voucherSourceTxId = null;
/* شهر السند في السجل: إن كان مصروفه المرتبط مسجَّلًا على شهر آخر (دُفع في شهر ويخص غيره) فالعبرة بشهر التسجيل */
function vchAccMonth(v){
  const t = v && v.txId ? (state.transactions||[]).find(x=>x.id===v.txId) : null;
  return ((t && t.payDate && t.date) ? t.date : (v.date||'')).slice(0,7);
}
function openVoucherForExpense(txId){
  const t = state.transactions.find(x=>x.id===txId);
  if(!t) return;
  const amt = Number(t.amount)||0;
  voucherDraft = newVoucherDraft({
    amount: String(Math.trunc(amt)),
    sub: Math.round((amt%1)*100) ? String(Math.round((amt%1)*100)).padStart(2,'0') : '',
    for: t.category + (t.note ? ' — '+t.note : ''),
    method: t.method==='تحويل' ? 'transfer' : (t.method==='بطاقة مدى'||t.method==='شبكة'||t.method==='شراء عبر نقاط البيع') ? 'card' : 'cash',
    date: t.payDate || t.date || todayISODate()
  });
  voucherEditingId = null;
  voucherSourceTxId = txId;
  currentView = 'voucher'; render();
}
// Computes the total amount (main + sub units) of a voucher draft/record as a number.
function vchTotalAmount(d){
  return (Number(d.amount)||0) + (Number(d.sub)||0)/100;
}
const VCH_ONES=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
const VCH_TENS=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
const VCH_HUND=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
function vchBelow1000(n){
  const h=Math.floor(n/100), r=n%100, p=[];
  if(h) p.push(VCH_HUND[h]);
  if(r){ if(r<20) p.push(VCH_ONES[r]); else { const u=r%10,t=Math.floor(r/10); p.push(u? VCH_ONES[u]+' و'+VCH_TENS[t] : VCH_TENS[t]); } }
  return p.join(' و');
}
const VCH_SCALES=[['ألف','ألفان','آلاف','ألفاً'],['مليون','مليونان','ملايين','مليوناً'],['مليار','ملياران','مليارات','ملياراً']];
function vchScaleWord(g,s){
  if(g===1) return s[0];
  if(g===2) return s[1];
  const r=g%100;
  if(r>=3&&r<=10) return vchBelow1000(g)+' '+s[2];
  if(r>=11) return vchBelow1000(g)+' '+s[3];
  return vchBelow1000(g)+' '+s[0];
}
function vchToWords(n){
  if(n===0) return 'صفر';
  const parts=[]; let i=-1;
  while(n>0){
    const g=n%1000;
    if(g) parts.unshift(i<0? vchBelow1000(g) : vchScaleWord(g,VCH_SCALES[i]));
    n=Math.floor(n/1000); i++;
    if(i>=VCH_SCALES.length && n>0) return 'مبلغ كبير جداً';
  }
  return parts.join(' و');
}
const VCH_CUR={ SAR:{main:'ريال',full:'ريال سعودي',sub:'هللة'}, EGP:{main:'جنيه',full:'جنيه مصري',sub:'قرش'}, USD:{main:'دولار',full:'دولار أمريكي',sub:'سنت'} };
function vchAmountWords(draft){
  const c = VCH_CUR[draft.cur]||VCH_CUR.SAR;
  const main = parseInt(draft.amount,10)||0;
  const sub = Math.min(99, parseInt(draft.sub,10)||0);
  if(!main && !sub) return '—';
  let t='فقط ';
  if(main) t += vchToWords(main)+' '+c.full;
  if(sub) t += (main?' و':'')+vchToWords(sub)+' '+c.sub;
  return t+' لا غير';
}
function vchHijri(iso){
  if(!iso) return '';
  try{
    const d = new Date(iso+'T12:00:00');
    return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(d);
  }catch(e){ return ''; }
}

// Creates or updates the المصروفات transaction linked to a voucher, so every
// سند صرف automatically shows up as an expense — instead of the two living
// as separate, easy-to-forget records. Returns the transaction's id.
function syncVoucherExpenseTx(voucherNo, draft, existingTxId){
  if(!state.transactions) state.transactions = [];
  const amount = vchTotalAmount(draft);
  const label = String(voucherNo).padStart(4,'0');
  const payload = {
    type:'expense',
    amount,
    category: draft.unit || draft.for || 'سند صرف',
    method: draft.method==='cash' ? 'كاش' : draft.method==='card' ? 'بطاقة مدى' : 'تحويل',
    date: draft.date || todayISODate(),
    note: 'سند صرف رقم '+label + (draft.for ? ' — '+draft.for : ''),
    voucherNo
  };
  let tx = existingTxId ? state.transactions.find(t=>t.id===existingTxId) : null;
  if(tx){
    if(draft.method==='card' && (tx.method==='شبكة'||tx.method==='بطاقة مدى'||tx.method==='شراء عبر نقاط البيع')) payload.method = tx.method; // لا نفقد التفريق بين مدى وشبكة
    if(tx.payDate && payload.date===tx.payDate){ delete payload.date; } // شهر التسجيل المنقول يبقى كما هو
    else if(tx.payDate){ delete tx.payDate; }
    Object.assign(tx, payload);
  } else {
    if(!state.nextIds) state.nextIds = {};
    if(!state.nextIds.tx) state.nextIds.tx = 1;
    const a = applyExpenseAccMonth(payload.date);
    if(a.payDate){ payload.date = a.date; payload.payDate = a.payDate; }
    tx = Object.assign({id:'t'+(state.nextIds.tx++), hasAttachment:false}, payload);
    state.transactions.push(tx);
  }
  return tx.id;
}
// One-click cleanup for vouchers saved before auto-linking existed (or whose
// linked transaction was deleted straight from المصروفات) — creates a fresh
// expense entry for each and links it, so سند الصرف and المصروفات match up.
async function backfillVoucherExpenseLinks(){
  const unlinked = state.vouchers.filter(v=>(!v.txId || !state.transactions.some(t=>t.id===v.txId)) && !isMonthLocked(v.date));
  if(unlinked.length===0){ alert('كل السندات مرتبطة بمصروفاتها بالفعل ✅'); return; }
  if(!confirm('هذا بينشئ حركة مصروف جديدة لكل سند من '+unlinked.length+' سند غير مرتبط حاليًا بمصروف، بنفس مبلغه وتاريخه. تكمل؟')) return;
  unlinked.forEach(v=>{
    const txId = syncVoucherExpenseTx(v.no, v, null);
    v.txId = txId;
  });
  await saveState();
  render();
  alert('تم — تم ربط '+unlinked.length+' سند بحركات مصروف جديدة في الإيرادات والمصروفات.');
}

function vchDuplicateOf(n, exceptId){

}
function vchNextFreeNo(){
  const used = new Set((state.vouchers||[]).map(v=>v.no));
  let n = Math.max(0, ...used) + 1; return n;
}
async function printVoucher(){
  if(!state.vouchers) state.vouchers = [];
  const _exRec = voucherEditingId ? state.vouchers.find(v=>v.id===voucherEditingId) : null;
  const no = _exRec ? (Number(voucherDraft._editNo)||_exRec.no) : state.nextVoucherNo;
  delete voucherDraft._editNo;
  { const dupV = vchDuplicateOf(no, voucherEditingId);
    if(dupV && !confirm('⚠ يوجد سند آخر بنفس الرقم '+String(no).padStart(4,'0')+' (التاريخ '+(dupV.date||'')+' — '+String(dupV.for||'').slice(0,40)+').\n\nالأفضل أن تلغي وتختار الرقم التالي الفارغ: '+String(vchNextFreeNo()).padStart(4,'0')+'.\n\nهل تريد المتابعة بالرقم المكرر؟')) return; }
  {
    const ex = voucherEditingId ? state.vouchers.find(v=>v.id===voucherEditingId) : null;
    if(ex && !assertMonthOpen(ex.date,'تعديل هذا السند')) return;
    if(!assertMonthOpen(voucherDraft.date || todayISODate(),'حفظ سند فيه')) return;
  }
  if(voucherEditingId){
    // This draft was opened from an existing history record ("✎ فتحه
    // كمسودة") — update that same record in place instead of archiving a
    // brand-new one, so correcting a mistake doesn't duplicate the voucher.
    const idx = state.vouchers.findIndex(v=>v.id===voucherEditingId);
    if(idx === -1){
      // The original record was deleted meanwhile — fall back to saving as new.
      const id = 'vh'+Date.now()+Math.random().toString(36).slice(2,7);
      const txId = syncVoucherExpenseTx(no, voucherDraft, voucherSourceTxId);
      state.vouchers.push(Object.assign({}, voucherDraft, {no, id, txId, savedAt: new Date().toISOString()}));
      state.nextVoucherNo = Math.max(state.nextVoucherNo, no+1);
    } else {
      const existing = state.vouchers[idx];
      const txId = syncVoucherExpenseTx(no, voucherDraft, existing.txId || voucherSourceTxId);
      state.vouchers[idx] = Object.assign({}, existing, voucherDraft, {no, id: existing.id, txId, savedAt: new Date().toISOString()});
      // Editing a saved voucher doesn't consume the next-number counter —
      // only genuinely new vouchers (below) advance it.
      if(no >= state.nextVoucherNo) state.nextVoucherNo = no + 1;
    }
    openVoucherPrintWindow(no, voucherDraft);
    voucherEditingId = null;
    voucherSourceTxId = null;
  } else {
    openVoucherPrintWindow(no, voucherDraft);
    // Archive a snapshot of this voucher so it can be found later by date/month
    // and reprinted — the same way الدفعات الشهرية lets you go back to past
    // months — instead of the data only ever living in the on-screen draft.
    // Each record gets its own unique id (separate from the السند number,
    // which the person can freely reuse/override) so a specific record can be
    // reprinted, reopened or deleted even if two records share the same no.
    const id = 'vh'+Date.now()+Math.random().toString(36).slice(2,7);
    // If this draft came from an existing expense row ("🧾 سند صرف"), keep
    // updating that same transaction instead of adding a duplicate one.
    const txId = syncVoucherExpenseTx(no, voucherDraft, voucherSourceTxId);
    state.vouchers.push(Object.assign({}, voucherDraft, {no, id, txId, savedAt: new Date().toISOString()}));
    state.nextVoucherNo = no + 1;
    voucherSourceTxId = null;
  }
  await saveState();
  render();
}

// Finds expense entries whose "سند صرف رقم N" number is used more than once,
// and gives only the later duplicates a fresh number. Existing unique numbers
// are never touched (so printed paper vouchers still match). Also reports gaps.

// Makes the "سند صرف رقم N" text in each linked expense match the voucher's
// real number in the register (the number printed on the paper voucher).
// Voucher numbers are never changed — only the expense notes follow them.
async function syncExpenseNotesWithVoucherNumbers(){
  const re = /(سند صرف رقم\s*)(\d+)/;
  const changes = [];
  (state.vouchers||[]).forEach(v=>{
    if(!v.txId) return;
    const t = (state.transactions||[]).find(x=>x.id===v.txId);
    if(!t || !re.test(t.note||'')) return;
    const cur = parseInt(t.note.match(re)[2],10);
    if(cur!==v.no || t.voucherNo!==v.no) changes.push({t, v, from:cur, to:v.no});
  });
  if(changes.length===0){ alert('أرقام المصروفات مطابقة لأرقام السندات ✅'); return; }
  const lines = changes.map(c=>'• '+String(c.from).padStart(4,'0')+' ← '+String(c.to).padStart(4,'0')+'  ('+(c.t.date||'')+' — '+(c.v.for||'')+' — '+c.t.amount+')').join('\n');
  if(!confirm('سيُصحَّح رقم السند في ملاحظة '+changes.length+' مصروف ليطابق سجل السندات (أرقام السندات نفسها لا تتغير):\n\n'+lines+'\n\nتكمل؟')) return;
  changes.forEach(c=>{
    c.t.note = c.t.note.replace(re, (m,a)=> a+String(c.to).padStart(4,'0'));
    c.t.voucherNo = c.to;
  });
  await saveState();
  render();
  alert('تم — صُحّح '+changes.length+' مصروف. أعد طباعة التقرير.');
}

// Finds expense entries whose number repeats (kept for rare cases)
async function fixDuplicateVoucherNumbers(){
  if(Object.keys(state.lockedMonths||{}).length>0){ alert('🔒 توجد أشهر مُقفلة، وإصلاح المكرر قد يغيّر أرقام سندات مطبوعة. افتح الإقفال أولًا من الإعدادات إن لزم.'); return; }
  const re = /(سند صرف رقم\s*)(\d+)/;
  const items = (state.transactions||[])
    .filter(t=>t.type==='expense' && re.test(t.note||''))
    .map(t=>({t, no: parseInt((t.note.match(re))[2],10)}));
  const byNo = {};
  items.forEach(it=>{ (byNo[it.no] = byNo[it.no]||[]).push(it); });
  let maxNo = Math.max(0, (state.nextVoucherNo||1)-1, ...items.map(i=>i.no));
  const changes = [];
  Object.keys(byNo).forEach(k=>{
    const g = byNo[k];
    if(g.length<2) return;
    g.sort((a,b)=> (a.t.date||'').localeCompare(b.t.date||'') || String(a.t.id).localeCompare(String(b.t.id), undefined, {numeric:true}));
    g.slice(1).forEach(it=>{ changes.push({it, from: it.no, to: ++maxNo}); });
  });
  const used = new Set(items.map(i=>i.no));
  changes.forEach(c=>used.add(c.to));
  const gaps = [];
  for(let n=1;n<=maxNo;n++){ if(!used.has(n)) gaps.push(String(n).padStart(4,'0')); }
  if(changes.length===0){
    alert('لا توجد أرقام سندات مكررة ✅'+(gaps.length?'\n\nأرقام غير مستخدمة (فجوات): '+gaps.join('، '):''));
    return;
  }
  const lines = changes.map(c=>'• '+String(c.from).padStart(4,'0')+' ← '+String(c.to).padStart(4,'0')+'  ('+(c.it.t.date||'')+' — '+(c.it.t.note||'').replace(/سند صرف رقم\s*\d+\s*[—–-]?\s*/,'').slice(0,40)+')').join('\n');
  if(!confirm('سيُغيَّر رقم السندات المكررة التالية فقط (الباقي لا يُمس):\n\n'+lines+'\n\nتكمل؟')) return;
  changes.forEach(c=>{
    const t = c.it.t;
    t.note = t.note.replace(re, (m,a)=> a+String(c.to).padStart(4,'0'));
    t.voucherNo = c.to;
    (state.vouchers||[]).forEach(v=>{ if(v.txId===t.id) v.no = c.to; });
  });
  state.nextVoucherNo = Math.max(state.nextVoucherNo||1, maxNo+1);
  await saveState();
  render();
  alert('تم — صُحّح '+changes.length+' رقم مكرر.'+(gaps.length?'\n\nأرقام غير مستخدمة (فجوات) للمراجعة: '+gaps.join('، '):''));
}

/* استعادة أرقام السندات القديمة (مرة واحدة) بعد الترقيم التلقائي بالتاريخ. الرقم الحالي -> الرقم القديم المطبوع */
const VCH_RESTORE_MAP = {9:10,10:9,11:12,12:11,13:42,14:13,15:14,16:15,17:16,18:17,19:18,20:19,21:21,22:20,23:22,24:23,
  25:24,26:25,27:26,28:27,29:28,30:29,31:31,32:33,33:34,34:30,35:43,36:35,37:36,38:32,39:41,40:37,41:39,42:40,43:38};
async function restoreOldVoucherNumbers(){
  if(Object.keys(state.lockedMonths||{}).length>0){ alert('🔒 توجد أشهر مُقفلة. افتح الإقفال أولًا من الإعدادات ثم أعد المحاولة.'); return; }
  const vs = state.vouchers||[];
  const plan=[], skipped=[];
  vs.forEach(v=>{
    const to = VCH_RESTORE_MAP[v.no];
    if(!to || to===v.no) return;
    const mo = (v.date||'').slice(0,7);
    const okMonth = v.no<=24 ? mo==='2026-09' : mo==='2026-10';
    if(!okMonth){ skipped.push(String(v.no).padStart(4,'0')+' ('+(v.date||'')+')'); return; }
    plan.push({v, from:v.no, to});
  });
  if(!plan.length){ alert('لا يوجد ما يُستعاد.'+(skipped.length?'\nتخطّيت لاختلاف التاريخ: '+skipped.join('، '):'')); return; }
  const lines = plan.slice().sort((a,b)=>a.from-b.from).map(p=>String(p.from).padStart(4,'0')+' ← '+String(p.to).padStart(4,'0')+'  ('+(p.v.date||'')+' — '+String(p.v.for||'').slice(0,28)+')').join('\n');
  if(!confirm('سيُعاد '+plan.length+' سند إلى رقمه القديم المطبوع (الرقم الحالي ← القديم):\n\n'+lines+(skipped.length?'\n\nتخطّيت لاختلاف التاريخ: '+skipped.join('، '):'')+'\n\nتكمل؟')) return;
  const re = /(سند صرف رقم\s*)(\d+)/;
  plan.forEach(p=>{ p.v.no = p.to; });
  plan.forEach(p=>{
    const t = (state.transactions||[]).find(x=>x.id===p.v.txId);
    if(t){ if(re.test(t.note||'')) t.note = t.note.replace(re,(m,a)=>a+String(p.to).padStart(4,'0')); t.voucherNo = p.to; }
  });
  state.nextVoucherNo = Math.max(44, ...vs.map(v=>v.no+1));
  state.voucherRestoreLog = (state.voucherRestoreLog||[]).concat([{at:new Date().toISOString(), count:plan.length}]);
  await saveState(); render();
  alert('تم — أُعيد '+plan.length+' سند إلى رقمه القديم. راجع سجل السندات.');
}

  alert('أُوقفت إعادة الترقيم التلقائي حتى لا تتغير أرقام سندات مطبوعة أو موقَّعة.'); return;
  if(state.vouchers.length===0){ alert('لا توجد سندات في السجل بعد'); return; }
  if(Object.keys(state.lockedMonths||{}).length>0){ alert('🔒 توجد أشهر مُقفلة، وإعادة الترقيم تغيّر أرقام سندات مطبوعة. افتح الإقفال أولًا من الإعدادات إن كان ذلك ضروريًا فعلًا.'); return; }
  if(!confirm('سيُعاد ترتيب كل السندات (من كل الأشهر) حسب التاريخ من الأقدم للأحدث، وتُرقَّم تلقائيًا ١، ٢، ٣... بالتسلسل. ملاحظة: إذا كانت بعض السندات مطبوعة ورقيًا بأرقامها الحالية، رقمها المحفوظ هنا سيتغيّر وما بيطابق الورقة بعدها. تكملين؟')) return;
  const sorted = state.vouchers.slice().sort((a,b)=> (a.date||'').localeCompare(b.date||'') || (a.savedAt||'').localeCompare(b.savedAt||''));

function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(new Error('read failed'));
    r.readAsDataURL(file);
  });
}
/* Phone camera photos are often 8-15MB — way past what an invoice attachment
   needs. Downscale to a reasonable max width and re-encode as JPEG so normal
   photos comfortably fit the size limit without the person needing to resize
   anything themselves. PDFs and already-small images pass through untouched. */
function compressImageFile(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h*(maxWidth/w)); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('image load failed'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}
function estimateDataUrlBytes(dataUrl){
  const idx = dataUrl.indexOf(',');
  const b64 = idx>-1 ? dataUrl.slice(idx+1) : dataUrl;
  return Math.ceil(b64.length * 0.75);
}
async function saveTx(id){
  const type = document.getElementById('f-txtype').value;
  const amount = Number(document.getElementById('f-txamount').value)||0;
  const category = document.getElementById('f-txcat').value.trim()||'عام';
  const method = document.getElementById('f-txmethod').value;
  const note = document.getElementById('f-txnote').value.trim();
  const date = document.getElementById('f-txdate').value;
  const accMonth = (document.getElementById('f-txacc')||{}).value || '';
  let accDate = date, payDate;
  if(type==='expense' && accMonth && date && accMonth !== date.slice(0,7)){ payDate = date; accDate = accMonth+'-01'; }
  else if(!id && type==='expense' && !accMonth){ const a = applyExpenseAccMonth(date); accDate = a.date; payDate = a.payDate; }
  const placeEl = document.getElementById('f-txplace');
  const place = placeEl ? placeEl.value : '';
  const fileInput = document.getElementById('f-txfile');
  const file = fileInput && fileInput.files && fileInput.files[0];

  let tx;
  if(id){
    tx = state.transactions.find(x=>x.id===id);
    if(!assertMonthOpen(tx.date,'تعديل هذه الحركة') || !assertMonthOpen(accDate,'نقل الحركة إلى هذا الشهر')) return;
    if(tx.payDate && !assertMonthOpen(tx.payDate,'تعديل هذه الحركة (شهر الدفع)')) return;
    if(payDate && !assertMonthOpen(payDate,'تسجيل دفعة فيه')) return;
    if(tx.roomPayKey){
      // حركة مرتبطة بدفعة غرفة: تبقى إيرادًا ويتزامن مبلغها مع صفحة الغرف
      if(type!=='income'){ alert('هذه الحركة مرتبطة بدفعة إيجار غرفة ولا يمكن تحويلها إلى مصروف. احذفها أو عدّل الدفعة من صفحة غرف السواقين.'); return; }
      const rp = state.roomPayments && state.roomPayments[tx.roomPayKey];
      if(rp) rp.amount = amount;
    }
    Object.assign(tx, {type, amount, category, method, note, date:accDate, place});
    if(payDate) tx.payDate = payDate; else delete tx.payDate;
  } else {
    if(!assertMonthOpen(accDate,'إضافة حركة فيه')) return;
    if(payDate && !assertMonthOpen(payDate,'تسجيل دفعة فيه')) return;
    tx = {id:'t'+(state.nextIds.tx++), type, amount, category, method, note, date:accDate, place, hasAttachment:false};
    if(payDate) tx.payDate = payDate;
    state.transactions.push(tx);
  }

  if(file){
    let dataUrl, mimeType = file.type, sizeBytes = file.size;
    if(file.type.startsWith('image/')){
      try{
        dataUrl = await compressImageFile(file, 1600, 0.75);
        mimeType = 'image/jpeg';
        sizeBytes = estimateDataUrlBytes(dataUrl);
      }catch(e){
        dataUrl = await readFileAsDataURL(file);
      }
    } else {
      dataUrl = await readFileAsDataURL(file);
    }
    if(sizeBytes > 4.5*1024*1024){
      alert('حجم الملف كبير جدًا حتى بعد الضغط (الحد الأقصى تقريبًا 4.5 ميغابايت) — جرب صورة أخرى أو ملف أصغر');
    } else {
      try{
        await storageSet('attachment:'+tx.id, JSON.stringify({name:file.name, type:mimeType, data:dataUrl}));
        tx.hasAttachment = true;
        tx.attachmentName = file.name;
      }catch(e){ alert('تعذّر حفظ المرفق'); }
    }
  }

  await saveState(); closeModal(); render();
}
async function deleteTx(id){
  const tx = state.transactions.find(t=>t.id===id);
  if(tx && (!assertMonthOpen(tx.date,'حذف هذه الحركة') || (tx.payDate && !assertMonthOpen(tx.payDate,'حذف هذه الحركة (شهر الدفع)')))) return;
  if(tx && tx.roomPayKey && state.roomPayments && state.roomPayments[tx.roomPayKey]){
    // حذف حركة إيجار غرفة = إلغاء الدفعة في صفحة الغرف، حتى لا يختلف الرقمان
    state.roomPayments[tx.roomPayKey].paid = false;
  }
  if(tx && tx.roomId){
    const r = state.driverRooms.find(x=>x.id===tx.roomId);
    if(r) r.collected = Math.max(0, Number(r.collected||0) - Number(tx.amount||0));
  }
  state.transactions = state.transactions.filter(t=>t.id!==id);
  await storageRemove('attachment:'+id);
  await saveState(); render();
}
async function viewAttachment(id){
  try{
    const raw = await storageGet('attachment:'+id);
    if(!raw){ alert('تعذّر العثور على المرفق'); return; }
    const {name, type, data} = JSON.parse(raw);
    const w = window.open('', '_blank');
    if(!w){ alert('يرجى السماح بالنوافذ المنبثقة لعرض المرفق'); return; }
    const body = type && type.startsWith('image')
      ? `<img src="${data}" style="max-width:100%;max-height:100vh;display:block;margin:auto;">`
      : `<iframe src="${data}" style="width:100vw;height:100vh;border:none;"></iframe>`;
    w.document.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>${esc(name)}</title>
      <style>html,body{margin:0;background:#22282a;min-height:100vh;}</style>
      </head><body>${body}</body></html>`);
    w.document.close();
  }catch(e){ alert('تعذّر عرض المرفق'); }
}

  list = [...list].reverse();

  const grid = document.createElement('div');
  grid.className='req-grid';
  if(list.length===0){
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1;">لا توجد طلبات مطابقة</div>';
  } else {
    list.forEach(m=>{
      const card = document.createElement('div');
      card.className='req-card';
      card.innerHTML = `
        <div class="req-tags">${statusBadge(m.status)}<span class="badge gray">${m.type}</span><span class="badge gray">${m.priority}</span></div>
        <div class="req-title">${m.title}</div>
        <div class="req-desc">${m.desc}</div>
        <div class="req-meta">
          <div class="req-meta-row"><span>الموقع:</span><b>${m.location}</b></div>
          <div class="req-meta-row"><span>الشقة:</span><b>${m.unit}</b></div>
          <div class="req-meta-row"><span>تاريخ البلاغ:</span><b>${m.reportDate}</b></div>
          <div class="req-meta-row"><span>بدء التنفيذ:</span><b>${m.startDate||'—'}</b></div>
          <div class="req-meta-row"><span>انتهاء التنفيذ:</span><b>${m.endDate||'—'}</b></div>
        </div>
        <div class="req-actions">
          ${m.status!=='مكتملة' ? `<button class="btn btn-sm" onclick="advanceMnt('${m.id}')">${m.status==='طلب جديد'?'بدء التنفيذ':'إغلاق كمكتمل'}</button>` : ''}
          <button class="btn-ghost btn-sm" onclick="openMntModal('${m.id}')">تعديل</button>
          <button class="btn-ghost btn-sm" onclick="printMntItem('${m.id}')">🖨 طباعة</button>
          <button class="btn-danger btn-sm" onclick="deleteMnt('${m.id}')">حذف</button>
        </div>
      `;
      grid.appendChild(card);
    });
  }
  wrap.innerHTML = '';
  wrap.appendChild(grid);
}
function buildMntCardHTML(m){
  return `
    <table class="stmt-info">
      <tr><td><b>عنوان الطلب:</b> ${esc(m.title)}</td><td><b>الحالة:</b> ${esc(m.status)}</td></tr>
      <tr><td><b>الموقع:</b> ${esc(m.location||'—')}</td><td><b>الشقة:</b> ${esc(m.unit||'—')}</td></tr>
      <tr><td><b>نوع الصيانة:</b> ${esc(m.type)}</td><td><b>الأولوية:</b> ${esc(m.priority)}</td></tr>
      <tr><td><b>تاريخ البلاغ:</b> ${esc(m.reportDate)}</td><td><b>بدء التنفيذ:</b> ${esc(m.startDate||'—')}</td></tr>
      <tr><td><b>انتهاء التنفيذ:</b> ${esc(m.endDate||'—')}</td><td></td></tr>
    </table>
    <div class="stmt-section-title">الوصف</div>
    <p style="font-size:13px;line-height:1.7;">${esc(m.desc||'—')}</p>`;
}
function buildMntReportHTML(list, title){
  const today = new Date().toLocaleDateString('ar-SA');
  const body = list.map(m=>`
    <div class="stmt-page">
      <div class="stmt-header">
        <img src="${LOGO_URI}" class="stmt-logo" alt="شعار">
        <div>
          <div class="stmt-building">${esc(state.buildingName)}</div>
          <div class="stmt-title">${esc(title)}</div>
        </div>
        <div class="stmt-date">تاريخ الطباعة: ${today}</div>
      </div>
      ${buildMntCardHTML(m)}
      <div class="stmt-stamp-wrap"><img src="${STAMP_URI}" class="stmt-stamp" alt="ختم"></div>
      <div class="stmt-footer">هذا المستند صادر آليًا من نظام إدارة العمارة ولا يحتاج توقيعًا.</div>
    </div>`).join('\n');
  return body;
}
function printMntItem(id){
  const m = state.maintenance.find(x=>x.id===id);
  if(!m) return;
  const w = window.open('', '_blank');
  if(!w){ alert('يرجى السماح بالنوافذ المنبثقة للطباعة'); return; }
  w.document.write(`<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8">
    <title>طلب صيانة - ${esc(m.title)}</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>${STMT_STYLE}</style></head>
    <body>${printWatermarkHTML()}${buildMntReportHTML([m], 'طلب صيانة')}
    <script>window.onload=()=>{setTimeout(()=>window.print(),300);}<\/script>
    </body></html>`);
  w.document.close();
}
function printMaintenanceReport(){
  if(state.maintenance.length===0){ alert('لا توجد طلبات صيانة لطباعتها'); return; }
  let list = state.maintenance;
  if(mntFilterStatus!=='الكل') list = list.filter(m=>m.status===mntFilterStatus);
  const w = window.open('', '_blank');
  if(!w){ alert('يرجى السماح بالنوافذ المنبثقة للطباعة'); return; }
  w.document.write(`<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8">
    <title>طلبات الصيانة - ${esc(state.buildingName)}</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>${STMT_STYLE}</style></head>
    <body>${printWatermarkHTML()}${buildMntReportHTML(list, 'طلب صيانة')}
    <script>window.onload=()=>{setTimeout(()=>window.print(),400);}<\/script>
    </body></html>`);
  w.document.close();
}
async function advanceMnt(id){
  const m = state.maintenance.find(x=>x.id===id);
  if(m.status==='طلب جديد'){ m.status='قيد التنفيذ'; if(!m.startDate) m.startDate = new Date().toISOString().slice(0,10); }
  else if(m.status==='قيد التنفيذ'){ m.status='مكتملة'; if(!m.endDate) m.endDate = new Date().toISOString().slice(0,10); }
  await saveState(); render();
}
async function deleteMnt(id){
  state.maintenance = state.maintenance.filter(m=>m.id!==id);
  await saveState(); render();
}
function openMntModal(id){
  const m = id ? state.maintenance.find(x=>x.id===id) : null;
  const unitOptions = ['<option value="—">—</option>'].concat(state.units.map(u=>`<option value="${u.number}" ${m&&m.unit===u.number?'selected':''}>${u.number}</option>`)).join('');
  showModal(`
    <h3>${m?'تعديل طلب صيانة':'طلب صيانة جديد'}</h3>
    <div class="field"><label>عنوان الطلب</label><input id="f-mtitle" value="${m?m.title:''}"></div>
    <div class="field"><label>الوصف</label><textarea id="f-mdesc">${m?m.desc:''}</textarea></div>
    <div class="two-col">
      <div class="field"><label>الموقع</label><input id="f-mloc" value="${m?m.location:''}"></div>
      <div class="field"><label>الشقة</label><select id="f-munit">${unitOptions}</select></div>
    </div>
    <div class="two-col">
      <div class="field"><label>تاريخ بدء التنفيذ</label><input id="f-mstart" type="date" value="${m&&m.startDate?m.startDate:''}"></div>
      <div class="field"><label>تاريخ انتهاء التنفيذ</label><input id="f-mend" type="date" value="${m&&m.endDate?m.endDate:''}"></div>
    </div>
    <div class="two-col">
      <div class="field"><label>نوع الصيانة</label>
        <select id="f-mtype">
          <option ${m&&m.type==='كهرباء وإنارة'?'selected':''}>كهرباء وإنارة</option>
          <option ${m&&m.type==='سباكة ومياه'?'selected':''}>سباكة ومياه</option>
          <option ${m&&m.type==='تكييف'?'selected':''}>تكييف</option>
          <option ${m&&m.type==='مصاعد'?'selected':''}>مصاعد</option>
          <option ${m&&m.type==='أخرى'?'selected':''}>أخرى</option>
        </select>
      </div>
      <div class="field"><label>الأولوية</label>
        <select id="f-mpriority">
          <option ${m&&m.priority==='منخفضة'?'selected':''}>منخفضة</option>
          <option ${!m||m.priority==='عادية'?'selected':''}>عادية</option>
          <option ${m&&m.priority==='عاجلة'?'selected':''}>عاجلة</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn" onclick="saveMnt('${id||''}')">حفظ</button>
    </div>
  `);
}
async function saveMnt(id){
  const data = {
    title: document.getElementById('f-mtitle').value.trim()||'طلب صيانة',
    desc: document.getElementById('f-mdesc').value.trim(),
    location: document.getElementById('f-mloc').value.trim(),
    unit: document.getElementById('f-munit').value,
    startDate: document.getElementById('f-mstart').value,
    endDate: document.getElementById('f-mend').value,
    type: document.getElementById('f-mtype').value,
    priority: document.getElementById('f-mpriority').value
  };
  if(id){ Object.assign(state.maintenance.find(x=>x.id===id), data); }
  else{
    state.maintenance.push({
      id:'m'+(state.nextIds.mnt++), ...data,
      status:'طلب جديد', reportDate:new Date().toISOString().slice(0,10)
    });
  }
  await saveState(); closeModal(); render();
}

/* ---------------- modal helpers ---------------- */
function showModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });

/* ---------------- boot ---------------- */
(async function boot(){
  await loadState(); // load building data (cloud first, then local fallback, then defaults)
  // NOTE: we intentionally do NOT auto-save back to the cloud on every boot anymore.
  // Auto-saving here used to silently overwrite the shared cloud copy with whatever
  // this device happened to load (including an empty/default state on a fresh
  // device or after a failed cloud read), which is how data got wiped before.
  // loadState() below only writes to the cloud in the one-time migration case
  // (cloud empty but this device has real local data).
  const session = await supaGetSession();
  if(session){
    await enterApp();
  } else {
    showAuthScreen('login', null, '');
  }
})();
</script>
</body>
</html>
