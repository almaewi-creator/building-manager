<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة العمارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f1b2d;
    --navy-2:#152238;
    --teal:#0f9c8f;
    --teal-dark:#0b7d73;
    --teal-tint:#e3f6f3;
    --bg:#f5f7f9;
    --card:#ffffff;
    --border:#e6e9ee;
    --text:#16202c;
    --text-dim:#6b7684;
    --amber:#f6c453;
    --amber-tint:#fdf2da;
    --blue-tint:#e6eefc;
    --blue:#3b6fd6;
    --green-tint:#e5f7ec;
    --green:#1f9d55;
    --red:#e0524a;
    --red-tint:#fbe9e8;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal', system-ui, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  #app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:230px;
    background:var(--navy);
    color:#cfd8e3;
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    padding:18px 14px;
  }
  .sidebar-header{
    display:flex;align-items:center;gap:10px;
    padding:6px 6px 18px 6px;
    border-bottom:1px solid rgba(255,255,255,.08);
    margin-bottom:14px;
  }
  .sidebar-logo{
    width:34px;height:34px;border-radius:9px;
    background:#0a1420;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#fff;font-size:15px;flex-shrink:0;
    overflow:hidden;
  }
  .sidebar-logo img{width:100%;height:100%;object-fit:contain;}
  .sidebar-title{font-size:13px;font-weight:700;color:#fff;line-height:1.3;}
  .sidebar-sub{font-size:10.5px;color:#8b97a8;margin-top:1px;}
  .nav{display:flex;flex-direction:column;gap:3px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:9px;
    font-size:13.5px;font-weight:500;
    color:#b8c2d1;cursor:pointer;
    border:none;background:none;text-align:right;width:100%;
    font-family:inherit;
    transition:background .15s,color .15s;
  }
  .nav-item .ic{width:17px;text-align:center;font-size:14px;flex-shrink:0;}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-item.active{background:var(--teal);color:#fff;}
  .sidebar-footer{border-top:1px solid rgba(255,255,255,.08);padding-top:12px;margin-top:8px;}
  .sidebar-user{
    display:flex;align-items:center;gap:9px;
    padding:8px 6px;border-radius:9px;margin-bottom:8px;
  }
  .avatar{width:30px;height:30px;border-radius:50%;background:#26364d;display:flex;align-items:center;justify-content:center;font-size:12px;color:#cfd8e3;flex-shrink:0;}
  .sidebar-user-name{font-size:12px;color:#fff;font-weight:600;}
  .sidebar-user-role{font-size:10.5px;color:#8b97a8;}

  /* Main */
  .main{flex:1;padding:26px 30px;min-width:0;overflow-x:hidden;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
  .eyebrow{font-size:12.5px;color:var(--text-dim);font-weight:500;}
  h1{font-size:24px;font-weight:800;margin:2px 0 4px 0;}
  .page-desc{color:var(--text-dim);font-size:13px;margin:0;}
  .btn{
    background:var(--teal);color:#fff;border:none;border-radius:10px;
    padding:11px 18px;font-size:13.5px;font-weight:700;cursor:pointer;
    font-family:inherit;display:inline-flex;align-items:center;gap:6px;
    transition:background .15s;
  }
  .btn:hover{background:var(--teal-dark);}
  .btn-ghost{background:#fff;color:var(--text);border:1px solid var(--border);}
  .btn-ghost:hover{background:#f4f6f8;}
  .btn-danger{background:var(--red-tint);color:var(--red);}
  .btn-danger:hover{background:#f6d6d3;}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}

  .info-banner{
    background:var(--blue-tint);border:1px solid #d3e0fa;color:#2b4c8f;
    padding:13px 16px;border-radius:12px;font-size:13px;margin-bottom:18px;
  }

  .alerts-stack{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
  .alert-banner{
    display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-radius:12px;border:1px solid;
  }
  .alert-banner.red{background:var(--red-tint);border-color:#f3d3d0;}
  .alert-banner.amber{background:var(--amber-tint);border-color:#f3e3b8;}
  .alert-icon{
    width:30px;height:30px;border-radius:9px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  .alert-banner.red .alert-icon{background:#f6d6d3;color:var(--red);}
  .alert-banner.amber .alert-icon{background:#f3e3b8;color:#a6791b;}
  .alert-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
  .alert-text b{font-size:13.5px;font-weight:700;}
  .alert-text span{font-size:12px;color:var(--text-dim);}
  .alert-banner .btn-ghost{flex-shrink:0;background:#fff;}

  .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .defaulters-row{display:grid;grid-template-columns:1fr 240px;gap:14px;margin-top:16px;align-items:start;}
  .chart-card svg{display:block;width:100%;height:auto;margin-top:8px;}
  .chart-legend{display:flex;gap:14px;font-size:12px;color:var(--text-dim);}
  .chart-legend span{display:inline-flex;align-items:center;gap:5px;}
  .chart-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .chart-empty{font-size:12.5px;color:var(--text-dim);text-align:center;padding:40px 10px;}

  .nav-badge{
    background:#e0524a;color:#fff;font-size:10px;font-weight:700;
    border-radius:20px;min-width:17px;height:17px;padding:0 5px;
    display:inline-flex;align-items:center;justify-content:center;
    margin-inline-start:auto;line-height:1;
  }

  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
  .stat-card .num{font-size:26px;font-weight:800;margin-top:6px;}
  .stat-card .lbl{font-size:12.5px;color:var(--text-dim);font-weight:600;}
  .stat-card.tint-green{background:var(--green-tint);border-color:#cdeedb;}
  .stat-card.tint-blue{background:var(--blue-tint);border-color:#d3e0fa;}
  .stat-card.tint-amber{background:var(--amber-tint);border-color:#f3e3b8;}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .panel-title{font-weight:700;font-size:14.5px;margin-bottom:14px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:right;color:var(--text-dim);font-weight:600;font-size:12px;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#fafbfc;}

  .badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge.green{background:var(--green-tint);color:var(--green);}
  .badge.amber{background:var(--amber-tint);color:#a6791b;}
  .badge.blue{background:var(--blue-tint);color:var(--blue);}
  .badge.red{background:var(--red-tint);color:var(--red);}
  .badge.gray{background:#eef0f3;color:#5c6675;}

  .filters-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .filters-row select, .filters-row input{
    border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13px;
    font-family:inherit;background:#fff;color:var(--text);
  }
  .filters-row input[type=text]{flex:1;min-width:180px;}

  .req-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .req-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .req-tags{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .req-title{font-weight:700;font-size:15px;margin-bottom:4px;}
  .req-desc{font-size:12.5px;color:var(--text-dim);margin-bottom:12px;line-height:1.5;}
  .req-meta{background:#fafbfc;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;color:#3a4453;}
  .req-meta-row{display:flex;justify-content:space-between;padding:3px 0;}
  .req-meta-row b{font-weight:600;color:var(--text);}
  .req-actions{display:flex;gap:8px;margin-top:12px;}

  .icon-btn{background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:14px;padding:4px 6px;border-radius:6px;}
  .icon-btn:hover{background:#eef0f3;color:var(--text);}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,27,45,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;}
  .modal h3{margin:0 0 16px 0;font-size:17px;font-weight:800;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;
    font-size:13.5px;font-family:inherit;color:var(--text);background:#fff;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn,.modal-actions .btn-ghost{flex:1;justify-content:center;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .empty{text-align:center;color:var(--text-dim);font-size:13px;padding:30px 10px;}

  /* Login / setup screen */
  .auth-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--navy);padding:20px;
  }
  .auth-card{
    background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:380px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .auth-logo{
    width:56px;height:56px;border-radius:14px;margin:0 auto 16px auto;
    background:#0a1420;overflow:hidden;
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:19px;
  }
  .auth-logo img{width:100%;height:100%;object-fit:contain;}
  .auth-card h2{text-align:center;font-size:19px;font-weight:800;margin:0 0 4px 0;}
  .auth-card p.sub{text-align:center;color:var(--text-dim);font-size:12.5px;margin:0 0 22px 0;}
  .auth-error{
    background:var(--red-tint);color:var(--red);font-size:12.5px;border-radius:9px;
    padding:9px 12px;margin-bottom:14px;display:none;
  }
  .auth-error.show{display:block;}
  .auth-note{
    background:var(--blue-tint);color:#2b4c8f;font-size:11.5px;border-radius:9px;
    padding:9px 12px;margin-top:16px;line-height:1.6;
  }
  .auth-links{text-align:center;margin-top:14px;}
  .auth-links button{
    background:none;border:none;color:var(--text-dim);font-size:12px;cursor:pointer;
    font-family:inherit;text-decoration:underline;
  }

  @media(max-width:900px){
    #app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;align-items:center;}
    .sidebar-header{border:none;margin:0;padding:0 10px 0 0;}
    .nav{flex-direction:row;}
    .sidebar-footer{display:none;}
    .stats-row{grid-template-columns:repeat(2,1fr);}
    .charts-row{grid-template-columns:1fr;}
    .defaulters-row{grid-template-columns:1fr;}
    .req-grid{grid-template-columns:1fr;}
    .main{padding:18px 14px;}
    .alert-banner{flex-wrap:wrap;}
  }
</style>
</head>
<body>

<div id="authScreen" class="auth-wrap"></div>

<div id="app" style="display:none;">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo" id="bldgInitial"><img src="" id="bldgLogoImg" alt="شعار"></div>
      <div>
        <div class="sidebar-title" id="bldgName">عمارتي</div>
        <div class="sidebar-sub">لوحة رئيس اتحاد الملاك</div>
      </div>
    </div>
    <div class="nav" id="navList"></div>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar">👤</div>
        <div>
          <div class="sidebar-user-name" id="authUserLabel">رئيس اتحاد الملاك</div>
          <div class="sidebar-user-role">manager@building.local</div>
        </div>
      </div>
      <button class="nav-item" onclick="manualSaveNow(this)"><span class="ic">💾</span><span>حفظ الآن</span></button>
      <button class="nav-item" onclick="logout()"><span class="ic">⏻</span><span>تسجيل الخروج</span></button>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>

const hasClaudeStorage = () => typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
let hasLocalStorage = false;
try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); hasLocalStorage = true; }catch(e){ hasLocalStorage = false; }

// Generic persistence: prefer Claude's storage (works inside claude.ai),
// fall back to the browser's own localStorage (works when the file is opened
// directly / hosted anywhere else), so data survives either way.
async function storageGet(key){
  if(hasClaudeStorage()){
    try{ const r = await window.storage.get(key, false); if(r && r.value) return r.value; }catch(e){}
  }
  if(hasLocalStorage){
    try{ const v = localStorage.getItem(key); if(v) return v; }catch(e){}
  }
  return null;
}
async function storageSet(key, value){
  if(hasClaudeStorage()){
    try{ await window.storage.set(key, value, false); }catch(e){}
  }
  if(hasLocalStorage){
    try{ localStorage.setItem(key, value); }catch(e){}
  }
}
async function storageRemove(key){
  if(hasClaudeStorage()){
    try{ await window.storage.delete(key, false); }catch(e){}
  }
  if(hasLocalStorage){
    try{ localStorage.removeItem(key); }catch(e){}
  }
}

async function loadState(){
  const raw = await storageGet(STORE_KEY);
  if(raw){ try{ state = JSON.parse(raw); return; }catch(e){} }
  state = defaultState();
  await saveState();
}
async function saveState(){
  await storageSet(STORE_KEY, JSON.stringify(state));
}

  }catch(e){

  }
  setTimeout(()=>{ label.textContent = original; }, 1800);
}

/* ---------------- auth (basic privacy gate, not real security) ---------------- */
const AUTH_KEY = 'building30-auth-v1';
const SESSION_KEY = 'building30-session';

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function getAuth(){
  const raw = await storageGet(AUTH_KEY);
  return raw ? JSON.parse(raw) : null;
}
async function setAuth(username, password){
  const hash = await sha256(password);
  await storageSet(AUTH_KEY, JSON.stringify({username, hash}));
}
function isSessionActive(){
  try{ return sessionStorage.getItem(SESSION_KEY) === '1'; }catch(e){ return false; }
}
function setSessionActive(v){
  try{ if(v) sessionStorage.setItem(SESSION_KEY,'1'); else sessionStorage.removeItem(SESSION_KEY); }catch(e){}
}
function logout(){
  setSessionActive(false);
  location.reload();
}

        <button class="btn" style="width:100%;justify-content:center;" onclick="submitSetup()">إنشاء وتسجيل الدخول</button>

      </div>`;
  } else {
    el.innerHTML = `
      <div class="auth-card">
        <div class="auth-logo"><img src="${LOGO_URI}" alt="شعار"></div>
        <h2>تسجيل الدخول</h2>
        <p class="sub">${state && state.buildingName ? state.buildingName : 'لوحة إدارة العمارة'}</p>
        <div class="auth-error ${errorMsg?'show':''}">${errorMsg||''}</div>
        <div class="field"><label>اسم المستخدم</label><input id="au-user" autocomplete="username"></div>
        <div class="field"><label>كلمة المرور</label><input id="au-pass" type="password" autocomplete="current-password"></div>
        <button class="btn" style="width:100%;justify-content:center;" onclick="submitLogin()">دخول</button>
        <div class="auth-links"><button onclick="confirmReset()">نسيت البيانات؟ إعادة تعيين الدخول</button></div>

    inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ mode==='setup' ? submitSetup() : submitLogin(); } });
  });
}

async function submitSetup(){
  const user = document.getElementById('au-user').value.trim();
  const pass = document.getElementById('au-pass').value;
  const pass2 = document.getElementById('au-pass2').value;
  if(!user || !pass){ showAuthScreen('setup', null, 'الرجاء تعبئة اسم المستخدم وكلمة المرور'); return; }
  if(pass.length < 4){ showAuthScreen('setup', null, 'كلمة المرور قصيرة جدًا (٤ أحرف على الأقل)'); return; }
  if(pass !== pass2){ showAuthScreen('setup', null, 'كلمتا المرور غير متطابقتين'); return; }
  await setAuth(user, pass);
  setSessionActive(true);
  await enterApp();
}
async function submitLogin(){
  const user = document.getElementById('au-user').value.trim();
  const pass = document.getElementById('au-pass').value;
  const auth = await getAuth();
  const hash = await sha256(pass);
  if(!auth || auth.username !== user || auth.hash !== hash){
    showAuthScreen('login', auth, 'اسم المستخدم أو كلمة المرور غير صحيحة');
    return;
  }
  setSessionActive(true);
  await enterApp();
}
function confirmReset(){
  showModal(`
    <h3>إعادة تعيين بيانات الدخول</h3>
    <p style="font-size:13.5px;color:var(--text-dim);line-height:1.7;">

      بيانات العمارة (الشقق، الملاك، الصيانة...) لن تتأثر وتبقى محفوظة.
    </p>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn-danger" onclick="doResetAuth()">تأكيد إعادة التعيين</button>
    </div>
  `);
}
async function doResetAuth(){
  await storageRemove(AUTH_KEY);
  closeModal();
  showAuthScreen('setup', null, '');
}
async function enterApp(){
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  if(!state) await loadState();
  const auth = await getAuth();
  if(auth) document.getElementById('authUserLabel').textContent = auth.username;
  render();
}

/* ---------------- chart helpers ---------------- */
const CHART_MONTHS_SHORT = {'01':'ينا','02':'فبر','03':'مار','04':'أبر','05':'ماي','06':'يون','07':'يول','08':'أغس','09':'سبت','10':'أكت','11':'نوف','12':'ديس'};
function chartMonthLabel(key){
  const m = key.split('-')[1];
  return CHART_MONTHS_SHORT[m]||m;
}
function lastNMonthKeys(n){
  const out=[];
  const now = new Date();
  for(let i=n-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  return out;
}
function getMonthlyFinance(n){
  return lastNMonthKeys(n).map(k=>{
    const income = state.transactions.filter(t=>t.type==='income' && (t.date||'').slice(0,7)===k).reduce((s,t)=>s+Number(t.amount),0);
    const expense = state.transactions.filter(t=>t.type==='expense' && (t.date||'').slice(0,7)===k).reduce((s,t)=>s+Number(t.amount),0);
    return {month:k, income, expense};
  });
}
function getMonthlyCollectionRate(n){
  return lastNMonthKeys(n).map(k=>{
    let due=0, paid=0;
    state.units.forEach(u=>{
      const rec = state.payments[u.id+'|'+k];
      const amount = rec ? Number(rec.amount) : Number(u.monthlyFee||200);
      due += amount;
      if(rec && rec.paid) paid += amount;
    });
    const rate = due>0 ? Math.round((paid/due)*100) : 0;
    return {month:k, due, paid, rate};
  });
}
function buildFinanceChartSVG(data){
  const hasAny = data.some(d=>d.income>0 || d.expense>0);
  if(!hasAny) return '<div class="chart-empty">لا توجد حركات مالية خلال الفترة لعرض الرسم البياني</div>';
  const w=520, h=210, padL=42, padR=8, padT=14, padB=28;
  const chartW = w-padL-padR, chartH = h-padT-padB;
  const maxVal = Math.max(1, ...data.map(d=>Math.max(d.income,d.expense)));
  const groupW = chartW/data.length;
  const barW = Math.min(20, groupW*0.28);
  let bars='', grid='';
  for(let i=0;i<=3;i++){
    const y = padT + chartH - (chartH*i/3);
    const val = Math.round(maxVal*i/3);
    grid += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#e6e9ee" stroke-width="1"></line>`;
    grid += `<text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9.5" fill="#6b7684">${fmt(val)}</text>`;
  }
  data.forEach((d,i)=>{
    const cx = padL + i*groupW + groupW/2;
    const hIncome = (d.income/maxVal)*chartH;
    const hExpense = (d.expense/maxVal)*chartH;
    bars += `<rect x="${cx-barW-2}" y="${padT+chartH-hIncome}" width="${barW}" height="${Math.max(hIncome,0)}" rx="2.5" fill="#1f9d55"></rect>`;
    bars += `<rect x="${cx+2}" y="${padT+chartH-hExpense}" width="${barW}" height="${Math.max(hExpense,0)}" rx="2.5" fill="#e0524a"></rect>`;
    bars += `<text x="${cx}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="#6b7684">${chartMonthLabel(d.month)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${grid}${bars}</svg>`;
}
function buildCollectionChartSVG(data){
  const hasAny = data.some(d=>d.due>0);
  if(!hasAny) return '<div class="chart-empty">لا توجد بيانات دفعات كافية لعرض الرسم البياني</div>';
  const w=520, h=210, padL=36, padR=8, padT=18, padB=28;
  const chartW = w-padL-padR, chartH = h-padT-padB;
  const groupW = chartW/data.length;
  const barW = Math.min(30, groupW*0.5);
  let bars='', grid='';
  [0,25,50,75,100].forEach(v=>{
    const y = padT + chartH - (chartH*v/100);
    grid += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#e6e9ee" stroke-width="1"></line>`;
    grid += `<text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9.5" fill="#6b7684">${v}%</text>`;
  });
  data.forEach((d,i)=>{
    const cx = padL + i*groupW + groupW/2;
    const hBar = (d.rate/100)*chartH;
    const color = d.rate>=90 ? '#1f9d55' : d.rate>=60 ? '#f6c453' : '#e0524a';
    bars += `<rect x="${cx-barW/2}" y="${padT+chartH-hBar}" width="${barW}" height="${Math.max(hBar,1)}" rx="3" fill="${color}"></rect>`;
    bars += `<text x="${cx}" y="${padT+chartH-hBar-6}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#16202c">${d.rate}%</text>`;
    bars += `<text x="${cx}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="#6b7684">${chartMonthLabel(d.month)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${grid}${bars}</svg>`;
}

function polarToCartesian(cx,cy,r,angleDeg){
  const rad = angleDeg * Math.PI/180;
  return { x: cx + r*Math.sin(rad), y: cy - r*Math.cos(rad) };
}
function describeArc(cx,cy,r,startAngle,endAngle){
  const start = polarToCartesian(cx,cy,r,startAngle);
  const end = polarToCartesian(cx,cy,r,endAngle);
  const largeArcFlag = (endAngle-startAngle) <= 180 ? 0 : 1;
  return `M ${cx} ${cy} L ${start.x.toFixed(2)} ${start.y.toFixed(2)} A ${r} ${r} 0 ${largeArcFlag} 1 ${end.x.toFixed(2)} ${end.y.toFixed(2)} Z`;
}
function buildStatusPieSVG(settledCount, owingCount){
  const total = settledCount+owingCount;
  if(total===0) return '<div class="chart-empty">لا توجد شقق بعد</div>';
  const cx=90, cy=90, r=72;
  const owingAngle = (owingCount/total)*360;
  let paths='';
  if(owingCount>0) paths += `<path d="${describeArc(cx,cy,r,0,owingAngle)}" fill="#e0524a"></path>`;
  if(settledCount>0) paths += `<path d="${describeArc(cx,cy,r,owingAngle,360)}" fill="#1f9d55"></path>`;
  const owingPct = Math.round((owingCount/total)*100);
  return `<svg viewBox="0 0 180 180" width="180" height="180" xmlns="http://www.w3.org/2000/svg">
    ${paths}
    <circle cx="${cx}" cy="${cy}" r="40" fill="#ffffff"></circle>
    <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="22" font-weight="800" fill="#16202c">${owingPct}%</text>
    <text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="10.5" fill="#6b7684">متأخرون</text>
  </svg>`;
}

function buildArrearsBarChartSVG(defaulters){
  if(defaulters.length===0) return '<div class="chart-empty">لا يوجد أعضاء متأخرون لعرضهم بالرسم البياني 🎉</div>';
  const rowH = 28;
  const padL = 96, padR = 56, padT = 8, padB = 8;
  const w = 560;
  const chartW = w - padL - padR;
  const h = padT + padB + defaulters.length*rowH;
  const maxVal = Math.max(1, ...defaulters.map(u=>Math.abs(u.totalDue)));
  let bars = '';
  defaulters.forEach((u,i)=>{
    const y = padT + i*rowH;
    const barW = (Math.abs(u.totalDue)/maxVal)*chartW;
    bars += `<text x="${padL-8}" y="${y+rowH/2+4}" text-anchor="end" font-size="11.5" font-weight="600" fill="#16202c">${esc(u.number)}</text>`;
    bars += `<rect x="${padL}" y="${y+6}" width="${Math.max(barW,3)}" height="${rowH-12}" rx="4" fill="#e0524a"></rect>`;
    bars += `<text x="${padL+Math.max(barW,3)+7}" y="${y+rowH/2+4}" font-size="11.5" font-weight="700" fill="#c0392b">${fmt(Math.abs(u.totalDue))}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="http://www.w3.org/2000/svg">${bars}</svg>`;
}

async function saveUnit(id){
  const arrears = Number(document.getElementById('f-arrears').value)||0;
  const data = {
    number: document.getElementById('f-number').value.trim() || 'شقة',
    floor: Number(document.getElementById('f-floor').value)||1,
    owner: document.getElementById('f-owner').value.trim(),
    phone: document.getElementById('f-phone').value.trim(),
    monthlyFee: Number(document.getElementById('f-fee').value)||200,
    arrearsPrevious: arrears
  };
  let unit;
  if(id){
    unit = state.units.find(x=>x.id===id);
    Object.assign(unit, data);
  } else {
    const newId = 'u'+(state.nextIds.unit++);
    unit = {id:newId, ...data, collected:0, duesThisYear:0, totalDue:0};
    state.units.push(unit);
  }
  syncUnitFinancials(unit);
  await saveState(); closeModal(); render();
}
async function deleteUnit(id){
  state.units = state.units.filter(u=>u.id!==id);
  await saveState(); render();
}

/* ---------------- payments ---------------- */
function currentMonthKey(){
  const now = new Date();
  return now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
}
function lastCompletedMonthKey(){
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth()-1, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function firstBillingMonthKey(){
  let min = null;
  Object.keys(state.payments).forEach(k=>{
    const month = k.split('|')[1];
    if(!min || month < min) min = month;
  });
  return min || currentMonthKey();
}
function monthsBetweenInclusive(startKey, endKey){
  if(startKey > endKey) return [];
  const out = [];
  let [y,m] = startKey.split('-').map(Number);
  const [ey,em] = endKey.split('-').map(Number);
  while(y<ey || (y===ey && m<=em)){
    out.push(y+'-'+String(m).padStart(2,'0'));
    m++; if(m>12){ m=1; y++; }
  }
  return out;
}
/* Every riyal a unit has actually been marked as paid, across all recorded months —
   this always matches the payments checkboxes, so it can never drift out of sync. */
function computeUnitCollected(unit){
  let total = 0;
  const prefix = unit.id+'|';
  Object.keys(state.payments).forEach(k=>{
    if(k.startsWith(prefix) && state.payments[k].paid) total += Number(state.payments[k].amount)||0;
  });
  return total;
}
/* What the unit owes (or has overpaid) for months that have already fully elapsed,
   counting from the building's first billing month through last completed month.
   The current month is not counted yet — dues aren't "late" until the month is over. */
function computeUnitDuesThisYear(unit){
  const start = firstBillingMonthKey();
  const end = lastCompletedMonthKey();
  const months = monthsBetweenInclusive(start, end);
  let due=0, paid=0;
  months.forEach(mk=>{
    const rec = state.payments[unit.id+'|'+mk];
    const amount = rec ? Number(rec.amount) : Number(unit.monthlyFee||200);
    due += amount;
    if(rec && rec.paid) paid += amount;
  });
  return paid - due;
}
function syncUnitFinancials(unit){
  unit.collected = computeUnitCollected(unit);
  unit.duesThisYear = computeUnitDuesThisYear(unit);
  unit.totalDue = Number(unit.arrearsPrevious||0) + unit.duesThisYear;
}
function syncAllUnitsFinancials(){
  let changed = false;
  state.units.forEach(u=>{
    const before = JSON.stringify([u.collected,u.duesThisYear,u.totalDue]);
    syncUnitFinancials(u);
    if(JSON.stringify([u.collected,u.duesThisYear,u.totalDue]) !== before) changed = true;
  });
  return changed;
}

function openTxModal(){

    </div>

    <div class="field"><label>التاريخ</label><input id="f-txdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>صورة الفاتورة أو ملف PDF (اختياري)</label><input id="f-txfile" type="file" accept="image/*,application/pdf"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn" onclick="saveTx()">حفظ</button>
    </div>
  `);
}
function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(new Error('read failed'));
    r.readAsDataURL(file);
  });
}
async function saveTx(){
  const type = document.getElementById('f-txtype').value;
  const amount = Number(document.getElementById('f-txamount').value)||0;
  const category = document.getElementById('f-txcat').value.trim()||'عام';
  const note = document.getElementById('f-txnote').value.trim();
  const date = document.getElementById('f-txdate').value;
  const fileInput = document.getElementById('f-txfile');
  const file = fileInput && fileInput.files && fileInput.files[0];

  const tx = {id:'t'+(state.nextIds.tx++), type, amount, category, note, date, hasAttachment:false};

  if(file){
    if(file.size > 4.5*1024*1024){
      alert('حجم الملف كبير جدًا (الحد الأقصى تقريبًا 4.5 ميغابايت)');
    } else {
      try{
        const dataUrl = await readFileAsDataURL(file);
        await storageSet('attachment:'+tx.id, JSON.stringify({name:file.name, type:file.type, data:dataUrl}));
        tx.hasAttachment = true;
        tx.attachmentName = file.name;
      }catch(e){ alert('تعذّر حفظ المرفق'); }
    }
  }

  state.transactions.push(tx);
  await saveState(); closeModal(); render();
}
async function deleteTx(id){
  state.transactions = state.transactions.filter(t=>t.id!==id);
  await storageRemove('attachment:'+id);
  await saveState(); render();
}
async function viewAttachment(id){
  try{
    const raw = await storageGet('attachment:'+id);
    if(!raw){ alert('تعذّر العثور على المرفق'); return; }
    const {name, type, data} = JSON.parse(raw);
    const w = window.open('', '_blank');
    if(!w){ alert('يرجى السماح بالنوافذ المنبثقة لعرض المرفق'); return; }
    const body = type && type.startsWith('image')
      ? `<img src="${data}" style="max-width:100%;max-height:100vh;display:block;margin:auto;">`
      : `<iframe src="${data}" style="width:100vw;height:100vh;border:none;"></iframe>`;
    w.document.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>${esc(name)}</title>
      <style>html,body{margin:0;background:#22282a;min-height:100vh;}</style>
      </head><body>${body}</body></html>`);
    w.document.close();
  }catch(e){ alert('تعذّر عرض المرفق'); }
}

          ${m.status!=='مكتملة' ? `<button class="btn btn-sm" onclick="advanceMnt('${m.id}')">${m.status==='طلب جديد'?'بدء التنفيذ':'إغلاق كمكتمل'}</button>` : ''}
          <button class="btn-ghost btn-sm" onclick="openMntModal('${m.id}')">تعديل</button>
          <button class="btn-ghost btn-sm" onclick="printMntItem('${m.id}')">🖨 طباعة</button>
          <button class="btn-danger btn-sm" onclick="deleteMnt('${m.id}')">حذف</button>
        </div>
      `;
      grid.appendChild(card);
    });
  }
  wrap.innerHTML = '';
  wrap.appendChild(grid);
}
function buildMntCardHTML(m){
  return `
    <table class="stmt-info">
      <tr><td><b>عنوان الطلب:</b> ${esc(m.title)}</td><td><b>الحالة:</b> ${esc(m.status)}</td></tr>
      <tr><td><b>الموقع:</b> ${esc(m.location||'—')}</td><td><b>الشقة:</b> ${esc(m.unit||'—')}</td></tr>
      <tr><td><b>نوع الصيانة:</b> ${esc(m.type)}</td><td><b>الأولوية:</b> ${esc(m.priority)}</td></tr>
      <tr><td><b>تاريخ البلاغ:</b> ${esc(m.reportDate)}</td><td><b>تاريخ الإنجاز:</b> ${esc(m.execDate||'—')}</td></tr>
    </table>
    <div class="stmt-section-title">الوصف</div>
    <p style="font-size:13px;line-height:1.7;">${esc(m.desc||'—')}</p>`;
}
function buildMntReportHTML(list, title){
  const today = new Date().toLocaleDateString('ar-SA');
  const body = list.map(m=>`
    <div class="stmt-page">
      <div class="stmt-header">
        <img src="${LOGO_URI}" class="stmt-logo" alt="شعار">
        <div>
          <div class="stmt-building">${esc(state.buildingName)}</div>
          <div class="stmt-title">${esc(title)}</div>
        </div>
        <div class="stmt-date">تاريخ الطباعة: ${today}</div>
      </div>
      ${buildMntCardHTML(m)}
      <div class="stmt-footer">هذا المستند صادر آليًا من نظام إدارة العمارة ولا يحتاج توقيعًا.</div>
    </div>`).join('\n');
  return body;
}
function printMntItem(id){
  const m = state.maintenance.find(x=>x.id===id);
  if(!m) return;
  const w = window.open('', '_blank');
  if(!w){ alert('يرجى السماح بالنوافذ المنبثقة للطباعة'); return; }
  w.document.write(`<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8">
    <title>طلب صيانة - ${esc(m.title)}</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>${STMT_STYLE}</style></head>
    <body>${buildMntReportHTML([m], 'طلب صيانة')}
    <script>window.onload=()=>{setTimeout(()=>window.print(),300);}<\/script>
    </body></html>`);
  w.document.close();
}
function printMaintenanceReport(){
  if(state.maintenance.length===0){ alert('لا توجد طلبات صيانة لطباعتها'); return; }
  let list = state.maintenance;
  if(mntFilterStatus!=='الكل') list = list.filter(m=>m.status===mntFilterStatus);
  const w = window.open('', '_blank');
  if(!w){ alert('يرجى السماح بالنوافذ المنبثقة للطباعة'); return; }
  w.document.write(`<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8">
    <title>طلبات الصيانة - ${esc(state.buildingName)}</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>${STMT_STYLE}</style></head>
    <body>${buildMntReportHTML(list, 'طلب صيانة')}
    <script>window.onload=()=>{setTimeout(()=>window.print(),400);}<\/script>
    </body></html>`);
  w.document.close();
}
async function advanceMnt(id){
  const m = state.maintenance.find(x=>x.id===id);
  if(m.status==='طلب جديد'){ m.status='قيد التنفيذ'; }
  else if(m.status==='قيد التنفيذ'){ m.status='مكتملة'; m.execDate = new Date().toISOString().slice(0,10); }
  await saveState(); render();
}
async function deleteMnt(id){
  state.maintenance = state.maintenance.filter(m=>m.id!==id);
  await saveState(); render();
}
function openMntModal(id){
  const m = id ? state.maintenance.find(x=>x.id===id) : null;
  const unitOptions = ['<option value="—">—</option>'].concat(state.units.map(u=>`<option value="${u.number}" ${m&&m.unit===u.number?'selected':''}>${u.number}</option>`)).join('');
  showModal(`
    <h3>${m?'تعديل طلب صيانة':'طلب صيانة جديد'}</h3>
    <div class="field"><label>عنوان الطلب</label><input id="f-mtitle" value="${m?m.title:''}"></div>
    <div class="field"><label>الوصف</label><textarea id="f-mdesc">${m?m.desc:''}</textarea></div>
    <div class="two-col">
      <div class="field"><label>الموقع</label><input id="f-mloc" value="${m?m.location:''}"></div>
      <div class="field"><label>الشقة</label><select id="f-munit">${unitOptions}</select></div>
    </div>
    <div class="two-col">
      <div class="field"><label>نوع الصيانة</label>
        <select id="f-mtype">
          <option ${m&&m.type==='كهرباء وإنارة'?'selected':''}>كهرباء وإنارة</option>
          <option ${m&&m.type==='سباكة ومياه'?'selected':''}>سباكة ومياه</option>
          <option ${m&&m.type==='تكييف'?'selected':''}>تكييف</option>
          <option ${m&&m.type==='مصاعد'?'selected':''}>مصاعد</option>
          <option ${m&&m.type==='أخرى'?'selected':''}>أخرى</option>
        </select>
      </div>
      <div class="field"><label>الأولوية</label>
        <select id="f-mpriority">
          <option ${m&&m.priority==='منخفضة'?'selected':''}>منخفضة</option>
          <option ${!m||m.priority==='عادية'?'selected':''}>عادية</option>
          <option ${m&&m.priority==='عاجلة'?'selected':''}>عاجلة</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn" onclick="saveMnt('${id||''}')">حفظ</button>
    </div>
  `);
}
async function saveMnt(id){
  const data = {
    title: document.getElementById('f-mtitle').value.trim()||'طلب صيانة',
    desc: document.getElementById('f-mdesc').value.trim(),
    location: document.getElementById('f-mloc').value.trim(),
    unit: document.getElementById('f-munit').value,
    type: document.getElementById('f-mtype').value,
    priority: document.getElementById('f-mpriority').value
  };
  if(id){ Object.assign(state.maintenance.find(x=>x.id===id), data); }
  else{
    state.maintenance.push({
      id:'m'+(state.nextIds.mnt++), ...data,
      status:'طلب جديد', reportDate:new Date().toISOString().slice(0,10), execDate:''
    });
  }
  await saveState(); closeModal(); render();
}

/* ---------------- modal helpers ---------------- */
function showModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });

/* ---------------- boot ---------------- */
(async function boot(){
  await loadState(); // load building data in the background either way
  const auth = await getAuth();
  if(!auth){
    showAuthScreen('setup', null, '');
  } else if(isSessionActive()){
    await enterApp();
  } else {
    showAuthScreen('login', auth, '');
  }
})();
</script>
</body>
</html>
