<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة العمارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#173a5e;
    --navy-2:#0a1a2c;
    --teal:#c9a24a;
    --teal-dark:#1a4573;
    --teal-tint:#f6efdc;
    --bg:#faf7f0;
    --card:#ffffff;
    --border:#e8dfca;
    --text:#26282c;
    --text-dim:#7a7468;
    --amber:#c98a2c;
    --amber-tint:#f7ecd6;
    --blue-tint:#eceef3;
    --blue:#54627a;
    --green-tint:#e3f1e8;
    --green:#2f8f5b;
    --red:#c1443a;
    --red-tint:#f8e6e3;
    --radius:14px;
    --shadow:0 10px 28px rgba(60,45,10,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal', system-ui, sans-serif;
    background:linear-gradient(180deg,#f5efe0 0%,#faf7f0 35%,#fdfcf8 100%) fixed;
    color:var(--text);
    min-height:100vh;
  }
  #app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:230px;
    background:linear-gradient(180deg, #1b4268 0%, #11294a 50%, #09182a 100%);
    color:#dcf3e6;
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    padding:18px 14px;
  }
  .sidebar-header{
    display:flex;align-items:center;gap:10px;
    padding:6px 6px 18px 6px;
    border-bottom:1px solid rgba(255,255,255,.14);
    margin-bottom:14px;
  }
  .sidebar-logo{
    width:52px;height:52px;border-radius:12px;
    background:rgba(255,255,255,.04);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#fff;font-size:15px;flex-shrink:0;
    overflow:hidden;
  }
  .sidebar-logo img{width:100%;height:100%;object-fit:contain;padding:2px;}
  .sidebar-title{font-size:13px;font-weight:700;color:#fff;line-height:1.3;}
  .sidebar-sub{font-size:10.5px;color:#dcc88f;margin-top:1px;}
  .nav{display:flex;flex-direction:column;gap:3px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:9px;
    font-size:13.5px;font-weight:500;
    color:#d6e1ee;cursor:pointer;
    border:none;background:none;text-align:right;width:100%;
    font-family:inherit;
    transition:background .15s,color .15s;
  }
  .nav-item .ic{width:17px;text-align:center;font-size:14px;flex-shrink:0;}
  .nav-item:hover{background:rgba(255,255,255,.1);color:#fff;}
  .nav-item.active{background:rgba(214,176,92,.20);color:#f6e2a8;box-shadow:inset -3px 0 0 #d6b05c;}
  .nav-divider{height:1px;background:rgba(255,255,255,.16);margin:6px 4px;flex-shrink:0;}
  .sidebar-footer{border-top:1px solid rgba(255,255,255,.14);padding-top:12px;margin-top:8px;}
  .sidebar-user{
    display:flex;align-items:center;gap:9px;
    padding:8px 6px;border-radius:9px;margin-bottom:8px;
  }
  .avatar{width:30px;height:30px;border-radius:50%;background:#0a1a2c;display:flex;align-items:center;justify-content:center;font-size:12px;color:#e8cf86;border:1px solid #6d5a2a;flex-shrink:0;}
  .sidebar-user-name{font-size:12px;color:#fff;font-weight:600;}
  .sidebar-user-role{font-size:10.5px;color:#dcc88f;}

  /* Main */
  .main{flex:1;padding:26px 30px;min-width:0;overflow-x:hidden;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
  .eyebrow{font-size:12.5px;color:var(--teal-dark);font-weight:700;}
  h1{font-size:24px;font-weight:800;margin:2px 0 4px 0;letter-spacing:-.2px;}
  .page-desc{color:var(--text-dim);font-size:13px;margin:0;}
  .btn{
    background:var(--teal-dark);color:#fff;border:none;border-radius:10px;
    padding:11px 18px;font-size:13.5px;font-weight:700;cursor:pointer;
    font-family:inherit;display:inline-flex;align-items:center;gap:6px;
    transition:background .15s;
  }
  .btn:hover{background:#12385f;}
  .btn-ghost{background:#fff;color:var(--text);border:1px solid var(--border);}
  .btn-ghost:hover{background:#fbf6e8;}
  .btn-danger{background:var(--red-tint);color:var(--red);}
  .btn-danger:hover{background:#f2d3ce;}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}

  .info-banner{
    background:var(--blue-tint);border:1px solid #dadfe8;color:#3d4759;
    padding:13px 16px;border-radius:12px;font-size:13px;margin-bottom:18px;
  }

  .alerts-stack{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
  .alert-banner{
    display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-radius:12px;border:1px solid;
  }
  .alert-banner.red{background:var(--red-tint);border-color:#f0d2ce;}
  .alert-banner.amber{background:var(--amber-tint);border-color:#efdcb3;}
  .alert-icon{
    width:30px;height:30px;border-radius:9px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  .alert-banner.red .alert-icon{background:#f2d3ce;color:var(--red);}
  .alert-banner.amber .alert-icon{background:#efdcb3;color:#8f6318;}
  .alert-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
  .alert-text b{font-size:13.5px;font-weight:700;}
  .alert-text span{font-size:12px;color:var(--text-dim);}
  .alert-banner .btn-ghost{flex-shrink:0;background:#fff;}

  .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .defaulters-row{display:grid;grid-template-columns:1fr 240px;gap:14px;margin-top:16px;align-items:start;}
  .compact-chart-row{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:4px 0 2px 0;}
  .compact-pie{flex-shrink:0;display:flex;flex-direction:column;align-items:center;}
  .compact-bar{flex:1;min-width:200px;}
  .compact-bar-title{font-size:12px;color:var(--text-dim);font-weight:600;margin-bottom:6px;}
  .chart-card svg{display:block;width:100%;height:auto;margin-top:8px;}
  .chart-legend{display:flex;gap:14px;font-size:12px;color:var(--text-dim);}
  .chart-legend span{display:inline-flex;align-items:center;gap:5px;}
  .chart-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .chart-empty{font-size:12.5px;color:var(--text-dim);text-align:center;padding:40px 10px;}

  .nav-badge{
    background:var(--red);color:#fff;font-size:10px;font-weight:700;
    border-radius:20px;min-width:17px;height:17px;padding:0 5px;
    display:inline-flex;align-items:center;justify-content:center;
    margin-inline-start:auto;line-height:1;
  }

  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  .stat-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;position:relative;overflow:hidden;box-shadow:var(--shadow);
  }
  .stat-card::before{
    content:'';position:absolute;top:0;right:0;left:0;height:3px;
    background:var(--teal);
  }
  .stat-card .num{font-size:27px;font-weight:800;margin-top:6px;letter-spacing:-.3px;}
  .stat-card .lbl{font-size:12.5px;color:var(--text-dim);font-weight:600;}
  .stat-card.tint-green{background:var(--green-tint);border-color:#cdeadb;}
  .stat-card.tint-green::before{background:var(--green);}
  .stat-card.tint-blue{background:var(--blue-tint);border-color:#d7dce6;}
  .stat-card.tint-blue::before{background:var(--blue);}
  .stat-card.tint-amber{background:var(--amber-tint);border-color:#eddcb0;}
  .stat-card.tint-amber::before{background:var(--amber);}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .panel-title{font-weight:700;font-size:14.5px;margin-bottom:14px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:right;color:var(--text-dim);font-weight:600;font-size:12px;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:#faf8f4;}
  td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#faf8f4;}

  .badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge.green{background:var(--green-tint);color:var(--green);}
  .badge.amber{background:var(--amber-tint);color:#8f6318;}
  .badge.blue{background:var(--blue-tint);color:var(--blue);}
  .badge.red{background:var(--red-tint);color:var(--red);}
  .badge.gray{background:#efece5;color:#68635a;}

  .filters-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .filters-row select, .filters-row input{
    border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13px;
    font-family:inherit;background:#fff;color:var(--text);
  }
  .filters-row input[type=text]{flex:1;min-width:180px;}

  .req-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .req-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .req-tags{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .req-title{font-weight:700;font-size:15px;margin-bottom:4px;}
  .req-desc{font-size:12.5px;color:var(--text-dim);margin-bottom:12px;line-height:1.5;}
  .req-meta{background:#faf8f4;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;color:#454138;}
  .req-meta-row{display:flex;justify-content:space-between;padding:3px 0;}
  .req-meta-row b{font-weight:600;color:var(--text);}
  .req-actions{display:flex;gap:8px;margin-top:12px;}

  .icon-btn{background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:14px;padding:4px 6px;border-radius:6px;}
  .icon-btn:hover{background:#efece5;color:var(--text);}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(36,39,45,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);}
  .modal h3{margin:0 0 16px 0;font-size:17px;font-weight:800;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;
    font-size:13.5px;font-family:inherit;color:var(--text);background:#fff;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn,.modal-actions .btn-ghost{flex:1;justify-content:center;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .empty{text-align:center;color:var(--text-dim);font-size:13px;padding:30px 10px;}

  /* Login / setup screen */
  .auth-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);padding:20px;
  }
  .auth-card{
    background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:380px;
    box-shadow:0 24px 60px rgba(20,18,14,.3);
  }
  .auth-logo{
    width:110px;height:110px;border-radius:14px;margin:0 auto 12px auto;
    background:transparent;border:none;overflow:hidden;
    display:flex;align-items:center;justify-content:center;color:var(--text);font-weight:800;font-size:19px;
  }
  .auth-logo img{width:100%;height:100%;object-fit:contain;padding:5px;}
  .auth-card h2{text-align:center;font-size:19px;font-weight:800;margin:0 0 4px 0;}
  .auth-card p.sub{text-align:center;color:var(--text-dim);font-size:12.5px;margin:0 0 22px 0;}
  .auth-error{
    background:var(--red-tint);color:var(--red);font-size:12.5px;border-radius:9px;
    padding:9px 12px;margin-bottom:14px;display:none;
  }
  .auth-error.show{display:block;}
  .auth-note{
    background:var(--blue-tint);color:#3d4759;font-size:11.5px;border-radius:9px;
    padding:9px 12px;margin-top:16px;line-height:1.6;
  }
  .auth-links{text-align:center;margin-top:14px;}
  .auth-links button{
    background:none;border:none;color:var(--text-dim);font-size:12px;cursor:pointer;
    font-family:inherit;text-decoration:underline;
  }

  @media(max-width:900px){
    #app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;align-items:center;}
    .sidebar-header{border:none;margin:0;padding:0 10px 0 0;}
    .nav{flex-direction:row;}
    .nav-item{white-space:nowrap;flex-shrink:0;}
    .nav-divider{width:1px;height:24px;margin:0 6px;flex-shrink:0;}
    .sidebar-footer{display:none;}
    .stats-row{grid-template-columns:repeat(2,1fr);}
    .charts-row{grid-template-columns:1fr;}
    .defaulters-row{grid-template-columns:1fr;}
    .compact-chart-row{flex-direction:column;align-items:stretch;}
    .compact-pie{align-items:center;}
    .req-grid{grid-template-columns:1fr;}
    .main{padding:18px 14px;}
    .alert-banner{flex-wrap:wrap;}
  }

  /* ---------------- سند صرف (payment voucher) ---------------- */
  .vch-wrap{max-width:900px;margin:0 auto;}
  .vch-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;}
  .vch-toolbar .hint{color:var(--text-dim);font-size:12.5px;margin-inline-start:auto;}
  .vch-no-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:13px;color:var(--text-dim);display:flex;align-items:center;gap:8px;}
  .vch-no-box b{color:#b3261e;font-size:18px;font-variant-numeric:tabular-nums;}
  .vch-card{max-width:900px;margin:0 auto;background:#fff;color:#16181d;position:relative;padding:28px 34px 30px;
    border-radius:14px;box-shadow:0 1px 2px rgba(22,24,29,.08),0 12px 32px rgba(22,24,29,.10);overflow:hidden;
    font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;}
  .vch-card::before{content:"";position:absolute;inset:10px;border:1px solid #16181d;pointer-events:none;border-radius:6px;}
  .vch-card::after{content:"";position:absolute;inset:14px;border:1px solid #a8833a;opacity:.55;pointer-events:none;border-radius:4px;}
  .vch-card header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;position:relative;
    background:linear-gradient(180deg,#faf5e7 0%,#ffffff 100%);border-radius:12px;padding:18px 22px;margin:-4px -4px 22px;
    box-shadow:inset 0 -2px 0 #a8833a;}
  .vch-brand{display:flex;align-items:center;gap:14px;}
  .vch-logo-frame{width:58px;height:58px;border-radius:16px;background:#fff;border:1px solid #e6d7ac;
    box-shadow:0 3px 10px rgba(168,131,58,.22);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .vch-logo-frame img{width:42px;height:42px;object-fit:contain;}
  .vch-brand h1{font:700 21px/1.2 "El Messiri","IBM Plex Sans Arabic",sans-serif;margin:0;color:#16181d;}
  .vch-brand small{display:block;color:#8a8f99;font-size:11.5px;direction:rtl;text-align:right;margin-top:3px;line-height:1.6;}
  .vch-title{text-align:center;}
  .vch-title h2{font:700 29px/1 "El Messiri","IBM Plex Sans Arabic",sans-serif;margin:0;padding:9px 30px 11px;position:relative;color:#16181d;}
  .vch-title h2::before,.vch-title h2::after{content:"";position:absolute;right:0;left:0;height:2px;
    background:linear-gradient(90deg,transparent,#a8833a 18%,#a8833a 82%,transparent);}
  .vch-title h2::before{top:0;}
  .vch-title h2::after{bottom:0;}
  .vch-title span{display:block;font:600 11px "IBM Plex Sans Arabic",sans-serif;letter-spacing:.35em;color:#a8833a;margin-top:8px;direction:ltr;}
  .vch-meta{display:grid;gap:7px;justify-self:end;min-width:0;}
  .vch-meta label{display:flex;align-items:center;gap:8px;font-size:13px;color:#6b6f7a;justify-content:flex-end;}
  .vch-meta input{width:130px;text-align:center;}
  .vch-no{font:700 19px inherit;color:#b3261e;font-variant-numeric:tabular-nums;background:#fdeceb;padding:2px 10px;border-radius:6px;}
  /* The voucher number is directly editable in the header (input#vch-no-input) so the person has full control over it, not just the "next number" counter. */
  input.vch-no{border:1px solid #f3cdc9;width:70px;text-align:center;}
  input.vch-no:focus-visible{outline:2px solid #a8833a;outline-offset:1px;}
  .vch-card input,.vch-card select,.vch-card textarea{font:500 15px "IBM Plex Sans Arabic",sans-serif;color:#16181d;background:transparent;border:0;border-bottom:1px dotted #6b6f7a;padding:4px 2px;border-radius:0;width:100%;}
  .vch-card input:focus-visible,.vch-card select:focus-visible{outline:2px solid #a8833a;outline-offset:2px;}
  .vch-amount-row{display:flex;gap:14px;align-items:stretch;margin-top:20px;flex-wrap:wrap;}
  .vch-amount{display:flex;border:1.5px solid #16181d;border-radius:6px;overflow:hidden;}
  .vch-amount div{display:grid;text-align:center;}
  .vch-amount b{font:600 11px "IBM Plex Sans Arabic",sans-serif;background:#16181d;color:#fff;padding:4px 10px;}
  .vch-amount input{border:0;width:120px;text-align:center;font:700 18px "IBM Plex Sans Arabic",sans-serif;padding:6px;background:#f6f0e3;}
  .vch-amount .vch-sub input{width:70px;}
  .vch-amount .vch-sub{border-inline-start:1.5px solid #16181d;}
  .vch-curr{display:flex;align-items:center;gap:8px;font-size:13px;color:#6b6f7a;}
  .vch-fields{display:grid;gap:14px;margin-top:20px;}
  .vch-f{display:flex;align-items:flex-end;gap:10px;min-width:0;}
  .vch-f>span{white-space:nowrap;font-weight:600;font-size:14px;}
  .vch-f>span em{font-style:normal;color:#6b6f7a;font-weight:400;font-size:12px;margin-inline-start:4px;}
  .vch-grow{flex:1;min-width:0;}
  .vch-words{flex:1;min-width:0;padding:5px 10px;background:#f6f0e3;border-bottom:1px solid #a8833a;font-weight:600;min-height:32px;line-height:1.6;}
  .vch-two{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;}
  .vch-pay{display:flex;flex-wrap:wrap;gap:16px;align-items:center;}
  .vch-pay label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;}
  .vch-sign{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px;}
  .vch-sign div{text-align:center;}
  .vch-sign b{display:block;font:700 13px "El Messiri","IBM Plex Sans Arabic",sans-serif;margin-bottom:28px;}
  .vch-sign input{text-align:center;border-bottom:1px solid #16181d;font-size:13px;}
  .vch-sign small{display:block;color:#6b6f7a;font-size:11px;margin-top:4px;}
  .vch-stamp{border:1.5px dashed #c9ccd4;border-radius:50%;width:72px;height:72px;margin:-22px auto 0;display:grid;place-items:center;color:#6b6f7a;font-size:10px;}
  .vch-footer{margin-top:20px;padding-top:10px;border-top:1px solid #c9ccd4;display:flex;justify-content:space-between;color:#6b6f7a;font-size:11px;gap:8px;flex-wrap:wrap;}
  @media(max-width:700px){
    .vch-card{padding:22px 18px;}
    .vch-card header{grid-template-columns:1fr;}
    .vch-brand,.vch-meta{justify-self:center;}
    .vch-meta label{justify-content:center;}
    .vch-two,.vch-sign{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<div id="authScreen" class="auth-wrap"></div>

<div id="app" style="display:none;">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo" id="bldgInitial"><img src="" id="bldgLogoImg" alt="شعار"></div>
      <div>
        <div class="sidebar-title" id="bldgName">عمارتي</div>
        <div class="sidebar-sub">لوحة رئيس اتحاد الملاك</div>
      </div>
    </div>
    <div class="nav" id="navList"></div>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar">👤</div>

// over — the real content, which is written after it in the DOM).

  .print-watermark{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(0deg);

  @media print{ .print-watermark{ position:fixed; -webkit-print-color-adjust:exact; print-color-adjust:exact; } }
`;
function printWatermarkHTML(){
  return `<img src="${LOGO_URI}" class="print-watermark" alt="">`;

/* ---------------- إقفال الأشهر ----------------
   شهر مُقفل = لا إضافة ولا تعديل ولا حذف لحركاته وسنداته ودفعاته إلا بعد فتح الإقفال
   صراحةً من الإعدادات (ويُسجَّل الفتح والإقفال في سجل الإقفال). الطباعة وإعادة الطباعة تبقى متاحة. */
function isMonthLocked(dateOrMonth){
  const m = String(dateOrMonth||'').slice(0,7);
  return !!(m && state.lockedMonths && state.lockedMonths[m]);
}
function assertMonthOpen(dateOrMonth, action){
  if(!isMonthLocked(dateOrMonth)) return true;
  const m = String(dateOrMonth).slice(0,7);
  alert('🔒 شهر '+monthLabel(m)+' مُقفل، فلا يمكن '+(action||'التعديل')+'.\nإن كان التعديل ضروريًا: الإعدادات ← إقفال الأشهر ← فتح الإقفال (ويُسجَّل ذلك).');
  return false;
}
function lockedMonthBanner(m){
  if(!isMonthLocked(m)) return '';
  const rec = state.lockedMonths[m]||{};
  const when = rec.at ? new Date(rec.at).toLocaleDateString('ar-SA') : '';
  return '<div class="alert-banner amber" style="margin-bottom:14px;"><div class="alert-icon">🔒</div><div class="alert-text"><b>شهر '+monthLabel(m)+' مُقفل'+(when?' منذ '+when:'')+'</b><span>لا يمكن تعديل حركاته أو سنداته أو دفعاته. الطباعة متاحة، وفتح الإقفال من الإعدادات.</span></div></div>';
}
async function lockMonth(m){
  if(!state.lockedMonths) state.lockedMonths = {};
  if(!state.lockLog) state.lockLog = [];
  if(!confirm('إقفال شهر '+monthLabel(m)+'؟\nبعد الإقفال لا يمكن تعديل أي حركة أو سند أو دفعة فيه إلا بفتح الإقفال.')) return;
  state.lockedMonths[m] = {at:new Date().toISOString()};
  state.lockLog.push({month:m, action:'إقفال', at:new Date().toISOString()});
  await saveState(); render();
}
async function unlockMonth(m){
  if(!state.lockedMonths) state.lockedMonths = {};
  if(!state.lockLog) state.lockLog = [];
  const reason = prompt('فتح إقفال شهر '+monthLabel(m)+'.\nاكتب سبب الفتح (يُسجَّل في السجل):');
  if(reason===null) return;
  if(!reason.trim()){ alert('السبب مطلوب حتى يبقى السجل واضحًا.'); return; }
  delete state.lockedMonths[m];
  state.lockLog.push({month:m, action:'فتح', reason:reason.trim(), at:new Date().toISOString()});
  await saveState(); render();
}
function lockMonthsList(){
  const set = new Set();
  (state.transactions||[]).forEach(t=>{ if(t.date) set.add(String(t.date).slice(0,7)); });
  (state.vouchers||[]).forEach(v=>{ if(v.date) set.add(vchAccMonth(v)); });
  Object.keys(state.lockedMonths||{}).forEach(m=>set.add(m));
  set.add(currentMonthKey());
  return [...set].filter(m=>/^\d{4}-\d{2}$/.test(m)).sort().reverse();
}

let lastCloudSyncOk = true;
async function cloudGet(key){
  const client = getSupabaseClient();
  if(!client){ lastCloudSyncOk = false; return { ok:false, raw:null }; }
  try{
    const { data, error } = await client.from('app_state').select('data').eq('id', key).maybeSingle();

    if(data && data.data) return { ok:true, raw: JSON.stringify(data.data) };
    return { ok:true, raw:null }; // successful query, row genuinely doesn't exist
  }catch(e){ console.error('Supabase get exception', e); lastCloudSyncOk = false; return { ok:false, raw:null }; }

async function cloudSet(key, value){
  const client = getSupabaseClient();
  if(!client){ lastCloudSyncOk = false; return false; }
  try{
    const payload = JSON.parse(value);
    const { error } = await client.from('app_state').upsert({ id: key, data: payload, updated_at: new Date().toISOString() });
    if(error){ console.error('Supabase set error', error); lastCloudSyncOk = false; return false; }
    lastCloudSyncOk = true;
    return true;
  }catch(e){ console.error('Supabase set exception', e); lastCloudSyncOk = false; return false; }
}

// Generic persistence: prefer Claude's storage (works inside claude.ai),
// fall back to the browser's own localStorage (works when the file is opened

function isCloudBackedKey(key){

}

  return null;
}

async function loadState(){
  // 1) Try the cloud first - this is the shared source of truth.
  const cloudRes = await cloudGet(STORE_KEY);
  if(cloudRes.raw){
    try{
      state = JSON.parse(cloudRes.raw);
      migrateState();
      loadedRev = state.rev || 1;
      // mirror to local caches for offline fallback, but do NOT write back to cloud
      if(hasClaudeStorage()){ try{ await window.storage.set(STORE_KEY, cloudRes.raw, false); }catch(e){} }
      if(hasLocalStorage){ try{ localStorage.setItem(STORE_KEY, cloudRes.raw); }catch(e){} }
      return;
    }catch(e){}
  }
  // 2) Cloud had nothing (or failed) - fall back to whatever is on THIS device.
  let localRaw = null;
  if(hasLocalStorage){ try{ localRaw = localStorage.getItem(STORE_KEY); }catch(e){} }
  if(!localRaw && hasClaudeStorage()){
    try{ const r = await window.storage.get(STORE_KEY, false); localRaw = r && r.value ? r.value : null; }catch(e){}
  }
  if(localRaw){
    try{
      state = JSON.parse(localRaw);
      migrateState();
      loadedRev = state.rev || 1;
      // Only push this device's local copy up to the cloud in the ONE safe case:
      // the cloud query genuinely succeeded and confirmed there is no row yet
      // (cloudRes.ok === true, cloudRes.raw === null). If the cloud call instead
      // *failed* (network hiccup, RLS error, etc. -> cloudRes.ok === false), we must
      // NEVER write here, because a transient failure is not proof the cloud is
      // empty - writing in that case is exactly what silently destroyed real data
      // before. In a failure case we just work from local data without touching the cloud.
      if(cloudRes.ok === true && cloudRes.raw === null){
        try{ await cloudSet(STORE_KEY, JSON.stringify(state)); }catch(e){}
      }
      return;
    }catch(e){}
  }
  // 3) Truly nothing anywhere - initialize fresh defaults.
  // Only safe to do this (and save it) if the cloud call actually succeeded and
  // confirmed emptiness; if the cloud call failed, do NOT save a fresh default -
  // just show it in-memory so nothing is overwritten once connectivity returns.
  state = defaultState();
  loadedRev = state.rev || 1;
  if(cloudRes.ok === true && cloudRes.raw === null){
    await saveState();
  }
}
function migrateState(){
  if(!state.rev) state.rev = 1;
  if(!state.driverRooms){
    state.driverRooms = [1,2,3,4,5].map(n=>({id:'dr'+n, number:n, tenant:'', monthlyRent:0, collected:0, startMonth:''}));
  } else {
    state.driverRooms.forEach(r=>{ if(r.startMonth===undefined) r.startMonth=''; });
  }
  if(state.billingStartMonth===undefined) state.billingStartMonth = '';
  if(state.billingModeIgnoreStart===undefined) state.billingModeIgnoreStart = false;
  if(state.openingBalance===undefined) state.openingBalance = 0;
  /* أمانة في حساب البنك: مبلغ موجود فعليًا في البنك لكنه ليس من أموال الجمعية (مثل رصيد الحساب عند الاستلام). لا يدخل الإيرادات ولا الرصيد، ويُضاف فقط عند مطابقة رصيد البنك */
  if(state.trustFunds===undefined){
    state.trustFunds = (!Number(state.openingBalance)) ? {amount:2818.36, note:'رصيد حساب العمارة عند الاستلام (سبتمبر 2026) — أمانة، لا تدخل في حسابات الجمعية'} : {amount:0, note:''};
  }
  if(!state.nextVoucherNo) state.nextVoucherNo = 1;
  if(!state.voucherDefaults) state.voucherDefaults = {accountant:'', manager:''};
  if(!state.vouchers) state.vouchers = [];
  // Defensive: give any legacy voucher record (saved before per-record ids
  // existed) a unique id so it can be reprinted/edited/deleted individually,
  // even if it shares the same السند number with another record.
  state.vouchers.forEach((v,i)=>{ if(!v.id) v.id = 'vh'+v.no+'_legacy'+i; });
  if(!state.roomPayments) state.roomPayments = {};
  /* One-time migration: driver rooms used to track payment with a single
     ever-increasing "collected" counter (topped up by an "add payment"
     button) instead of a per-month paid/unpaid record like apartment
     subscriptions. To switch rooms onto that same month-grid system without
     losing what was already recorded, seed roomPayments by marking the
     earliest N months (starting from the room's rental start month) as
     paid, consuming the old collected total one month's rent at a time. */
  if(!state.roomPaymentsSeeded){
    (state.driverRooms||[]).forEach(r=>{
      if(r.startMonth && Number(r.monthlyRent)>0 && Number(r.collected)>0){
        let remaining = Number(r.collected);
        const end = lastCompletedMonthKey();
        const months = monthsBetweenInclusive(r.startMonth, end);
        months.forEach(mk=>{
          const key = r.id+'|'+mk;
          if(remaining >= Number(r.monthlyRent) && !state.roomPayments[key]){
            state.roomPayments[key] = {paid:true, amount:Number(r.monthlyRent)};
            remaining -= Number(r.monthlyRent);
          }
        });
      }
    });
    state.roomPaymentsSeeded = true;
  }
  (state.units||[]).forEach(u=>{ if(!Array.isArray(u.notes)) u.notes = []; });
}
async function saveState(){
  // Conflict guard: before writing, check whether another tab/device has
  // already saved since THIS tab last loaded its copy of the data. If so,
  // this tab's in-memory state is stale - writing it now would silently
  // overwrite (erase) whatever that newer save added, which is exactly what
  // caused real data to disappear before this check existed. Only enforced
  // when the cloud read genuinely succeeds; a failed/offline read proves
  // nothing, so in that case we just fall back to saving normally.
  const client = getSupabaseClient();
  if(client){
    const check = await cloudGet(STORE_KEY);
    if(check.ok === true && check.raw){
      let conflict = false;
      try{ conflict = (JSON.parse(check.raw).rev || 1) !== loadedRev; }catch(e){ conflict = false; }
      if(conflict){
        lastSaveBlocked = true;
        alert('⚠ تنبيه: تم حفظ تعديلات على البيانات من جهاز أو نافذة أخرى بعد ما فتحت هذه الصفحة.\n\nلتفادي فقدان أي بيانات، التعديل الحالي لم يُحفظ. بنحدّث الصفحة الآن لأحدث نسخة — الرجاء إعادة آخر تعديل سويته.');
        await loadState();
        render();
        return;
      }
    }
  }
  lastSaveBlocked = false;
  state.rev = (state.rev || loadedRev || 1) + 1;
  state.updatedAt = new Date().toISOString();
  await storageSet(STORE_KEY, JSON.stringify(state));
  loadedRev = state.rev;
}

/* ---------------- chart helpers ---------------- */
const CHART_MONTHS_SHORT = {'01':'ينا','02':'فبر','03':'مار','04':'أبر','05':'ماي','06':'يون','07':'يول','08':'أغس','09':'سبت','10':'أكت','11':'نوف','12':'ديس'};
function chartMonthLabel(key){
  const m = key.split('-')[1];
  return CHART_MONTHS_SHORT[m]||m;
}
function lastNMonthKeys(n){
  const out=[];
  const now = new Date();
  for(let i=n-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  return out;
}

/* Closing balance at the END of month k: opening + everything received up to k
   (dues keyed <=k, income tx dated <=k) - expenses dated <=k. */
function closingBalanceAt(k){
  const start = incomeStartKey();
  const ids = new Set(state.units.map(u=>u.id));
  let dues = 0;
  Object.keys(state.payments||{}).forEach(key=>{
    const r = state.payments[key]; if(!r || !r.paid) return;
    const [uid,mk] = key.split('|');
    const em = (r.depositDate && /^\d{4}-\d{2}/.test(r.depositDate)) ? r.depositDate.slice(0,7) : mk; // شهر الإيداع الفعلي إن وُجد، وإلا شهر الاستحقاق
    if(ids.has(uid) && mk>=start && em<=k) dues += Number(r.amount)||0;
  });
  let inc=0, exp=0;
  state.transactions.forEach(t=>{
    const m=((t.type==='income' && t.depositDate) ? t.depositDate : (t.type==='expense' && t.payDate ? t.payDate : (t.date||''))).slice(0,7); if(!m || m>k) return;
    if(t.type==='income') inc+=Number(t.amount)||0; else if(t.type==='expense') exp+=Number(t.amount)||0;
  });
  return Number(state.openingBalance||0) + dues + inc - exp;
}

/* Where the money physically sits. Unit dues (state.payments) have no
   transaction, so they count as عهدة المدير; transactions carry tx.place
   (missing = عهدة المدير). Total always equals the dashboard account balance. */


const PLACE_LABEL = {bank:'حساب العمارة (البنك)', custody:'عهدة المدير', cash:'نقد (صندوق)'};

    <p style="font-size:12px;color:var(--text-dim);margin-top:-4px;">مثل: تحويل من حساب العمارة إلى حسابك لتصرف منه نقدًا. لا يُحسب إيرادًا ولا مصروفًا، فقط ينقل المبلغ من مكان لآخر. <b>لا تسجّل المبلغ مرة ثانية كمصروف</b> إن كانت مصروفاتك التي صرفتها منه مسجَّلة أصلًا.</p>
    <div class="two-col">
      <div class="field"><label>من</label><select id="f-trfrom">${opts('bank')}</select></div>
      <div class="field"><label>إلى</label><select id="f-trto">${opts('custody')}</select></div>
    </div>

      <div class="field"><label>المبلغ (ر.س)</label><input id="f-tramount" type="number" step="0.01"></div>

    <div class="modal-actions"><button class="btn-ghost" onclick="closeModal()">إلغاء</button><button class="btn" onclick="saveTransfer()">حفظ</button></div>`);
}
async function saveTransfer(){
  const from = document.getElementById('f-trfrom').value, to = document.getElementById('f-trto').value;
  const amount = Number(document.getElementById('f-tramount').value)||0;
  const date = document.getElementById('f-trdate').value;

  if(!state.transfers) state.transfers = [];
  state.transfers.push({id:'tr'+Date.now(), from, to, amount, date, note});
  await saveState(); closeModal(); render();
}
async function deleteTransfer(id){
  if(!confirm('حذف هذا التحويل؟')) return;
  state.transfers = (state.transfers||[]).filter(t=>t.id!==id);
  await saveState(); render();
}

/* مستحقات المدير غير المصروفة: بند إفصاحي فقط، لا يدخل في الرصيد ولا في المصروفات */
function getManagerSalary(){
  return state.managerSalary || {amount:1500, startMonth:'2026-09', status:'deferred'};
}
function managerSalaryText(){
  const m = getManagerSalary(); const amt = Number(m.amount)||0;
  if(!(amt>0) || !m.startMonth) return '';
  if(m.status==='waived') return `تنازل المدير عن راتبه الشهري (${fmt(amt)} ر.س) اعتبارًا من ${monthLabel(m.startMonth)} — لم يُصرف ولا يُسجَّل التزامًا.`;
  const months = monthsBetweenInclusive(m.startMonth, lastCompletedMonthKey()).length;
  return `مستحقات المدير غير المصروفة: ${fmt(amt)} ر.س شهريًا منذ ${monthLabel(m.startMonth)} — المتراكم حتى نهاية ${monthLabel(lastCompletedMonthKey())}: ${fmt(months*amt)} ر.س (مؤجلة، التزام على الجمعية غير مصروف ولا يدخل في المصروفات أو الرصيد).`;
}
function trustAmount(){ return Number(state.trustFunds && state.trustFunds.amount)||0; }
function setBankActual(){
  const cur = state.bankActual && state.bankActual.amount!==undefined ? state.bankActual.amount : '';
  const v = prompt('اكتب رصيد حساب العمارة كما يظهر في تطبيق بنك الرياض نفسه (وليس رقم هذا التطبيق):', cur);
  if(v===null) return;
  const n = Number(String(v).replace(/[^\d.\-]/g,''));
  if(isNaN(n) || String(v).trim()===''){ alert('رقم غير صالح'); return; }
  state.bankActual = {amount:n, date:todayISODate()};
  saveState(); render();
}
function isBankFeeTx(t){ return t && t.type==='expense' && /رسوم\s*(تحويل|بنك|مصرف)/.test((t.category||'')+' '+(t.note||'')); } // رسوم يخصمها البنك تلقائيًا: مستندها كشف الحساب لا سند صرف
function placeBalances(){
  const from = state.bankActiveFrom || '';
  let bank = Number(state.openingBalance||0), cash = 0, custody = 0;
  // دفعات الشقق: من شهر تفعيل حساب العمارة فصاعدًا تُحوَّل مباشرة للحساب، وقبله عهدة المدير
  const start = incomeStartKey();
  const ids = new Set(state.units.map(u=>u.id));
  Object.keys(state.payments||{}).forEach(k=>{
    const r = state.payments[k]; if(!r || !r.paid) return;
    const [uid,mk] = k.split('|');
    if(!ids.has(uid) || mk < start) return;
    const amt = Number(r.amount)||0;
    // مكان محدد يدويًا لهذه الدفعة (مثل متأخرات سُدّدت لاحقًا لحساب العمارة) له الأولوية
    if(r.place==='bank') bank += amt;
    else if(r.place==='cash') cash += amt;
    else if(r.place==='custody') custody += amt;
    else { /* المكان بحسب شهر الإيداع الفعلي إن وُجد (دفعة رُحّلت من شهر لآخر تبقى حيث استُلمت)، وإلا شهر الاستحقاق */
      const em = (r.depositDate && /^\d{4}-\d{2}/.test(r.depositDate)) ? r.depositDate.slice(0,7) : mk;
      if(from && em >= from) bank += amt; else custody += amt;
    }
  });
  (state.transactions||[]).forEach(t=>{
    const v = (t.type==='income'?1:-1) * (Number(t.amount)||0);
    let pl = t.place;
    // تلقائي: الإيراد (مثل إيجار الغرف) من شهر التفعيل يدخل البنك، والمصروف عهدة ما لم يُحدَّد غير ذلك
    if(!pl) pl = (t.type==='income' && from && (t.date||'').slice(0,7) >= from) ? 'bank' : 'custody';
    if(pl==='bank') bank += v; else if(pl==='cash') cash += v; else custody += v;
  });
  // تحويلات بين الأماكن (مثل سداد عهدة المدير من حساب العمارة): لا هي إيراد ولا مصروف
  (state.transfers||[]).forEach(tr=>{
    const a = Number(tr.amount)||0;
    const mv = (pl,v)=>{ if(pl==='bank') bank+=v; else if(pl==='cash') cash+=v; else if(pl==='custody') custody+=v; };
    mv(tr.from,-a); mv(tr.to,a);
  });
  return {bank, cash, custody, total: bank+cash+custody};
}
function getMonthlySummary(n){
  // Per-month breakdown for the dashboard table: how much was collected from
  // apartment subscriptions that month (state.payments — these never become
  // a transaction), plus any other income/expense transactions dated that
  // month (transactions already include driver-room rent when recorded),
  // and the net/remaining for that month alone.
  return lastNMonthKeys(n).map(k=>{
    const duesCollected = paidDuesTotal(k);
    const otherIncome = state.transactions.filter(t=>t.type==='income' && (t.date||'').slice(0,7)===k).reduce((s,t)=>s+Number(t.amount),0);
    const expense = state.transactions.filter(t=>t.type==='expense' && (t.date||'').slice(0,7)===k).reduce((s,t)=>s+Number(t.amount),0);
    const totalIncome = duesCollected + otherIncome;
    // عند تفعيل الترحيل: إيراد الشهر السابق يغطي مصروفات هذا الشهر (نفس منطق صفحة الإيرادات)
    let fundingIncome = totalIncome;
    if(financeCarry){
      const pk = monthBefore(k);
      fundingIncome = paidDuesTotal(pk) + state.transactions.filter(t=>t.type==='income' && (t.date||'').slice(0,7)===pk).reduce((s,t)=>s+Number(t.amount),0);
    }
    return {month:k, duesCollected, otherIncome, totalIncome, expense, fundingIncome, net: fundingIncome - expense, closing: closingBalanceAt(k)};
  });
}
function getMonthlyFinance(n){
  return lastNMonthKeys(n).map(k=>{
    const income = state.transactions.filter(t=>t.type==='income' && (t.date||'').slice(0,7)===k).reduce((s,t)=>s+Number(t.amount),0);
    const expense = state.transactions.filter(t=>t.type==='expense' && (t.date||'').slice(0,7)===k).reduce((s,t)=>s+Number(t.amount),0);
    return {month:k, income, expense};
  });
}
function getMonthlyCollectionRate(n){
  return lastNMonthKeys(n).map(k=>{
    let due=0, paid=0;
    state.units.forEach(u=>{
      const rec = state.payments[u.id+'|'+k];
      const amount = rec ? Number(rec.amount) : Number(u.monthlyFee||200);
      due += amount;
      if(rec && rec.paid) paid += amount;
    });
    const rate = due>0 ? Math.round((paid/due)*100) : 0;
    return {month:k, due, paid, rate};
  });
}
function buildFinanceChartSVG(data){
  const hasAny = data.some(d=>d.income>0 || d.expense>0);
  if(!hasAny) return '<div class="chart-empty">لا توجد حركات مالية خلال الفترة لعرض الرسم البياني</div>';
  const w=520, h=210, padL=42, padR=8, padT=14, padB=28;
  const chartW = w-padL-padR, chartH = h-padT-padB;
  const maxVal = Math.max(1, ...data.map(d=>Math.max(d.income,d.expense)));
  const groupW = chartW/data.length;
  const barW = Math.min(20, groupW*0.28);
  let bars='', grid='';
  for(let i=0;i<=3;i++){
    const y = padT + chartH - (chartH*i/3);
    const val = Math.round(maxVal*i/3);
    grid += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#e6e9ee" stroke-width="1"></line>`;
    grid += `<text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9.5" fill="#6b7684">${fmt(val)}</text>`;
  }
  data.forEach((d,i)=>{
    const cx = padL + i*groupW + groupW/2;
    const hIncome = (d.income/maxVal)*chartH;
    const hExpense = (d.expense/maxVal)*chartH;
    bars += `<rect x="${cx-barW-2}" y="${padT+chartH-hIncome}" width="${barW}" height="${Math.max(hIncome,0)}" rx="2.5" fill="#1f9d55"></rect>`;
    bars += `<rect x="${cx+2}" y="${padT+chartH-hExpense}" width="${barW}" height="${Math.max(hExpense,0)}" rx="2.5" fill="#e0524a"></rect>`;
    bars += `<text x="${cx}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="#6b7684">${chartMonthLabel(d.month)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${grid}${bars}</svg>`;
}
function buildCollectionChartSVG(data){
  const hasAny = data.some(d=>d.due>0);
  if(!hasAny) return '<div class="chart-empty">لا توجد بيانات دفعات كافية لعرض الرسم البياني</div>';

  const barW = Math.min(30, groupW*0.5);

  [0,25,50,75,100].forEach(v=>{

    grid += `<text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9.5" fill="#6b7684">${v}%</text>`;
  });
  data.forEach((d,i)=>{
    const cx = padL + i*groupW + groupW/2;

    bars += `<rect x="${cx-barW/2}" y="${padT+chartH-hBar}" width="${barW}" height="${Math.max(hBar,1)}" rx="3" fill="${color}"></rect>`;
    bars += `<text x="${cx}" y="${padT+chartH-hBar-6}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#16202c">${d.rate}%</text>`;
    bars += `<text x="${cx}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="#6b7684">${chartMonthLabel(d.month)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${grid}${bars}</svg>`;
}

function polarToCartesian(cx,cy,r,angleDeg){
  const rad = angleDeg * Math.PI/180;
  return { x: cx + r*Math.sin(rad), y: cy - r*Math.cos(rad) };
}
function describeArc(cx,cy,r,startAngle,endAngle){
  const start = polarToCartesian(cx,cy,r,startAngle);
  const end = polarToCartesian(cx,cy,r,endAngle);
  const largeArcFlag = (endAngle-startAngle) <= 180 ? 0 : 1;
  return `M ${cx} ${cy} L ${start.x.toFixed(2)} ${start.y.toFixed(2)} A ${r} ${r} 0 ${largeArcFlag} 1 ${end.x.toFixed(2)} ${end.y.toFixed(2)} Z`;
}
function buildStatusPieSVG(settledCount, owingCount, size){
  size = size || 180;
  const total = settledCount+owingCount;
  if(total===0) return '<div class="chart-empty">لا توجد شقق بعد</div>';
  const cx=size/2, cy=size/2, r=size*0.4, holeR=size*0.22;
  const owingAngle = (owingCount/total)*360;
  let paths='';
  if(owingCount>0) paths += `<path d="${describeArc(cx,cy,r,0,owingAngle)}" fill="#c1443a"></path>`;
  if(settledCount>0) paths += `<path d="${describeArc(cx,cy,r,owingAngle,360)}" fill="#2f8f5b"></path>`;
  const owingPct = Math.round((owingCount/total)*100);
  const numFontSize = Math.round(size*0.122);
  const lblFontSize = Math.round(size*0.058);
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">
    ${paths}
    <circle cx="${cx}" cy="${cy}" r="${holeR}" fill="#ffffff"></circle>
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="${numFontSize}" font-weight="800" fill="#26282c">${owingPct}%</text>
    <text x="${cx}" y="${cy+size*0.083}" text-anchor="middle" font-size="${lblFontSize}" fill="#7a746b">متأخرون</text>
  </svg>`;
}

function arrearsSeverityColor(amount){
  if(amount >= 1000) return '#c0392b';
  if(amount >= 400) return '#e0524a';
  return '#f0a75c';
}
function buildArrearsBarChartSVG(defaulters, opts){
  if(defaulters.length===0) return '<div class="chart-empty">لا يوجد أعضاء متأخرون لعرضهم بالرسم البياني 🎉</div>';
  const compact = opts && opts.compact;
  const n = defaulters.length;
  const colW = compact ? 26 : 42, gap = compact ? 10 : 16;
  const padL = compact ? 34 : 44, padR = compact ? 8 : 14, padT = compact ? 18 : 24, padB = compact ? 26 : 34;
  const chartH = compact ? 110 : 190;
  const chartW = n*colW + (n-1)*gap;
  const w = padL + padR + chartW;
  const h = padT + chartH + padB;
  const maxVal = Math.max(1, ...defaulters.map(u=>Math.abs(u.totalDue)));
  const niceMax = Math.ceil(maxVal/500)*500 || maxVal;
  const gridFont = compact ? 7.5 : 9;
  const valFont = compact ? 8.5 : 10.5;
  const lblFont = compact ? 9 : 11;

  let gridLines = '', gridLabels = '', bars = '';
  [0,0.5,1].forEach(f=>{
    const y = padT + chartH - chartH*f;
    gridLines += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="#eef0f3" stroke-width="1"></line>`;
    gridLabels += `<text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="${gridFont}" fill="#9aa4b2">${fmt(Math.round(niceMax*f))}</text>`;
  });
  defaulters.forEach((u,i)=>{
    const x = padL + i*(colW+gap);
    const val = Math.abs(u.totalDue);
    const barH = (val/niceMax)*chartH;
    const color = arrearsSeverityColor(val);
    /* Digits only for the axis label — mixing Arabic words with numbers inside
       SVG text breaks under RTL bidi reordering (garbles into unreadable text
       when printed), so the chart shows just the unit number; the full label
       (شقة + الاسم) stays in the table right below it. */
    const unitNum = (String(u.number).match(/\d+/)||[u.number])[0];
    bars += `<rect x="${x.toFixed(1)}" y="${(padT+chartH-barH).toFixed(1)}" width="${colW}" height="${Math.max(barH,2).toFixed(1)}" rx="${compact?3:4}" fill="${color}"></rect>`;
    if(!compact) bars += `<text x="${(x+colW/2).toFixed(1)}" y="${(padT+chartH-barH-6).toFixed(1)}" text-anchor="middle" font-size="${valFont}" font-weight="700" fill="${color}">${fmt(val)}</text>`;
    bars += `<text x="${(x+colW/2).toFixed(1)}" y="${(padT+chartH+(compact?15:18)).toFixed(1)}" text-anchor="middle" font-size="${lblFont}" font-weight="700" fill="#26282c">${esc(unitNum)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${Math.min(h,compact?140:260)}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">${gridLines}${gridLabels}${bars}</svg>`;
}

  return `<div class="chart-legend" style="margin-top:4px;">
    <span><i style="background:#f0a75c"></i>أقل من 400 ر.س</span>
    <span><i style="background:#e0524a"></i>400 – 999 ر.س</span>
    <span><i style="background:#c0392b"></i>1000 ر.س فأكثر</span>

/* طباعة لوحة التحكم بنفس شكلها: تُنسخ الصفحة الحالية (البطاقات والرسوم) إلى نافذة طباعة نظيفة بدون الأزرار */
function printDashboard(){
  const main = document.getElementById('main');
  if(!main){ return; }
  const clone = main.cloneNode(true);
  clone.querySelectorAll('button, input, select, textarea, .icon-btn').forEach(e=>e.remove());

/* ===== مركز المتابعة في لوحة التحكم: مهام الشهر + من لم يدفع + الغرف + المصروفات حسب الفئة ===== */
let dashFocusMonth = '';
function dashShiftMonth(mk,n){ let [y,m]=mk.split('-').map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+'-'+String(m).padStart(2,'0'); }
function dashDefaultMonth(){ const cur=currentMonthKey(); return (new Date().getDate()>=25) ? dashShiftMonth(cur,1) : cur; }
function dashWaLink(phone,msg){
  let p=String(phone||'').replace(/\D/g,'');
  if(p.startsWith('00')) p=p.slice(2); else if(p.startsWith('0')) p='966'+p.slice(1); else if(p.length===9 && p.startsWith('5')) p='966'+p;
  return 'https://wa.me/'+p+'?text='+encodeURIComponent(msg);
}
function dashSetFocus(v){ dashFocusMonth=v; render(); }
function renderDashFocus(main){
  const mk = dashFocusMonth || dashDefaultMonth();
  const cur = currentMonthKey();
  const opts = [dashShiftMonth(cur,-1), cur, dashShiftMonth(cur,1)];
  if(!opts.includes(mk)) opts.push(mk);
  const units = state.units||[];
  const unpaid = units.filter(u=>{ const r=state.payments[u.id+'|'+mk]; return !(r && r.paid); });
  const paidN = units.length - unpaid.length;
  const rooms = (state.driverRooms||[]).filter(r=>r.tenant && Number(r.monthlyRent)>0 && (!r.startMonth || r.startMonth<=mk));
  const roomUnpaid = rooms.filter(r=>{ const p=state.roomPayments[r.id+'|'+mk]; return !(p && p.paid); });
  const noAtt = (state.transactions||[]).filter(t=>t.type==='expense' && !t.hasAttachment && !isBankFeeTx(t));
  const vch = state.vouchers||[];
  const noVch = (state.transactions||[]).filter(t=>t.type==='expense' && !isBankFeeTx(t) && !vch.some(v=>v.txId===t.id) && !/سند صرف رقم/.test(t.note||''));
  const pb = placeBalances();
  const ba = state.bankActual && state.bankActual.amount!==undefined && state.bankActual.amount!=='' ? state.bankActual : null;
  const bdiff = ba ? Number(ba.amount) - (pb.bank + trustAmount()) : null;
  const ageDays = ba ? Math.round((Date.now()-new Date(ba.date+'T00:00:00').getTime())/86400000) : null;
  const bankOk = ba && Math.abs(bdiff)<0.005 && ageDays<=7;
  const tasks = [
    {ok: unpaid.length===0, label:'اشتراكات '+monthLabel(mk), detail: paidN+' من '+units.length+' دفعوا', go:"paymentsMonth='"+mk+"';goToView('payments')"},
    {ok: roomUnpaid.length===0, label:'إيجار الغرف', detail: rooms.length? ((rooms.length-roomUnpaid.length)+' من '+rooms.length+' دفعوا') : 'لا غرف مؤجّرة', go:"roomPaymentsMonth='"+mk+"';goToView('driverRooms')"},
    {ok: noAtt.length===0, label:'مرفقات المصروفات', detail: noAtt.length? (noAtt.length+' مصروف بلا مرفق') : 'كلها مرفقة', go:"financeMonth='';financeFilter='expense';goToView('finance')"},
    {ok: noVch.length===0, label:'سندات الصرف', detail: noVch.length? (noVch.length+' مصروف بلا سند') : 'كلها لها سند', go:"goToView('voucher')"},
    {ok: !!bankOk, label:'مطابقة البنك', detail: !ba ? 'لم تُدخل رصيد البنك الفعلي' : (Math.abs(bdiff)>=0.005 ? ('فرق '+fmt(Math.abs(bdiff))+' ر.س'+(bdiff>0?' (البنك أعلى)':' (التطبيق أعلى)')) : (ageDays>7?'آخر مطابقة قبل '+ageDays+' يومًا':'مطابق ✅')), go:"setBankActual()"}
  ];
  const doneN = tasks.filter(t=>t.ok).length;
  const pct = Math.round(doneN/tasks.length*100);
  const unlockedPast = Object.keys((state.transactions||[]).reduce((a,t)=>{ const m=(t.date||'').slice(0,7); if(m && m<cur && !isMonthLocked(m)) a[m]=1; return a; },{})).sort();
  const panel = document.createElement('div'); panel.className='panel';
  panel.style.cssText='margin-bottom:14px;';
  const taskRows = tasks.map(t=>`<div onclick="${t.go}" style="display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #eef0f2;cursor:pointer;">
      <span style="font-size:18px;">${t.ok?'✅':'⬜'}</span>
      <div style="flex:1;"><div style="font-weight:700;font-size:13.5px;">${t.label}</div><div style="font-size:12px;color:${t.ok?'var(--green)':'var(--red)'};">${t.detail}</div></div>

  const unpaidRows = unpaid.map(u=>{
    const owed = Number(u.arrearsPrevious)<0 ? Math.abs(Number(u.arrearsPrevious)) : 0;
    const tel = String(u.phone||'').replace(/\D/g,'');
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eef0f2;">

      ${tel?`<a class="btn-ghost btn-sm" style="text-decoration:none;" href="tel:${tel}">📞</a><a class="btn-ghost btn-sm" style="text-decoration:none;" target="_blank" rel="noopener" href="${dashWaLink(u.phone,msgFor(u))}">💬 تذكير</a>`:'<span style="font-size:11px;color:var(--text-dim);">لا جوال</span>'}
    </div>`; }).join('');
  const roomRows = (state.driverRooms||[]).map(r=>{
    const occ = r.tenant && Number(r.monthlyRent)>0;
    const p = state.roomPayments[r.id+'|'+mk]; const paid = !!(p&&p.paid);
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #eef0f2;font-size:13px;">
      <span><b>غرفة ${esc(r.number)}</b> — ${occ?esc(r.tenant):'<span style="color:var(--text-dim);">شاغرة</span>'}</span>
      ${occ?`<span>${fmt(r.monthlyRent)} ر.س <span class="badge ${paid?'green':'red'}" style="margin-inline-start:6px;">${paid?'دفع':'لم يدفع'}</span></span>`:''}</div>`; }).join('');
  const exp = (state.transactions||[]).filter(t=>t.type==='expense' && (t.date||'').slice(0,7)===mk);
  const byCat = {}; exp.forEach(t=>{ const c=t.category||'عام'; byCat[c]=(byCat[c]||0)+(Number(t.amount)||0); });
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const expTotal = cats.reduce((s,c)=>s+c[1],0);
  const catRows = cats.slice(0,7).map(([c,v])=>`<div style="margin:6px 0;"><div style="display:flex;justify-content:space-between;font-size:12.5px;"><span>${esc(c)}</span><b>${fmt(v)} ر.س</b></div><div style="background:#eef0f2;border-radius:6px;height:7px;"><div style="width:${Math.max(3,Math.round(v/cats[0][1]*100))}%;background:#c0392b;opacity:.75;height:7px;border-radius:6px;"></div></div></div>`).join('');
  panel.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
      <div class="panel-title" style="margin:0;">مركز المتابعة</div>
      <label style="font-size:12.5px;">الشهر: <select onchange="dashSetFocus(this.value)" style="width:auto;">${opts.map(m=>`<option value="${m}" ${m===mk?'selected':''}>${monthLabel(m)}</option>`).join('')}</select></label>
    </div>
    <div style="margin:10px 0 4px;display:flex;align-items:center;gap:10px;">
      <div style="flex:1;background:#eef0f2;border-radius:8px;height:10px;"><div style="width:${pct}%;background:${pct===100?'#1f9d55':'#d98e04'};height:10px;border-radius:8px;"></div></div>
      <b style="font-size:13px;">${doneN} من ${tasks.length}</b></div>
    ${taskRows}
    ${unlockedPast.length?`<div style="font-size:12px;color:var(--text-dim);padding:8px 4px;">🔓 أشهر ماضية غير مقفلة: ${unlockedPast.map(monthLabel).join('، ')} — تُقفل بعد آخر إيداع وبعد المطابقة.</div>`:''}
    <details ${unpaid.length&&unpaid.length<=12?'open':''} style="margin-top:10px;"><summary style="font-weight:800;font-size:13.5px;cursor:pointer;">من لم يدفع في ${monthLabel(mk)} (${unpaid.length})</summary>${unpaidRows||'<div class="empty">الكل دفع 🎉</div>'}</details>
    <details style="margin-top:10px;"><summary style="font-weight:800;font-size:13.5px;cursor:pointer;">الغرف (${monthLabel(mk)})</summary>${roomRows}</details>

  main.appendChild(panel);

function statusBadge(status){
  const map = {
    'طلب جديد':'amber', 'قيد التنفيذ':'blue', 'مكتملة':'green',
    'مسدد':'green', 'عليه مستحقات':'red',
    'مدفوعة':'green', 'غير مدفوعة':'red',
    'يعمل':'green', 'يحتاج فحص':'amber', 'معطل':'red'
  };
  return '<span class="badge '+(map[status]||'gray')+'">'+status+'</span>';
}

      }).join('')

async function addUnitNote(unitId){
  const input = document.getElementById('f-newnote');
  const text = input.value.trim();
  if(!text) return;
  const u = state.units.find(x=>x.id===unitId);
  if(!u) return;
  if(!Array.isArray(u.notes)) u.notes = [];
  u.notes.push({date:new Date().toLocaleDateString('ar-SA'), text});
  await saveState();
  openUnitModal(unitId);
}
async function deleteUnitNote(unitId, idx){
  const u = state.units.find(x=>x.id===unitId);
  if(!u || !Array.isArray(u.notes)) return;
  u.notes.splice(Number(idx),1);
  await saveState();
  openUnitModal(unitId);
}
async function saveUnit(id){
  const arrears = Number(document.getElementById('f-arrears').value)||0;
  const data = {
    number: document.getElementById('f-number').value.trim() || 'شقة',
    floor: Number(document.getElementById('f-floor').value)||1,
    owner: document.getElementById('f-owner').value.trim(),
    phone: document.getElementById('f-phone').value.trim(),
    monthlyFee: Number(document.getElementById('f-fee').value)||200,
    arrearsPrevious: arrears
  };
  let unit;
  if(id){
    unit = state.units.find(x=>x.id===id);
    Object.assign(unit, data);
  } else {
    const newId = 'u'+(state.nextIds.unit++);
    unit = {id:newId, ...data, collected:0, duesThisYear:0, totalDue:0, notes:[]};
    state.units.push(unit);
  }
  syncUnitFinancials(unit);
  await saveState(); closeModal(); render();
}
async function deleteUnit(id){
  state.units = state.units.filter(u=>u.id!==id);
  await saveState(); render();
}

/* ---------------- owner statement printing ---------------- */
const ARABIC_MONTHS = {'01':'يناير','02':'فبراير','03':'مارس','04':'أبريل','05':'مايو','06':'يونيو','07':'يوليو','08':'أغسطس','09':'سبتمبر','10':'أكتوبر','11':'نوفمبر','12':'ديسمبر'};
function monthLabel(key){
  const [y,m] = key.split('-');
  return (ARABIC_MONTHS[m]||m)+' '+y;
}
function buildOwnerStatementHTML(owner){
  const units = state.units.filter(u=>u.owner===owner.name);
  /* Compute fresh from the actual payment records rather than trusting the
     cached u.collected/u.duesThisYear/u.totalDue fields, which only get
     refreshed when syncAllUnitsFinancials() happens to run — printing should
     never show a stale number. */
  const live = units.map(u=>{
    const collected = computeUnitCollected(u);
    const arrearsPrevious = Number(u.arrearsPrevious||0);
    const duesThisYear = computeUnitDuesThisYear(u);
    const totalDue = arrearsPrevious + duesThisYear;
    return {u, collected, arrearsPrevious, duesThisYear, totalDue};
  });
  const totalDue = live.reduce((s,x)=>s+x.totalDue,0);
  const totalCollected = live.reduce((s,x)=>s+x.collected,0);
  /* تفصيل المتأخرات: فترة الإدارة الحالية مقابل ما قبل الاستلام */
  const _mStart = incomeStartKey(), _fb = firstBillingMonthKey(), _lc = lastCompletedMonthKey(), _cur = currentMonthKey();
  let _curUnpaid = 0, _priorUnpaid = 0;
  units.forEach(u=>{
    _priorUnpaid += Math.max(0, -Number(u.arrearsPrevious||0)); // المتأخر مخزّن بالسالب
    monthsBetweenInclusive(_fb, _lc).forEach(mk=>{
      const r = state.payments[u.id+'|'+mk]; const amt = r ? Number(r.amount)||0 : Number(u.monthlyFee||200);
      if(!(r && r.paid)){ if(mk < _mStart) _priorUnpaid += amt; else _curUnpaid += amt; }
    });
  });
  let _advance = 0;
  units.forEach(u=>{ Object.keys(state.payments||{}).forEach(k=>{ const [uid,mk]=k.split('|'); const r=state.payments[k]; if(uid===u.id && r && r.paid && mk>_cur) _advance += Number(r.amount)||0; }); });
  const _periodRows = (_advance>0 ? `<tr><td colspan="2" style="color:#1c5fb0;"><b>ضمن المحصّل: مدفوع مقدمًا لأشهر قادمة:</b> ${fmt(_advance)} ر.س</td></tr>` : '') + `
      <tr><td colspan="2"><b>مستحقات فترة الإدارة الحالية (من ${monthLabel(_mStart)}):</b> ${_curUnpaid>0?'<span style="color:#c0392b;font-weight:700;">'+fmt(_curUnpaid)+' ر.س متأخرة</span>':'<span style="color:#1f9d55;font-weight:700;">مسددة ✅</span>'}</td></tr>
      <tr><td colspan="2"><b>مستحقات ما قبل الإدارة الحالية:</b> ${_priorUnpaid>0?'<span style="color:#c0392b;font-weight:700;">'+fmt(_priorUnpaid)+' ر.س</span>':'<span style="color:#1f9d55;font-weight:700;">لا يوجد ✅</span>'}</td></tr>`;

  let unitsRows = '';
  live.forEach(({u,collected,arrearsPrevious,duesThisYear,totalDue})=>{
    unitsRows += `<tr>
      <td>${u.number}</td>
      <td>${fmt(u.monthlyFee||200)} ر.س</td>
      <td>${fmt(collected)} ر.س</td>
      <td>${fmt(arrearsPrevious)} ر.س</td>
      <td>${fmt(duesThisYear)} ر.س</td>
      <td style="font-weight:700;color:${totalDue<0?'#c0392b':'#1f9d55'}">${fmt(totalDue)} ر.س</td>
    </tr>`;
  });

  let paymentsRows = '';
  const stmtStartMonth = firstBillingMonthKey();
  const stmtEndMonth = currentMonthKey();
  units.forEach(u=>{
    /* List every month in the billing range, not just ones with an explicit
       saved record — otherwise an unpaid month nobody has clicked on yet
       (like a fresh default-due month) silently disappears from the printed
       log even though it's counted in the totals above. */
    /* ندرج أيضًا الأشهر القادمة التي دُفعت مقدمًا (مثل رسوم نوفمبر المودَعة في أكتوبر) كي لا تختفي الدفعة من الكشف */
    let _endM = stmtEndMonth;
    Object.keys(state.payments||{}).forEach(k=>{ const [uid,mk]=k.split('|'); if(uid===u.id && state.payments[k] && state.payments[k].paid && mk>_endM) _endM = mk; });
    const months = monthsBetweenInclusive(stmtStartMonth, _endM);
    months.forEach(month=>{
      const rec = state.payments[u.id+'|'+month] || {paid:false, amount:u.monthlyFee||200};
      const isCur = month===currentMonthKey();
      const period = month < incomeStartKey() ? 'قبل الإدارة الحالية' : 'الإدارة الحالية';
      paymentsRows += `<tr>
        <td>${u.number}</td>
        <td>${monthLabel(month)}</td>
        <td style="color:#7a746b;">${period}</td>
        <td>${fmt(rec.amount)} ر.س</td>
        <td style="color:${rec.paid?'#1f9d55':((isCur||month>currentMonthKey())?'#7a746b':'#c0392b')};font-weight:700;">${rec.paid?(month>currentMonthKey()?'مدفوعة مقدمًا ✅':'مدفوعة'):(month>currentMonthKey()?'لم يحن بعد':(isCur?'مستحقة (الشهر الجاري)':'غير مدفوعة'))}</td>
      </tr>`;
    });
  });

/* ---------------- payments ---------------- */
function currentMonthKey(){
  const now = new Date();
  return now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
}
function lastCompletedMonthKey(){
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth()-1, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

const OPENING_NOTE_DEFAULT = 'رصيد حساب العمارة البنكي عند الاستلام (الحساب كان مجمّدًا)';
function openingBalanceText(){
  const note = (state.openingBalanceNote||'').trim() || OPENING_NOTE_DEFAULT;
  const d = state.openingBalanceDate;
  let ds = '';
  if(d){
    if(/^\d{4}-\d{2}$/.test(d)) ds = monthLabel(d);
    else { try{ ds = new Date(d+'T00:00:00').toLocaleDateString('ar-SA'); }catch(e){ ds = d; } }
  }
  return note + (ds ? ' — '+(/^\d{4}-\d{2}$/.test(d)?'شهر ':'بتاريخ ')+ds : '');
}
function firstBillingMonthKey(){
  if(state.billingStartMonth && !state.billingModeIgnoreStart) return state.billingStartMonth;
  let min = null;
  Object.keys(state.payments).forEach(k=>{
    const month = k.split('|')[1];
    if(!min || month < min) min = month;
  });
  return min || currentMonthKey();
}
/* أول شهر تدخل دفعاته في رصيد حساب العمارة (شهر استلام الإدارة). ما قبله حُصِّل لدى الإدارة السابقة:
   يُحتسب في حساب الشقة (المتأخرات) لكن لا يدخل في الإيراد ولا في الرصيد. */
function incomeStartKey(){
  const b = firstBillingMonthKey();
  const m = state.managementStartMonth || '';
  return (m && m > b) ? m : b;
}
function monthsBetweenInclusive(startKey, endKey){
  if(startKey > endKey) return [];
  const out = [];
  let [y,m] = startKey.split('-').map(Number);
  const [ey,em] = endKey.split('-').map(Number);
  while(y<ey || (y===ey && m<=em)){
    out.push(y+'-'+String(m).padStart(2,'0'));
    m++; if(m>12){ m=1; y++; }
  }
  return out;
}
function monthBefore(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  const d = new Date(y, m-2, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
/* Net position (paid minus due) for a unit across an arbitrary month range —
   same logic as computeUnitDuesThisYear but for any custom [fromKey,toKey] window,
   used by the print report so the admin can choose exactly which months to include. */
function computeUnitNetForRange(unit, fromKey, toKey){
  const months = monthsBetweenInclusive(fromKey, toKey);
  let due=0, paid=0;
  months.forEach(mk=>{
    const rec = state.payments[unit.id+'|'+mk];
    const amount = rec ? Number(rec.amount) : Number(unit.monthlyFee||200);
    due += amount;
    if(rec && rec.paid) paid += amount;
  });
  return paid - due;
}
/* Balance carried into the report from before the chosen "from" month:
   the manual pre-system arrears plus any earlier unpaid billing months. */
function computeUnitPriorArrears(unit, fromKey){
  const start = firstBillingMonthKey();
  if(fromKey <= start) return Number(unit.arrearsPrevious||0);
  return Number(unit.arrearsPrevious||0) + computeUnitNetForRange(unit, start, monthBefore(fromKey));
}
/* Every riyal a unit has actually been marked as paid, from the building's
   billing start month onward — this respects state.billingStartMonth if set,
   so months before you took over management don't count, but their payment
   records stay untouched and visible in the monthly payments page. */
function computeUnitCollected(unit){
  let total = 0;
  const prefix = unit.id+'|';
  const start = firstBillingMonthKey();
  Object.keys(state.payments).forEach(k=>{
    if(!k.startsWith(prefix)) return;
    const month = k.split('|')[1];
    if(month < start) return;
    if(state.payments[k].paid) total += Number(state.payments[k].amount)||0;
  });
  return total;
}
/* Single source of truth for "dues collected": same rule as computeUnitCollected
   (months before the first billing month are ignored). monthKey '' = all months. */
function paidDuesTotal(monthKey, sinceKey){
  const start = sinceKey || incomeStartKey();
  const unitIds = new Set(state.units.map(u=>u.id));
  let total = 0;
  Object.keys(state.payments||{}).forEach(k=>{
    const rec = state.payments[k];
    if(!rec || !rec.paid) return;
    const [uid,mk] = k.split('|');
    if(!unitIds.has(uid) || mk < start) return;
    if(monthKey && mk!==monthKey) return;
    total += Number(rec.amount)||0;
  });
  return total;
}
/* What the unit owes (or has overpaid) for months that have already fully elapsed,
   counting from the building's first billing month through last completed month.
   The current month is not counted yet — dues aren't "late" until the month is over. */
function computeUnitDuesThisYear(unit){
  const start = firstBillingMonthKey();
  const end = lastCompletedMonthKey();
  const months = monthsBetweenInclusive(start, end);
  let due=0, paid=0;
  months.forEach(mk=>{
    const rec = state.payments[unit.id+'|'+mk];
    const amount = rec ? Number(rec.amount) : Number(unit.monthlyFee||200);
    due += amount;
    if(rec && rec.paid) paid += amount;
  });
  return paid - due;
}
function syncUnitFinancials(unit){
  unit.collected = computeUnitCollected(unit);
  unit.duesThisYear = computeUnitDuesThisYear(unit);
  unit.totalDue = Number(unit.arrearsPrevious||0) + unit.duesThisYear;
}
function syncAllUnitsFinancials(){
  let changed = false;
  state.units.forEach(u=>{
    const before = JSON.stringify([u.collected,u.duesThisYear,u.totalDue]);
    syncUnitFinancials(u);
    if(JSON.stringify([u.collected,u.duesThisYear,u.totalDue]) !== before) changed = true;
  });
  return changed;
}

/* نقل دفعة (أو تبديلها) بين شهرين لنفس الشقة/الغرفة: تتبدّل الحالة ومكان الاستلام وتاريخ الإيداع، وتبقى مبالغ كل شهر كما هي */
function _swapPayState(a, b, fee){
  const pick = r => ({paid:!!(r&&r.paid), place:r&&r.place, depositDate:r&&r.depositDate});
  const sa = pick(a), sb = pick(b);
  const mk = (base, st) => { const o = {paid:st.paid, amount: base&&base.amount!==undefined ? base.amount : fee}; if(st.place) o.place=st.place; if(st.depositDate) o.depositDate=st.depositDate; return o; };
  return [mk(a, sb), mk(b, sa)]; // [جديد الشهر المصدر, جديد الشهر الهدف]
}
/* ترحيل دفعات شهر كاملة إلى شهر آخر (مثل: دفعات مسجّلة على سبتمبر وهي في الحقيقة رسوم أكتوبر).
   لا يتغير رصيد الحساب: يُحفظ شهر الإيداع الأصلي، والدفعة المنقولة تُحسب على الشهر الجديد فقط في كشف الاستحقاق. */
function _monthEndISO(mk){ const [y,m]=mk.split('-').map(Number); const d=new Date(y,m,0); return mk+'-'+String(d.getDate()).padStart(2,'0'); }
function _bulkMovePlan(src,tgt){
  const move=[], conflict=[];
  state.units.forEach(u=>{
    const r = state.payments[u.id+'|'+src]; if(!(r && r.paid)) return;
    const t = state.payments[u.id+'|'+tgt];
    if(t && t.paid) conflict.push(u); else move.push(u);
  });
  return {move, conflict};
}
/* شهر بلا رسوم: يجعل مبلغ الشهر 0 للشقق غير المسددة فيه، فلا يُحسب عليها متأخرًا ولا تظهر عليها العلامة الحمراء.
   للشهر الذي لم تُحصَّل فيه رسوم أصلًا (مثل شهر قبل أن تبدأ الإدارة الحالية التحصيل). لا يمس المدفوعات ولا الأرصدة. */
function openWaiveMonthModal(){

  const def = months.includes('2026-08') ? '2026-08' : (months[0]||currentMonthKey());
  showModal(`<h3>🚫 شهر بلا رسوم</h3>
    <p style="font-size:12.5px;color:var(--text-dim);line-height:1.8;">اختر شهرًا لم تُحصَّل رسومه أصلًا، فيصير مبلغه ٠ لكل شقة غير مسددة فيه، ولا يُحسب عليها متأخرًا. من دفع فيه يبقى دفعه كما هو. ويمكنك لاحقًا إعادة المبلغ لشقة واحدة من «تعديل المبلغ» (مثل من عليه الشهر فعلًا).</p>
    <div class="field"><label>الشهر</label><select id="f-wv-m" onchange="updateWaivePreview()">${months.map(m=>`<option value="${m}" ${m===def?'selected':''}>${monthLabel(m)}</option>`).join('')}</select></div>
    <div id="wv-preview" style="font-size:13px;line-height:1.8;margin:8px 0;"></div>
    <div class="modal-actions"><button class="btn-ghost" onclick="closeModal()">إلغاء</button><button class="btn" onclick="runWaiveMonth()">تطبيق</button></div>`);
  updateWaivePreview();
}
function _waivePlan(mk){ return state.units.filter(u=>{ const r=state.payments[u.id+'|'+mk]; return !(r&&r.paid) && (!r || Number(r.amount)!==0); }); }
function updateWaivePreview(){
  const mk=(document.getElementById('f-wv-m')||{}).value; const el=document.getElementById('wv-preview'); if(!mk||!el) return;
  const p=_waivePlan(mk); el.innerHTML='سيصير مبلغ '+monthLabel(mk)+' = ٠ لعدد <b>'+p.length+'</b> شقة غير مسددة.';
}
async function runWaiveMonth(){
  const mk=document.getElementById('f-wv-m').value; if(!mk) return;
  if(!assertMonthOpen(mk,'تعديل رسوم')) return;
  const p=_waivePlan(mk); if(!p.length){ alert('لا توجد شقق للتعديل'); return; }
  if(!confirm('سيصير '+monthLabel(mk)+' بلا رسوم لـ'+p.length+' شقة غير مسددة. تكمل؟')) return;
  p.forEach(u=>{ state.payments[u.id+'|'+mk]={paid:false, amount:0}; });
  state.paymentMoveLog=(state.paymentMoveLog||[]).concat([{waive:true,month:mk,count:p.length,at:new Date().toISOString()}]);
  state.units.forEach(u=>syncUnitFinancials(u));
  await saveState(); closeModal(); render();

}
function openBulkMoveModal(){
  const months = [...new Set(Object.keys(state.payments||{}).filter(k=>state.payments[k]&&state.payments[k].paid).map(k=>k.split('|')[1]))].sort();

    <div class="two-col">
      <div class="field"><label>من شهر</label><select id="f-bm-src" onchange="updateBulkMovePreview()">${months.map(m=>`<option value="${m}" ${m===src?'selected':''}>${monthLabel(m)}</option>`).join('')}</select></div>

function updateBulkMovePreview(){
  const src=(document.getElementById('f-bm-src')||{}).value, tgt=(document.getElementById('f-bm-tgt')||{}).value;
  const el=document.getElementById('bm-preview'); if(!el||!src||!tgt) return;
  if(src===tgt){ el.innerHTML='<span style="color:var(--red);">اختر شهرين مختلفين</span>'; return; }
  const p=_bulkMovePlan(src,tgt);
  el.innerHTML = '<b>سيُرحَّل: '+p.move.length+' دفعة</b> من '+monthLabel(src)+' إلى '+monthLabel(tgt)+(p.conflict.length?'<br><span style="color:var(--red);">لن تُرحَّل '+p.conflict.length+' (مسددة أصلًا في '+monthLabel(tgt)+'): '+p.conflict.map(u=>u.number).join('، ')+'</span>':'');

async function runBulkMove(){
  const src=document.getElementById('f-bm-src').value, tgt=document.getElementById('f-bm-tgt').value;
  if(!src||!tgt||src===tgt) return;
  const start=incomeStartKey();
  if((src<start)!==(tgt<start)){ alert('لا يمكن الترحيل بين شهر قبل استلام الإدارة ('+monthLabel(start)+') وشهر بعده، لأن الأولى لا تدخل الرصيد.'); return; }
  if(!assertMonthOpen(src,'ترحيل دفعات منه') || !assertMonthOpen(tgt,'ترحيل دفعات إليه')) return;
  const p=_bulkMovePlan(src,tgt);
  if(!p.move.length){ alert('لا توجد دفعات للترحيل'); return; }
  if(!confirm('سيُرحَّل '+p.move.length+' دفعة من '+monthLabel(src)+' إلى '+monthLabel(tgt)+'. تكمل؟')) return;
  const endSrc=_monthEndISO(src);
  p.move.forEach(u=>{
    const sk=u.id+'|'+src, tk=u.id+'|'+tgt; const r=state.payments[sk];
    const nr={paid:true, amount:Number(r.amount)||Number(u.monthlyFee)||200};
    if(r.place) nr.place=r.place;
    nr.depositDate = r.depositDate || endSrc; // شهر الإيداع الأصلي يبقى فلا تتغير أرصدة الأشهر
    state.payments[tk]=nr;
    state.payments[sk]={paid:false, amount:Number(u.monthlyFee)||200};
  });
  state.paymentMoveLog=(state.paymentMoveLog||[]).concat([{bulk:true,src,tgt,count:p.move.length,at:new Date().toISOString()}]);
  state.units.forEach(u=>syncUnitFinancials(u));
  await saveState(); closeModal(); paymentsMonth=tgt; render();
  alert('تم — رُحّلت '+p.move.length+' دفعة من '+monthLabel(src)+' إلى '+monthLabel(tgt)+'.');
}
async function movePaymentMonth(unitId){
  const to = (document.getElementById('f-movemonth')||{}).value || '';
  const from = paymentsMonth;
  if(!to){ alert('اختر الشهر المراد النقل إليه'); return; }
  if(to===from){ alert('الشهر المختار هو نفس الشهر الحالي'); return; }
  if(!assertMonthOpen(from,'نقل الدفعة')) return;
  if(!assertMonthOpen(to,'نقل الدفعة إلى هذا الشهر')) return;
  const u = state.units.find(x=>x.id===unitId); const fee = u.monthlyFee||200;
  const ka = unitId+'|'+from, kb = unitId+'|'+to;
  const a = state.payments[ka] || {paid:false, amount:fee}, b = state.payments[kb] || {paid:false, amount:fee};
  if(!a.paid && !b.paid){ alert('لا توجد دفعة مسدّدة في أي من الشهرين لنقلها'); return; }
  const msg = (a.paid && !b.paid) ? 'نقل سداد '+monthLabel(from)+' إلى '+monthLabel(to)+'؟' : 'تبديل حالة السداد بين '+monthLabel(from)+' و'+monthLabel(to)+'؟';
  if(!confirm(msg)) return;
  const [na, nb] = _swapPayState(a, b, fee);
  [[na,from],[nb,to]].forEach(([n,m])=>{ if(n.paid && !n.depositDate){ const orig=(m===from?to:from); n.depositDate=_monthEndISO(orig); } }); // تبقى الدفعة في المكان الذي استُلمت فيه
  state.payments[ka] = na; state.payments[kb] = nb;
  state.paymentMoveLog = state.paymentMoveLog || [];
  state.paymentMoveLog.push({unit:u.number, from, to, at:new Date().toISOString()});
  await saveState(); closeModal(); render();
}

  if(!to){ alert('اختر الشهر المراد النقل إليه'); return; }

  if(!confirm(msg)) return;

/* تحصيل متأخرات: يعلّم الأشهر المسددة، ويخفض المستحقات السابقة، ويضيف حركة إيراد للجزء الذي لا يدخل الرصيد تلقائيًا
   (أشهر ما قبل استلام الإدارة + المستحقات السابقة) حتى يطابق التطبيق حساب البنك */
function _arrearsUnpaidMonths(u){
  return monthsBetweenInclusive(firstBillingMonthKey(), lastCompletedMonthKey()).filter(mk=>{
    const r = state.payments[u.id+'|'+mk]; return !(r && r.paid);
  });
}
function openArrearsCollectModal(unitId){
  const u = state.units.find(x=>x.id===unitId); if(!u) return;
  const months = _arrearsUnpaidMonths(u);
  const prevOwed = Math.max(0, -Number(u.arrearsPrevious||0));
  const start = incomeStartKey();
  const fee = Number(u.monthlyFee||200);
  const monthRows = months.map(mk=>{
    const r = state.payments[u.id+'|'+mk]; const amt = r ? Number(r.amount)||0 : fee;
    return `<label style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #eef0f2;cursor:pointer;">
      <span><input type="checkbox" class="arr-m" data-mk="${mk}" data-amt="${amt}" onchange="updateArrearsTotal()"> ${monthLabel(mk)} <span style="font-size:11px;color:var(--text-dim);">${mk<start?'(قبل الاستلام)':''}</span></span><b>${fmt(amt)} ر.س</b></label>`;
  }).join('') || '<div class="empty">لا توجد أشهر متأخرة غير مسددة</div>';
  showModal(`
    <h3>تحصيل متأخرات — ${esc(u.number)} (${esc(u.owner)})</h3>
    <div class="field"><label>الأشهر التي دفعها المالك</label><div style="max-height:200px;overflow:auto;">${monthRows}</div></div>
    ${prevOwed>0?`<div class="field"><label>من المستحقات السابقة (المتبقي ${fmt(prevOwed)} ر.س)</label><input id="f-arr-prev" type="number" min="0" max="${prevOwed}" value="0" oninput="updateArrearsTotal()"></div>`:''}
    <div class="field"><label>تاريخ الإيداع</label><input id="f-arr-date" type="date" value="${todayISODate()}"></div>
    <div class="field"><label>طريقة الدفع</label><select id="f-arr-method"><option>تحويل</option><option>كاش</option></select></div>
    <div class="field"><label>مكان الاستلام</label><select id="f-arr-place"><option value="bank">حساب العمارة (البنك)</option><option value="custody">عهدة المدير (حسابي)</option><option value="cash">نقد</option></select></div>
    <div id="arr-total" style="font-weight:800;font-size:15px;margin:8px 0;">الإجمالي: 0 ر.س</div>
    <div class="modal-actions"><button class="btn-ghost" onclick="closeModal()">إلغاء</button><button class="btn" onclick="saveArrearsCollection('${unitId}')">حفظ</button></div>`);
}
function updateArrearsTotal(){
  let t=0; document.querySelectorAll('.arr-m').forEach(c=>{ if(c.checked) t+=Number(c.dataset.amt)||0; });
  const p=document.getElementById('f-arr-prev'); if(p) t+=Number(p.value)||0;
  const el=document.getElementById('arr-total'); if(el) el.textContent='الإجمالي: '+fmt(t)+' ر.س';
}
async function saveArrearsCollection(unitId){
  const u = state.units.find(x=>x.id===unitId); if(!u) return;
  const date = (document.getElementById('f-arr-date')||{}).value || todayISODate();
  const method = (document.getElementById('f-arr-method')||{}).value || 'تحويل';
  const place = (document.getElementById('f-arr-place')||{}).value || 'bank';
  const picked = [...document.querySelectorAll('.arr-m')].filter(c=>c.checked).map(c=>c.dataset.mk);
  const prevOwed = Math.max(0, -Number(u.arrearsPrevious||0));
  let prevAmt = Number((document.getElementById('f-arr-prev')||{}).value)||0;
  if(prevAmt<0) prevAmt=0; if(prevAmt>prevOwed) prevAmt=prevOwed;
  if(!picked.length && !(prevAmt>0)){ alert('اختر شهرًا أو أدخل مبلغًا من المستحقات السابقة'); return; }
  if(!assertMonthOpen(date,'تسجيل تحصيل في')) return;
  for(const mk of picked){ if(!assertMonthOpen(mk,'تعليم هذا الشهر مدفوعًا')) return; }
  const start = incomeStartKey();
  let txAmount = prevAmt; const labels=[];
  picked.forEach(mk=>{
    const key = u.id+'|'+mk; const r = state.payments[key] || {paid:false, amount:u.monthlyFee||200};
    const amt = Number(r.amount)||0;
    const nr = {paid:true, amount:amt}; nr.place = (place==='bank'?'bank':place); nr.depositDate = date;
    state.payments[key] = nr;
    if(mk < start) txAmount += amt; // قبل الاستلام: لا يدخل الرصيد تلقائيًا
    labels.push(monthLabel(mk));
  });
  if(prevAmt>0) u.arrearsPrevious = Number(u.arrearsPrevious||0) + prevAmt; // المتأخر مخزّن بالسالب
  if(!state.nextIds) state.nextIds = {}; if(!state.nextIds.tx) state.nextIds.tx = 1;
  if(txAmount>0){
    state.transactions.push({id:'t'+(state.nextIds.tx++), type:'income', amount:txAmount, category:'اشتراكات متأخرة', method,
      date, place, hasAttachment:false,
      note:'تحصيل متأخرات ما قبل الاستلام — '+u.number+' ('+u.owner+')'+(labels.length?': '+labels.join('، '):'')+(prevAmt>0?(labels.length?' + ':': ')+'مستحقات سابقة '+fmt(prevAmt)+' ر.س':'')});
  }
  state.arrearsLog = state.arrearsLog || [];
  state.arrearsLog.push({unit:u.number, months:picked, prev:prevAmt, txAmount, date, at:new Date().toISOString()});
  syncUnitFinancials(u);
  await saveState(); closeModal(); render();
}
async function savePaymentEdit(unitId){
  if(!assertMonthOpen(paymentsMonth,'تعديل الدفعة')) return;
  const u = state.units.find(x=>x.id===unitId);
  const key = unitId+'|'+paymentsMonth;
  const amount = Number(document.getElementById('f-payamount').value) || 0;
  const paid = document.getElementById('f-paystatus').value === '1';
  const place = (document.getElementById('f-payplace')||{}).value || '';
  const depositDate = ((document.getElementById('f-paydate')||{}).value || '').trim();
  const oldDep = (state.payments[key]||{}).depositDate || '';

    for(const d of [depositDate, oldDep]){ if(d && !assertMonthOpen(d.slice(0,7),'تغيير تاريخ الإيداع')) return; }
  }
  const nr = { paid, amount }; if(place) nr.place = place; if(depositDate) nr.depositDate = depositDate;
  state.payments[key] = nr;
  await saveState(); closeModal(); render();
}
async function resetPaymentToDefault(unitId){
  if(!assertMonthOpen(paymentsMonth,'تعديل الدفعة')) return;
  const u = state.units.find(x=>x.id===unitId);
  const key = unitId+'|'+paymentsMonth;

  await saveState(); closeModal(); render();
}
