<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة العمارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#0a6b3c;
    --navy-2:#054a28;
    --teal:#12a862;
    --teal-dark:#0c7d47;
    --teal-tint:#e6f7ee;
    --bg:#f5faf7;
    --card:#ffffff;
    --border:#dcece1;
    --text:#26282c;
    --text-dim:#71807a;
    --amber:#c98a2c;
    --amber-tint:#f7ecd6;
    --blue-tint:#eceef3;
    --blue:#54627a;
    --green-tint:#e3f1e8;
    --green:#2f8f5b;
    --red:#c1443a;
    --red-tint:#f8e6e3;
    --radius:14px;
    --shadow:0 10px 28px rgba(10,60,35,.09);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal', system-ui, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  #app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:230px;
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
    color:#dcf3e6;
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    padding:18px 14px;
  }
  .sidebar-header{
    display:flex;align-items:center;gap:10px;
    padding:6px 6px 18px 6px;
    border-bottom:1px solid rgba(255,255,255,.14);
    margin-bottom:14px;
  }
  .sidebar-logo{
    width:34px;height:34px;border-radius:9px;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#fff;font-size:15px;flex-shrink:0;
    overflow:hidden;
  }
  .sidebar-logo img{width:100%;height:100%;object-fit:contain;padding:3px;}
  .sidebar-title{font-size:13px;font-weight:700;color:#fff;line-height:1.3;}
  .sidebar-sub{font-size:10.5px;color:#a9d9bc;margin-top:1px;}
  .nav{display:flex;flex-direction:column;gap:3px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:9px;
    font-size:13.5px;font-weight:500;
    color:#c8ead6;cursor:pointer;
    border:none;background:none;text-align:right;width:100%;
    font-family:inherit;
    transition:background .15s,color .15s;
  }
  .nav-item .ic{width:17px;text-align:center;font-size:14px;flex-shrink:0;}
  .nav-item:hover{background:rgba(255,255,255,.1);color:#fff;}
  .nav-item.active{background:var(--teal-dark);color:#fff;}
  .nav-divider{height:1px;background:rgba(255,255,255,.16);margin:6px 4px;flex-shrink:0;}
  .sidebar-footer{border-top:1px solid rgba(255,255,255,.14);padding-top:12px;margin-top:8px;}
  .sidebar-user{
    display:flex;align-items:center;gap:9px;
    padding:8px 6px;border-radius:9px;margin-bottom:8px;
  }
  .avatar{width:30px;height:30px;border-radius:50%;background:#054a28;display:flex;align-items:center;justify-content:center;font-size:12px;color:#e6f7ee;flex-shrink:0;}
  .sidebar-user-name{font-size:12px;color:#fff;font-weight:600;}
  .sidebar-user-role{font-size:10.5px;color:#a9d9bc;}

  /* Main */
  .main{flex:1;padding:26px 30px;min-width:0;overflow-x:hidden;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
  .eyebrow{font-size:12.5px;color:var(--teal-dark);font-weight:700;}
  h1{font-size:24px;font-weight:800;margin:2px 0 4px 0;letter-spacing:-.2px;}
  .page-desc{color:var(--text-dim);font-size:13px;margin:0;}
  .btn{
    background:var(--teal-dark);color:#fff;border:none;border-radius:10px;
    padding:11px 18px;font-size:13.5px;font-weight:700;cursor:pointer;
    font-family:inherit;display:inline-flex;align-items:center;gap:6px;
    transition:background .15s;
  }
  .btn:hover{background:#095f36;}
  .btn-ghost{background:#fff;color:var(--text);border:1px solid var(--border);}
  .btn-ghost:hover{background:#faf8f4;}
  .btn-danger{background:var(--red-tint);color:var(--red);}
  .btn-danger:hover{background:#f2d3ce;}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}

  .info-banner{
    background:var(--blue-tint);border:1px solid #dadfe8;color:#3d4759;
    padding:13px 16px;border-radius:12px;font-size:13px;margin-bottom:18px;
  }

  .alerts-stack{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
  .alert-banner{
    display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-radius:12px;border:1px solid;
  }
  .alert-banner.red{background:var(--red-tint);border-color:#f0d2ce;}
  .alert-banner.amber{background:var(--amber-tint);border-color:#efdcb3;}
  .alert-icon{
    width:30px;height:30px;border-radius:9px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  .alert-banner.red .alert-icon{background:#f2d3ce;color:var(--red);}
  .alert-banner.amber .alert-icon{background:#efdcb3;color:#8f6318;}
  .alert-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
  .alert-text b{font-size:13.5px;font-weight:700;}
  .alert-text span{font-size:12px;color:var(--text-dim);}
  .alert-banner .btn-ghost{flex-shrink:0;background:#fff;}

  .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .defaulters-row{display:grid;grid-template-columns:1fr 240px;gap:14px;margin-top:16px;align-items:start;}
  .compact-chart-row{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:4px 0 2px 0;}
  .compact-pie{flex-shrink:0;display:flex;flex-direction:column;align-items:center;}
  .compact-bar{flex:1;min-width:200px;}
  .compact-bar-title{font-size:12px;color:var(--text-dim);font-weight:600;margin-bottom:6px;}
  .chart-card svg{display:block;width:100%;height:auto;margin-top:8px;}
  .chart-legend{display:flex;gap:14px;font-size:12px;color:var(--text-dim);}
  .chart-legend span{display:inline-flex;align-items:center;gap:5px;}
  .chart-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .chart-empty{font-size:12.5px;color:var(--text-dim);text-align:center;padding:40px 10px;}

  .nav-badge{
    background:var(--red);color:#fff;font-size:10px;font-weight:700;
    border-radius:20px;min-width:17px;height:17px;padding:0 5px;
    display:inline-flex;align-items:center;justify-content:center;
    margin-inline-start:auto;line-height:1;
  }

  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  .stat-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;position:relative;overflow:hidden;box-shadow:var(--shadow);
  }
  .stat-card::before{
    content:'';position:absolute;top:0;right:0;left:0;height:3px;
    background:var(--teal);
  }
  .stat-card .num{font-size:27px;font-weight:800;margin-top:6px;letter-spacing:-.3px;}
  .stat-card .lbl{font-size:12.5px;color:var(--text-dim);font-weight:600;}
  .stat-card.tint-green{background:var(--green-tint);border-color:#cdeadb;}
  .stat-card.tint-green::before{background:var(--green);}
  .stat-card.tint-blue{background:var(--blue-tint);border-color:#d7dce6;}
  .stat-card.tint-blue::before{background:var(--blue);}
  .stat-card.tint-amber{background:var(--amber-tint);border-color:#eddcb0;}
  .stat-card.tint-amber::before{background:var(--amber);}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .panel-title{font-weight:700;font-size:14.5px;margin-bottom:14px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:right;color:var(--text-dim);font-weight:600;font-size:12px;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:#faf8f4;}
  td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#faf8f4;}

  .badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge.green{background:var(--green-tint);color:var(--green);}
  .badge.amber{background:var(--amber-tint);color:#8f6318;}
  .badge.blue{background:var(--blue-tint);color:var(--blue);}
  .badge.red{background:var(--red-tint);color:var(--red);}
  .badge.gray{background:#efece5;color:#68635a;}

  .filters-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .filters-row select, .filters-row input{
    border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13px;
    font-family:inherit;background:#fff;color:var(--text);
  }
  .filters-row input[type=text]{flex:1;min-width:180px;}

  .req-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .req-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .req-tags{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .req-title{font-weight:700;font-size:15px;margin-bottom:4px;}
  .req-desc{font-size:12.5px;color:var(--text-dim);margin-bottom:12px;line-height:1.5;}
  .req-meta{background:#faf8f4;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;color:#454138;}
  .req-meta-row{display:flex;justify-content:space-between;padding:3px 0;}
  .req-meta-row b{font-weight:600;color:var(--text);}
  .req-actions{display:flex;gap:8px;margin-top:12px;}

  .icon-btn{background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:14px;padding:4px 6px;border-radius:6px;}
  .icon-btn:hover{background:#efece5;color:var(--text);}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(36,39,45,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);}
  .modal h3{margin:0 0 16px 0;font-size:17px;font-weight:800;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;
    font-size:13.5px;font-family:inherit;color:var(--text);background:#fff;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn,.modal-actions .btn-ghost{flex:1;justify-content:center;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .empty{text-align:center;color:var(--text-dim);font-size:13px;padding:30px 10px;}

  /* Login / setup screen */
  .auth-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);padding:20px;
  }
  .auth-card{
    background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:380px;
    box-shadow:0 24px 60px rgba(20,18,14,.3);
  }
  .auth-logo{
    width:56px;height:56px;border-radius:14px;margin:0 auto 16px auto;
    background:var(--bg);border:1px solid var(--border);overflow:hidden;
    display:flex;align-items:center;justify-content:center;color:var(--text);font-weight:800;font-size:19px;
  }
  .auth-logo img{width:100%;height:100%;object-fit:contain;padding:5px;}
  .auth-card h2{text-align:center;font-size:19px;font-weight:800;margin:0 0 4px 0;}
  .auth-card p.sub{text-align:center;color:var(--text-dim);font-size:12.5px;margin:0 0 22px 0;}
  .auth-error{
    background:var(--red-tint);color:var(--red);font-size:12.5px;border-radius:9px;
    padding:9px 12px;margin-bottom:14px;display:none;
  }
  .auth-error.show{display:block;}
  .auth-note{
    background:var(--blue-tint);color:#3d4759;font-size:11.5px;border-radius:9px;
    padding:9px 12px;margin-top:16px;line-height:1.6;
  }
  .auth-links{text-align:center;margin-top:14px;}
  .auth-links button{
    background:none;border:none;color:var(--text-dim);font-size:12px;cursor:pointer;
    font-family:inherit;text-decoration:underline;
  }

  @media(max-width:900px){
    #app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;align-items:center;}
    .sidebar-header{border:none;margin:0;padding:0 10px 0 0;}
    .nav{flex-direction:row;}
    .nav-item{white-space:nowrap;flex-shrink:0;}
    .nav-divider{width:1px;height:24px;margin:0 6px;flex-shrink:0;}
    .sidebar-footer{display:none;}
    .stats-row{grid-template-columns:repeat(2,1fr);}
    .charts-row{grid-template-columns:1fr;}
    .defaulters-row{grid-template-columns:1fr;}
    .compact-chart-row{flex-direction:column;align-items:stretch;}
    .compact-pie{align-items:center;}
    .req-grid{grid-template-columns:1fr;}
    .main{padding:18px 14px;}
    .alert-banner{flex-wrap:wrap;}
  }
</style>
</head>
<body>

<div id="authScreen" class="auth-wrap"></div>

<div id="app" style="display:none;">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo" id="bldgInitial"><img src="" id="bldgLogoImg" alt="شعار"></div>
      <div>
        <div class="sidebar-title" id="bldgName">عمارتي</div>
        <div class="sidebar-sub">لوحة رئيس اتحاد الملاك</div>
      </div>
    </div>
    <div class="nav" id="navList"></div>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar">👤</div>
        <div>
          <div class="sidebar-user-name" id="authUserLabel">رئيس اتحاد الملاك</div>
          <div class="sidebar-user-role">manager@building.local</div>
        </div>
      </div>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>

const SUPABASE_URL = "https://oozvrsncwzausokcenhy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_juhc8_HhtPYLlYtaVGb0XA_ZBnzQO3e";
let supabaseClient = null;
function getSupabaseClient(){
  if(!supabaseClient && typeof supabase !== 'undefined' && supabase.createClient){
    try{ supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }catch(e){ console.error('Supabase init failed', e); }
  }
  return supabaseClient;
}
let lastCloudSyncOk = true;
async function cloudGet(key){
  const client = getSupabaseClient();
  if(!client){ lastCloudSyncOk = false; return null; }
  try{
    const { data, error } = await client.from('app_state').select('data').eq('id', key).maybeSingle();
    if(error){ console.error('Supabase get error', error); lastCloudSyncOk = false; return null; }
    lastCloudSyncOk = true;
    if(data && data.data) return JSON.stringify(data.data);
    return null;
  }catch(e){ console.error('Supabase get exception', e); lastCloudSyncOk = false; return null; }
}
async function cloudSet(key, value){
  const client = getSupabaseClient();
  if(!client){ lastCloudSyncOk = false; return false; }
  try{
    const payload = JSON.parse(value);
    const { error } = await client.from('app_state').upsert({ id: key, data: payload, updated_at: new Date().toISOString() });
    if(error){ console.error('Supabase set error', error); lastCloudSyncOk = false; return false; }
    lastCloudSyncOk = true;
    return true;
  }catch(e){ console.error('Supabase set exception', e); lastCloudSyncOk = false; return false; }
}

const hasClaudeStorage = () => typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
let hasLocalStorage = false;
try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); hasLocalStorage = true; }catch(e){ hasLocalStorage = false; }

// Generic persistence: prefer Claude's storage (works inside claude.ai),
// fall back to the browser's own localStorage (works when the file is opened
// directly / hosted anywhere else), so data survives either way.
function isCloudBackedKey(key){
  return key === STORE_KEY || key.startsWith('attachment:');
}
async function storageGet(key){
  if(isCloudBackedKey(key)){
    const cloudVal = await cloudGet(key);
    if(cloudVal) return cloudVal;
  }
  if(hasClaudeStorage()){
    try{ const r = await window.storage.get(key, false); if(r && r.value) return r.value; }catch(e){}
  }
  if(hasLocalStorage){
    try{ const v = localStorage.getItem(key); if(v) return v; }catch(e){}
  }
  return null;
}
async function storageSet(key, value){
  if(isCloudBackedKey(key)){
    await cloudSet(key, value);
  }
  if(hasClaudeStorage()){
    try{ await window.storage.set(key, value, false); }catch(e){}
  }
  if(hasLocalStorage){
    try{ localStorage.setItem(key, value); }catch(e){}
  }
}
async function cloudRemove(key){
  const client = getSupabaseClient();
  if(!client) return false;
  try{
    const { error } = await client.from('app_state').delete().eq('id', key);
    if(error){ console.error('Supabase delete error', error); return false; }
    return true;
  }catch(e){ console.error('Supabase delete exception', e); return false; }
}
async function storageRemove(key){
  if(isCloudBackedKey(key)){
    await cloudRemove(key);
  }
  if(hasClaudeStorage()){
    try{ await window.storage.delete(key, false); }catch(e){}
  }
  if(hasLocalStorage){
    try{ localStorage.removeItem(key); }catch(e){}
  }
}

async function supaGetSession(){
  const client = getSupabaseClient();
  if(!client) return null;
  try{
    const { data } = await client.auth.getSession();
    return data && data.session ? data.session : null;
  }catch(e){ return null; }
}
async function supaLogin(email, password){
  const client = getSupabaseClient();
  if(!client) return { data:null, error: { message: 'تعذّر الاتصال بالخادم' } };
  return await client.auth.signInWithPassword({ email, password });
}
async function supaLogout(){
  const client = getSupabaseClient();
  if(client){ try{ await client.auth.signOut(); }catch(e){} }
}
async function supaResetPassword(email){
  const client = getSupabaseClient();
  if(!client) return { error: { message: 'تعذّر الاتصال بالخادم' } };
  return await client.auth.resetPasswordForEmail(email);
}
function logout(){
  supaLogout().then(()=>location.reload());
}

async function submitLogin(){
  const email = document.getElementById('au-email').value.trim();
  const pass = document.getElementById('au-pass').value;
  if(!email || !pass){ showAuthScreen('login', null, 'الرجاء تعبئة البريد الإلكتروني وكلمة المرور'); return; }
  const { data, error } = await supaLogin(email, pass);
  if(error || !data || !data.session){
    showAuthScreen('login', null, 'البريد الإلكتروني أو كلمة المرور غير صحيحة');
    return;
  }
  await enterApp();
}
async function submitReset(){
  const email = document.getElementById('au-email').value.trim();
  if(!email){ showAuthScreen('reset', null, 'الرجاء إدخال البريد الإلكتروني'); return; }
  const { error } = await supaResetPassword(email);
  if(error){
    showAuthScreen('reset', null, 'تعذّر إرسال الرابط، تأكد من البريد الإلكتروني');
    return;
  }
  showAuthScreen('login', null, 'تم إرسال رابط إعادة التعيين إلى بريدك الإلكتروني ✅');
}
async function enterApp(){
  document.getElementById('authScreen').style.display = 'none';

  if(!state) await loadState();

  if(session && session.user) document.getElementById('authUserLabel').textContent = session.user.email;
  render();
}

/* ---------------- chart helpers ---------------- */
const CHART_MONTHS_SHORT = {'01':'ينا','02':'فبر','03':'مار','04':'أبر','05':'ماي','06':'يون','07':'يول','08':'أغس','09':'سبت','10':'أكت','11':'نوف','12':'ديس'};
function chartMonthLabel(key){
  const m = key.split('-')[1];
  return CHART_MONTHS_SHORT[m]||m;
}
function lastNMonthKeys(n){
  const out=[];
  const now = new Date();
  for(let i=n-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  return out;
}
function getMonthlyFinance(n){
  return lastNMonthKeys(n).map(k=>{
    const income = state.transactions.filter(t=>t.type==='income' && (t.date||'').slice(0,7)===k).reduce((s,t)=>s+Number(t.amount),0);
    const expense = state.transactions.filter(t=>t.type==='expense' && (t.date||'').slice(0,7)===k).reduce((s,t)=>s+Number(t.amount),0);
    return {month:k, income, expense};
  });
}
function getMonthlyCollectionRate(n){
  return lastNMonthKeys(n).map(k=>{
    let due=0, paid=0;
    state.units.forEach(u=>{
      const rec = state.payments[u.id+'|'+k];
      const amount = rec ? Number(rec.amount) : Number(u.monthlyFee||200);
      due += amount;
      if(rec && rec.paid) paid += amount;
    });
    const rate = due>0 ? Math.round((paid/due)*100) : 0;
    return {month:k, due, paid, rate};
  });
}
function buildFinanceChartSVG(data){
  const hasAny = data.some(d=>d.income>0 || d.expense>0);
  if(!hasAny) return '<div class="chart-empty">لا توجد حركات مالية خلال الفترة لعرض الرسم البياني</div>';
  const w=520, h=210, padL=42, padR=8, padT=14, padB=28;
  const chartW = w-padL-padR, chartH = h-padT-padB;
  const maxVal = Math.max(1, ...data.map(d=>Math.max(d.income,d.expense)));
  const groupW = chartW/data.length;
  const barW = Math.min(20, groupW*0.28);
  let bars='', grid='';
  for(let i=0;i<=3;i++){
    const y = padT + chartH - (chartH*i/3);
    const val = Math.round(maxVal*i/3);
    grid += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#e6e9ee" stroke-width="1"></line>`;
    grid += `<text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9.5" fill="#6b7684">${fmt(val)}</text>`;
  }
  data.forEach((d,i)=>{
    const cx = padL + i*groupW + groupW/2;
    const hIncome = (d.income/maxVal)*chartH;
    const hExpense = (d.expense/maxVal)*chartH;
    bars += `<rect x="${cx-barW-2}" y="${padT+chartH-hIncome}" width="${barW}" height="${Math.max(hIncome,0)}" rx="2.5" fill="#1f9d55"></rect>`;
    bars += `<rect x="${cx+2}" y="${padT+chartH-hExpense}" width="${barW}" height="${Math.max(hExpense,0)}" rx="2.5" fill="#e0524a"></rect>`;
    bars += `<text x="${cx}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="#6b7684">${chartMonthLabel(d.month)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${grid}${bars}</svg>`;
}
function buildCollectionChartSVG(data){
  const hasAny = data.some(d=>d.due>0);
  if(!hasAny) return '<div class="chart-empty">لا توجد بيانات دفعات كافية لعرض الرسم البياني</div>';
  const w=520, h=210, padL=36, padR=8, padT=18, padB=28;
  const chartW = w-padL-padR, chartH = h-padT-padB;
  const groupW = chartW/data.length;
  const barW = Math.min(30, groupW*0.5);
  let bars='', grid='';
  [0,25,50,75,100].forEach(v=>{
    const y = padT + chartH - (chartH*v/100);
    grid += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#e6e9ee" stroke-width="1"></line>`;
    grid += `<text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9.5" fill="#6b7684">${v}%</text>`;
  });
  data.forEach((d,i)=>{
    const cx = padL + i*groupW + groupW/2;
    const hBar = (d.rate/100)*chartH;
    const color = d.rate>=90 ? '#1f9d55' : d.rate>=60 ? '#f6c453' : '#e0524a';
    bars += `<rect x="${cx-barW/2}" y="${padT+chartH-hBar}" width="${barW}" height="${Math.max(hBar,1)}" rx="3" fill="${color}"></rect>`;
    bars += `<text x="${cx}" y="${padT+chartH-hBar-6}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#16202c">${d.rate}%</text>`;
    bars += `<text x="${cx}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="#6b7684">${chartMonthLabel(d.month)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${grid}${bars}</svg>`;
}

function polarToCartesian(cx,cy,r,angleDeg){
  const rad = angleDeg * Math.PI/180;
  return { x: cx + r*Math.sin(rad), y: cy - r*Math.cos(rad) };
}
function describeArc(cx,cy,r,startAngle,endAngle){
  const start = polarToCartesian(cx,cy,r,startAngle);
  const end = polarToCartesian(cx,cy,r,endAngle);
  const largeArcFlag = (endAngle-startAngle) <= 180 ? 0 : 1;
  return `M ${cx} ${cy} L ${start.x.toFixed(2)} ${start.y.toFixed(2)} A ${r} ${r} 0 ${largeArcFlag} 1 ${end.x.toFixed(2)} ${end.y.toFixed(2)} Z`;
}
function buildStatusPieSVG(settledCount, owingCount, size){
  size = size || 180;
  const total = settledCount+owingCount;
  if(total===0) return '<div class="chart-empty">لا توجد شقق بعد</div>';
  const cx=size/2, cy=size/2, r=size*0.4, holeR=size*0.22;
  const owingAngle = (owingCount/total)*360;
  let paths='';
  if(owingCount>0) paths += `<path d="${describeArc(cx,cy,r,0,owingAngle)}" fill="#c1443a"></path>`;
  if(settledCount>0) paths += `<path d="${describeArc(cx,cy,r,owingAngle,360)}" fill="#2f8f5b"></path>`;
  const owingPct = Math.round((owingCount/total)*100);
  const numFontSize = Math.round(size*0.122);
  const lblFontSize = Math.round(size*0.058);
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">
    ${paths}
    <circle cx="${cx}" cy="${cy}" r="${holeR}" fill="#ffffff"></circle>
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="${numFontSize}" font-weight="800" fill="#26282c">${owingPct}%</text>
    <text x="${cx}" y="${cy+size*0.083}" text-anchor="middle" font-size="${lblFontSize}" fill="#7a746b">متأخرون</text>
  </svg>`;
}

function arrearsSeverityColor(amount){
  if(amount >= 1000) return '#c0392b';
  if(amount >= 400) return '#e0524a';
  return '#f0a75c';
}
function buildArrearsBarChartSVG(defaulters, opts){
  if(defaulters.length===0) return '<div class="chart-empty">لا يوجد أعضاء متأخرون لعرضهم بالرسم البياني 🎉</div>';
  const compact = opts && opts.compact;
  const n = defaulters.length;
  const colW = compact ? 26 : 42, gap = compact ? 10 : 16;
  const padL = compact ? 34 : 44, padR = compact ? 8 : 14, padT = compact ? 18 : 24, padB = compact ? 26 : 34;
  const chartH = compact ? 110 : 190;
  const chartW = n*colW + (n-1)*gap;
  const w = padL + padR + chartW;
  const h = padT + chartH + padB;
  const maxVal = Math.max(1, ...defaulters.map(u=>Math.abs(u.totalDue)));
  const niceMax = Math.ceil(maxVal/500)*500 || maxVal;
  const gridFont = compact ? 7.5 : 9;
  const valFont = compact ? 8.5 : 10.5;
  const lblFont = compact ? 9 : 11;

  let gridLines = '', gridLabels = '', bars = '';
  [0,0.5,1].forEach(f=>{
    const y = padT + chartH - chartH*f;
    gridLines += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="#eef0f3" stroke-width="1"></line>`;
    gridLabels += `<text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="${gridFont}" fill="#9aa4b2">${fmt(Math.round(niceMax*f))}</text>`;
  });
  defaulters.forEach((u,i)=>{
    const x = padL + i*(colW+gap);
    const val = Math.abs(u.totalDue);
    const barH = (val/niceMax)*chartH;
    const color = arrearsSeverityColor(val);
    /* Digits only for the axis label — mixing Arabic words with numbers inside
       SVG text breaks under RTL bidi reordering (garbles into unreadable text
       when printed), so the chart shows just the unit number; the full label
       (شقة + الاسم) stays in the table right below it. */
    const unitNum = (String(u.number).match(/\d+/)||[u.number])[0];
    bars += `<rect x="${x.toFixed(1)}" y="${(padT+chartH-barH).toFixed(1)}" width="${colW}" height="${Math.max(barH,2).toFixed(1)}" rx="${compact?3:4}" fill="${color}"></rect>`;
    if(!compact) bars += `<text x="${(x+colW/2).toFixed(1)}" y="${(padT+chartH-barH-6).toFixed(1)}" text-anchor="middle" font-size="${valFont}" font-weight="700" fill="${color}">${fmt(val)}</text>`;
    bars += `<text x="${(x+colW/2).toFixed(1)}" y="${(padT+chartH+(compact?15:18)).toFixed(1)}" text-anchor="middle" font-size="${lblFont}" font-weight="700" fill="#26282c">${esc(unitNum)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${Math.min(h,compact?140:260)}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">${gridLines}${gridLabels}${bars}</svg>`;
}
function buildArrearsSeverityLegendHTML(){
  return `<div class="chart-legend" style="margin-top:4px;">
    <span><i style="background:#f0a75c"></i>أقل من 400 ر.س</span>
    <span><i style="background:#e0524a"></i>400 – 999 ر.س</span>
    <span><i style="background:#c0392b"></i>1000 ر.س فأكثر</span>
  </div>
  <div style="font-size:11px;color:var(--text-dim);margin-top:2px;">الأرقام أسفل الأعمدة هي أرقام الشقق (بدون كلمة "شقة") لضمان وضوح الطباعة.</div>`;
}

/* ---------------- payments ---------------- */
function currentMonthKey(){
  const now = new Date();
  return now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
}
function lastCompletedMonthKey(){
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth()-1, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function firstBillingMonthKey(){
  if(state.billingStartMonth) return state.billingStartMonth;
  let min = null;
  Object.keys(state.payments).forEach(k=>{
    const month = k.split('|')[1];
    if(!min || month < min) min = month;
  });
  return min || currentMonthKey();
}
function monthsBetweenInclusive(startKey, endKey){
  if(startKey > endKey) return [];
  const out = [];
  let [y,m] = startKey.split('-').map(Number);
  const [ey,em] = endKey.split('-').map(Number);
  while(y<ey || (y===ey && m<=em)){
    out.push(y+'-'+String(m).padStart(2,'0'));
    m++; if(m>12){ m=1; y++; }
  }
  return out;
}
function monthBefore(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  const d = new Date(y, m-2, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
/* Net position (paid minus due) for a unit across an arbitrary month range —
   same logic as computeUnitDuesThisYear but for any custom [fromKey,toKey] window,
   used by the print report so the admin can choose exactly which months to include. */
function computeUnitNetForRange(unit, fromKey, toKey){
  const months = monthsBetweenInclusive(fromKey, toKey);
  let due=0, paid=0;
  months.forEach(mk=>{
    const rec = state.payments[unit.id+'|'+mk];
    const amount = rec ? Number(rec.amount) : Number(unit.monthlyFee||200);
    due += amount;
    if(rec && rec.paid) paid += amount;
  });
  return paid - due;
}
/* Balance carried into the report from before the chosen "from" month:
   the manual pre-system arrears plus any earlier unpaid billing months. */
function computeUnitPriorArrears(unit, fromKey){
  const start = firstBillingMonthKey();
  if(fromKey <= start) return Number(unit.arrearsPrevious||0);
  return Number(unit.arrearsPrevious||0) + computeUnitNetForRange(unit, start, monthBefore(fromKey));
}
/* Every riyal a unit has actually been marked as paid, from the building's
   billing start month onward — this respects state.billingStartMonth if set,
   so months before you took over management don't count, but their payment
   records stay untouched and visible in the monthly payments page. */
function computeUnitCollected(unit){
  let total = 0;
  const prefix = unit.id+'|';
  const start = firstBillingMonthKey();
  Object.keys(state.payments).forEach(k=>{
    if(!k.startsWith(prefix)) return;
    const month = k.split('|')[1];
    if(month < start) return;
    if(state.payments[k].paid) total += Number(state.payments[k].amount)||0;
  });
  return total;
}
/* What the unit owes (or has overpaid) for months that have already fully elapsed,
   counting from the building's first billing month through last completed month.
   The current month is not counted yet — dues aren't "late" until the month is over. */
function computeUnitDuesThisYear(unit){
  const start = firstBillingMonthKey();
  const end = lastCompletedMonthKey();
  const months = monthsBetweenInclusive(start, end);
  let due=0, paid=0;
  months.forEach(mk=>{
    const rec = state.payments[unit.id+'|'+mk];
    const amount = rec ? Number(rec.amount) : Number(unit.monthlyFee||200);
    due += amount;
    if(rec && rec.paid) paid += amount;
  });
  return paid - due;
}
function syncUnitFinancials(unit){
  unit.collected = computeUnitCollected(unit);
  unit.duesThisYear = computeUnitDuesThisYear(unit);
  unit.totalDue = Number(unit.arrearsPrevious||0) + unit.duesThisYear;
}
function syncAllUnitsFinancials(){
  let changed = false;
  state.units.forEach(u=>{
    const before = JSON.stringify([u.collected,u.duesThisYear,u.totalDue]);
    syncUnitFinancials(u);
    if(JSON.stringify([u.collected,u.duesThisYear,u.totalDue]) !== before) changed = true;
  });
  return changed;
}

function computeRoomDue(room){
  if(!room.tenant || !room.startMonth || Number(room.monthlyRent)<=0){
    return { monthsDue:0, totalDue:0, remaining:0 };
  }
  const months = monthsBetweenInclusive(room.startMonth, currentMonthKey());
  const monthsDue = months.length;
  const totalDue = monthsDue * Number(room.monthlyRent);
  const remaining = totalDue - Number(room.collected||0);
  return { monthsDue, totalDue, remaining };
}

function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(new Error('read failed'));
    r.readAsDataURL(file);
  });
}
/* Phone camera photos are often 8-15MB — way past what an invoice attachment
   needs. Downscale to a reasonable max width and re-encode as JPEG so normal
   photos comfortably fit the size limit without the person needing to resize
   anything themselves. PDFs and already-small images pass through untouched. */
function compressImageFile(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h*(maxWidth/w)); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('image load failed'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}
function estimateDataUrlBytes(dataUrl){
  const idx = dataUrl.indexOf(',');
  const b64 = idx>-1 ? dataUrl.slice(idx+1) : dataUrl;
  return Math.ceil(b64.length * 0.75);
}
async function saveTx(id){
  const type = document.getElementById('f-txtype').value;
  const amount = Number(document.getElementById('f-txamount').value)||0;
  const category = document.getElementById('f-txcat').value.trim()||'عام';
  const method = document.getElementById('f-txmethod').value;
  const note = document.getElementById('f-txnote').value.trim();
  const date = document.getElementById('f-txdate').value;
  const fileInput = document.getElementById('f-txfile');
  const file = fileInput && fileInput.files && fileInput.files[0];

  let tx;
  if(id){
    tx = state.transactions.find(x=>x.id===id);
    Object.assign(tx, {type, amount, category, method, note, date});
  } else {
    tx = {id:'t'+(state.nextIds.tx++), type, amount, category, method, note, date, hasAttachment:false};
    state.transactions.push(tx);
  }

  if(file){
    let dataUrl, mimeType = file.type, sizeBytes = file.size;
    if(file.type.startsWith('image/')){
      try{
        dataUrl = await compressImageFile(file, 1600, 0.75);
        mimeType = 'image/jpeg';
        sizeBytes = estimateDataUrlBytes(dataUrl);
      }catch(e){
        dataUrl = await readFileAsDataURL(file);
      }
    } else {
      dataUrl = await readFileAsDataURL(file);
    }
    if(sizeBytes > 4.5*1024*1024){
      alert('حجم الملف كبير جدًا حتى بعد الضغط (الحد الأقصى تقريبًا 4.5 ميغابايت) — جرب صورة أخرى أو ملف أصغر');
    } else {
      try{
        await storageSet('attachment:'+tx.id, JSON.stringify({name:file.name, type:mimeType, data:dataUrl}));
        tx.hasAttachment = true;
        tx.attachmentName = file.name;
      }catch(e){ alert('تعذّر حفظ المرفق'); }
    }
  }

  await saveState(); closeModal(); render();
}
async function deleteTx(id){
  state.transactions = state.transactions.filter(t=>t.id!==id);
  await storageRemove('attachment:'+id);
  await saveState(); render();
}
async function viewAttachment(id){
  try{
    const raw = await storageGet('attachment:'+id);
    if(!raw){ alert('تعذّر العثور على المرفق'); return; }
    const {name, type, data} = JSON.parse(raw);
    const w = window.open('', '_blank');
    if(!w){ alert('يرجى السماح بالنوافذ المنبثقة لعرض المرفق'); return; }
    const body = type && type.startsWith('image')
      ? `<img src="${data}" style="max-width:100%;max-height:100vh;display:block;margin:auto;">`
      : `<iframe src="${data}" style="width:100vw;height:100vh;border:none;"></iframe>`;
    w.document.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>${esc(name)}</title>
      <style>html,body{margin:0;background:#22282a;min-height:100vh;}</style>
      </head><body>${body}</body></html>`);
    w.document.close();
  }catch(e){ alert('تعذّر عرض المرفق'); }
}

    <table class="stmt-info">
      <tr><td><b>عنوان الطلب:</b> ${esc(m.title)}</td><td><b>الحالة:</b> ${esc(m.status)}</td></tr>
      <tr><td><b>الموقع:</b> ${esc(m.location||'—')}</td><td><b>الشقة:</b> ${esc(m.unit||'—')}</td></tr>
      <tr><td><b>نوع الصيانة:</b> ${esc(m.type)}</td><td><b>الأولوية:</b> ${esc(m.priority)}</td></tr>
      <tr><td><b>تاريخ البلاغ:</b> ${esc(m.reportDate)}</td><td><b>بدء التنفيذ:</b> ${esc(m.startDate||'—')}</td></tr>
      <tr><td><b>انتهاء التنفيذ:</b> ${esc(m.endDate||'—')}</td><td></td></tr>
    </table>
    <div class="stmt-section-title">الوصف</div>
    <p style="font-size:13px;line-height:1.7;">${esc(m.desc||'—')}</p>`;
}
function buildMntReportHTML(list, title){
  const today = new Date().toLocaleDateString('ar-SA');
  const body = list.map(m=>`
    <div class="stmt-page">
      <div class="stmt-header">
        <img src="${LOGO_URI}" class="stmt-logo" alt="شعار">
        <div>
          <div class="stmt-building">${esc(state.buildingName)}</div>
          <div class="stmt-title">${esc(title)}</div>
        </div>
        <div class="stmt-date">تاريخ الطباعة: ${today}</div>
      </div>
      ${buildMntCardHTML(m)}
      <div class="stmt-stamp-wrap"><img src="${STAMP_URI}" class="stmt-stamp" alt="ختم"></div>
      <div class="stmt-footer">هذا المستند صادر آليًا من نظام إدارة العمارة ولا يحتاج توقيعًا.</div>
    </div>`).join('\n');
  return body;
}
function printMntItem(id){
  const m = state.maintenance.find(x=>x.id===id);
  if(!m) return;
  const w = window.open('', '_blank');
  if(!w){ alert('يرجى السماح بالنوافذ المنبثقة للطباعة'); return; }
  w.document.write(`<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8">
    <title>طلب صيانة - ${esc(m.title)}</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>${STMT_STYLE}</style></head>
    <body>${buildMntReportHTML([m], 'طلب صيانة')}
    <script>window.onload=()=>{setTimeout(()=>window.print(),300);}<\/script>
    </body></html>`);
  w.document.close();
}
function printMaintenanceReport(){
  if(state.maintenance.length===0){ alert('لا توجد طلبات صيانة لطباعتها'); return; }
  let list = state.maintenance;
  if(mntFilterStatus!=='الكل') list = list.filter(m=>m.status===mntFilterStatus);
  const w = window.open('', '_blank');
  if(!w){ alert('يرجى السماح بالنوافذ المنبثقة للطباعة'); return; }
  w.document.write(`<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8">
    <title>طلبات الصيانة - ${esc(state.buildingName)}</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>${STMT_STYLE}</style></head>
    <body>${buildMntReportHTML(list, 'طلب صيانة')}
    <script>window.onload=()=>{setTimeout(()=>window.print(),400);}<\/script>
    </body></html>`);
  w.document.close();
}
async function advanceMnt(id){
  const m = state.maintenance.find(x=>x.id===id);
  if(m.status==='طلب جديد'){ m.status='قيد التنفيذ'; if(!m.startDate) m.startDate = new Date().toISOString().slice(0,10); }
  else if(m.status==='قيد التنفيذ'){ m.status='مكتملة'; if(!m.endDate) m.endDate = new Date().toISOString().slice(0,10); }
  await saveState(); render();
}
async function deleteMnt(id){
  state.maintenance = state.maintenance.filter(m=>m.id!==id);
  await saveState(); render();
}
function openMntModal(id){
  const m = id ? state.maintenance.find(x=>x.id===id) : null;
  const unitOptions = ['<option value="—">—</option>'].concat(state.units.map(u=>`<option value="${u.number}" ${m&&m.unit===u.number?'selected':''}>${u.number}</option>`)).join('');
  showModal(`
    <h3>${m?'تعديل طلب صيانة':'طلب صيانة جديد'}</h3>
    <div class="field"><label>عنوان الطلب</label><input id="f-mtitle" value="${m?m.title:''}"></div>
    <div class="field"><label>الوصف</label><textarea id="f-mdesc">${m?m.desc:''}</textarea></div>
    <div class="two-col">
      <div class="field"><label>الموقع</label><input id="f-mloc" value="${m?m.location:''}"></div>
      <div class="field"><label>الشقة</label><select id="f-munit">${unitOptions}</select></div>
    </div>
    <div class="two-col">
      <div class="field"><label>تاريخ بدء التنفيذ</label><input id="f-mstart" type="date" value="${m&&m.startDate?m.startDate:''}"></div>
      <div class="field"><label>تاريخ انتهاء التنفيذ</label><input id="f-mend" type="date" value="${m&&m.endDate?m.endDate:''}"></div>
    </div>
    <div class="two-col">
      <div class="field"><label>نوع الصيانة</label>
        <select id="f-mtype">
          <option ${m&&m.type==='كهرباء وإنارة'?'selected':''}>كهرباء وإنارة</option>
          <option ${m&&m.type==='سباكة ومياه'?'selected':''}>سباكة ومياه</option>
          <option ${m&&m.type==='تكييف'?'selected':''}>تكييف</option>
          <option ${m&&m.type==='مصاعد'?'selected':''}>مصاعد</option>
          <option ${m&&m.type==='أخرى'?'selected':''}>أخرى</option>
        </select>
      </div>
      <div class="field"><label>الأولوية</label>
        <select id="f-mpriority">
          <option ${m&&m.priority==='منخفضة'?'selected':''}>منخفضة</option>
          <option ${!m||m.priority==='عادية'?'selected':''}>عادية</option>
          <option ${m&&m.priority==='عاجلة'?'selected':''}>عاجلة</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn" onclick="saveMnt('${id||''}')">حفظ</button>
    </div>
  `);
}
async function saveMnt(id){
  const data = {
    title: document.getElementById('f-mtitle').value.trim()||'طلب صيانة',
    desc: document.getElementById('f-mdesc').value.trim(),
    location: document.getElementById('f-mloc').value.trim(),
    unit: document.getElementById('f-munit').value,
    startDate: document.getElementById('f-mstart').value,
    endDate: document.getElementById('f-mend').value,
    type: document.getElementById('f-mtype').value,
    priority: document.getElementById('f-mpriority').value
  };
  if(id){ Object.assign(state.maintenance.find(x=>x.id===id), data); }
  else{
    state.maintenance.push({
      id:'m'+(state.nextIds.mnt++), ...data,
      status:'طلب جديد', reportDate:new Date().toISOString().slice(0,10)
    });
  }
  await saveState(); closeModal(); render();
}

/* ---------------- modal helpers ---------------- */
function showModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });

/* ---------------- boot ---------------- */
(async function boot(){
  await loadState(); // load building data in the background either way
  await saveState(); // push straight to the cloud so existing local data migrates immediately
  const session = await supaGetSession();
  if(session){
    await enterApp();
  } else {
    showAuthScreen('login', null, '');
  }
})();
</script>
</body>
</html>
